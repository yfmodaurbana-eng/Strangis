<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #151515 0%,
            #292929 38%,
            #4d4d4d 65%,
            #222 100%
        );
}

button,
input,
textarea{
    font:inherit;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:16px 5%;

    display:flex;
    align-items:center;
    gap:28px;

    border-bottom:1px solid rgba(255,255,255,.12);

    background:rgba(20,20,20,.94);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.logo{
    flex-shrink:0;

    font-size:22px;
    font-weight:900;

    letter-spacing:4px;
}

nav{
    flex:1;

    display:flex;
    align-items:center;
    gap:12px;

    overflow-x:auto;
    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    flex:0 0 auto;

    padding:8px 13px;

    border:1px solid transparent;
    border-radius:7px;

    color:#999;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;

    letter-spacing:1.3px;
    text-transform:uppercase;

    white-space:nowrap;

    transition:.2s;
}

nav a:hover{
    color:#fff;
    background:rgba(255,255,255,.05);
    border-color:rgba(255,255,255,.16);
}

nav a.active{
    color:#111;
    background:#fff;
    border-color:#fff;
}

/* =========================
   PAGE
========================= */

.page{
    width:min(1400px,92%);
    margin:auto;

    padding:
        clamp(35px,6vw,75px)
        0
        100px;
}

.back{
    display:inline-flex;
    align-items:center;
    gap:8px;

    margin-bottom:30px;

    color:#aaa;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;

    letter-spacing:1px;
    text-transform:uppercase;
}

.back:hover{
    color:#fff;
}

/* =========================
   PRODUCT
========================= */

.product-layout{
    display:grid;

    grid-template-columns:
        minmax(0,1.25fr)
        minmax(360px,.75fr);

    gap:45px;

    align-items:start;
}

/* =========================
   GALLERY
========================= */

.gallery{
    position:relative;

    width:100%;
}

.main-image{
    position:relative;

    width:100%;

    min-height:620px;

    overflow:hidden;

    border-radius:14px;

    background:#171717;

    border:1px solid rgba(255,255,255,.10);

    cursor:zoom-in;
}

.main-image img{
    width:100%;
    height:100%;

    min-height:620px;

    display:block;

    object-fit:cover;

    user-select:none;

    transition:transform .35s ease;
}

.main-image:hover img{
    transform:scale(1.025);
}

.gallery-button{
    position:absolute;

    top:50%;

    z-index:5;

    width:46px;
    height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;

    background:rgba(0,0,0,.62);

    color:#fff;

    cursor:pointer;

    font-size:25px;

    transform:translateY(-50%);

    transition:.2s;
}

.gallery-button:hover{
    background:#000;
    border-color:#fff;
}

.gallery-button.prev{
    left:15px;
}

.gallery-button.next{
    right:15px;
}

.gallery-counter{
    position:absolute;

    left:50%;
    bottom:18px;

    z-index:5;

    padding:7px 12px;

    border-radius:20px;

    background:rgba(0,0,0,.65);

    color:#fff;

    font-size:10px;
    font-weight:bold;

    transform:translateX(-50%);
}

.thumbnails{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(90px,1fr)
        );

    gap:10px;

    margin-top:12px;
}

.thumbnail{
    height:110px;

    overflow:hidden;

    padding:0;

    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;

    background:#171717;

    cursor:pointer;

    opacity:.65;

    transition:.2s;
}

.thumbnail:hover{
    opacity:1;
}

.thumbnail.active{
    opacity:1;

    border-color:#fff;

    box-shadow:
        0 0 0 1px #fff;
}

.thumbnail img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

/* =========================
   INFO
========================= */

.info{
    position:sticky;
    top:100px;
}

.category{
    color:#999;

    font-size:10px;
    font-weight:bold;

    letter-spacing:3px;

    text-transform:uppercase;
}

.product-name{

.reference{

.price{

}

.description{

    font-size:14px;

/* =========================

========================= */

.section{

.section-title{
    margin-bottom:13px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    letter-spacing:2px;

    text-transform:uppercase;
}

.variants{

    gap:9px;
}

.variant-button{
    min-width:70px;

    padding:10px 14px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:6px;

    background:transparent;

    color:#aaa;

    cursor:pointer;

    font-size:11px;
    font-weight:bold;
}

.variant-button:hover{
    border-color:#fff;

}

.variant-button.active{
    color:#111;

    border-color:#fff;

/* =========================
   SIZES
========================= */

.sizes{

.size{

/* =========================

.quantity-value{

/* =========================

.shipping{

/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function money(value){

    return Number(value || 0).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


function parseJSON(value,fallback=[]){

    if(Array.isArray(value)){
        return value;
    }

    if(typeof value === "string"){

        try{

            const parsed =
                JSON.parse(value);

            return Array.isArray(parsed)
                ? parsed
                : fallback;

        }catch{

            return fallback;

        }

    }

    return fallback;

}


/* =====================================================
   SUPABASE
===================================================== */

async function getProduct(id){

    const params =
        new URLSearchParams({

            select:"*",

            id:`eq.${id}`,

            limit:"1"

        });


    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/" +
            encodeURIComponent(PRODUCTS_TABLE) +
            "?" +
            params.toString(),
            {

                headers:{
                    "apikey":SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY
                }

            }
        );


    const text =
        await response.text();


    let data;

    try{

        data =
            text
                ? JSON.parse(text)
                : [];

    }catch{

        data = [];

    }


    if(!response.ok){

        throw new Error(
            data?.message ||
            data?.error_description ||
            text ||
            "Error cargando producto"
        );

    }


    return data[0] || null;

}


/* =====================================================
   VARIANTES
===================================================== */

function getVariants(product){

    const raw =
        parseJSON(
            product.images,
            []
        );


    const result = [];


    raw.forEach(
        (variant,index)=>{

            if(typeof variant === "string"){

                result.push({

                    name:
                        `Variante ${index + 1}`,

                    color:
                        "#888",

                    ref:"",
                    
                    images:[
                        variant
                    ]

                });

                return;

            }


            if(
                !variant ||
                typeof variant !== "object"
            ){

                return;

            }


            let images = [];


            if(Array.isArray(variant.images)){

                images =
                    variant.images
                        .filter(Boolean)
                        .map(String);

            }


            if(
                !images.length &&
                variant.image
            ){

                images = [
                    String(
                        variant.image
                    )
                ];

            }


            if(
                !images.length &&
                variant.url
            ){

                images = [
                    String(
                        variant.url
                    )
                ];

            }


            if(!images.length){

                return;

            }


            result.push({

                name:
                    variant.name ||
                    variant.colorName ||
                    variant.color ||
                    `Variante ${index + 1}`,

                color:
                    variant.color ||
                    "#888",

                ref:
                    variant.ref ||
                    "",

                images

            });

        }
    );


    return result;

}


function getSizes(product){

    return parseJSON(
        product.sizes,
        []
    );

}

/* =====================================================
   VARIANTES UI
===================================================== */

function renderVariants(){

    const container =
        document.getElementById(
            "variants"
        );


    if(!container){
        return;
    }


    container.innerHTML =
        variants
            .map(
                (variant,index)=>`

                    <button
                        type="button"
                        class="variant-button ${
                            index === currentVariant
                                ? "active"
                                : ""
                        }"
                        onclick="selectVariant(${index})"
                    >

                        ${escapeHTML(
                            variant.name
                        )}

                    </button>

                `
            )
            .join("");

}


/* =====================================================
   SELECCIONAR VARIANTE
===================================================== */

function selectVariant(index){

    if(!variants[index]){
        return;
    }


    currentVariant =
        index;

    currentImage =
        0;


    renderVariants();

    updateMainImage();

    updateImageInfo();

}


/* =====================================================
   IMAGEN
===================================================== */

function updateMainImage(){

    const variant =
        variants[currentVariant];


    if(!variant){
        return;
    }


    const images =
        variant.images;


    if(!images.length){
        return;
    }


    if(currentImage >= images.length){

        currentImage =
            0;

    }


    const image =
        document.getElementById(
            "mainProductImage"
        );


    if(image){

        image.src =
            images[currentImage];

    }


    const counter =
        document.getElementById(
            "galleryCounter"
        );


    if(counter){

        counter.textContent =
            `${currentImage + 1} / ${images.length}`;

    }


    renderThumbnails();

}


function renderThumbnails(){

    const container =
        document.getElementById(
            "thumbnails"
        );


    if(!container){
        return;
    }


    const variant =
        variants[currentVariant];


    container.innerHTML =
        variant.images
            .map(
                (image,index)=>`

                    <button
                        type="button"
                        class="thumbnail ${
                            index === currentImage
                                ? "active"
                                : ""
                        }"
                        onclick="selectImage(${index})"
                    >

                        <img
                            src="${escapeHTML(image)}"
                            alt="Imagen ${index + 1}"
                            loading="lazy"
                        >

                    </button>

                `
            )
            .join("");

}


function selectImage(index){

    const variant =
        variants[currentVariant];


    if(
        !variant ||
        !variant.images[index]
    ){

        return;

    }


    currentImage =
        index;


    updateMainImage();

    updateImageInfo();

}


function changeImage(direction){

    const variant =
        variants[currentVariant];


    if(!variant){
        return;
    }


    const total =
        variant.images.length;


    if(total <= 1){
        return;
    }


    currentImage +=
        direction;


    if(currentImage < 0){

        currentImage =
            total - 1;

    }


    if(currentImage >= total){

        currentImage =
            0;

    }


    updateMainImage();

    updateImageInfo();

}


/* =====================================================
   REFERENCIA IMAGEN
===================================================== */

function updateImageInfo(){

    const element =
        document.getElementById(
            "imageInfo"
        );


    if(!element){
        return;
    }


    const variant =
        variants[currentVariant];


    if(!variant){
        return;
    }


    const raw =
        parseJSON(
            product.images,
            []
        );


    const imageObject =
        raw[currentVariant];


    let ref =
        "";


    if(
        imageObject &&
        typeof imageObject === "object"
    ){

        ref =
            imageObject.ref ||
            "";

    }


    if(
        Array.isArray(imageObject?.images) &&
        imageObject.images.length
    ){

        /*
         * Si más adelante el administrador
         * guarda referencias individuales por imagen,
         * también las leeremos.
         */

        const currentImageData =
            imageObject.images[currentImage];


        if(
            currentImageData &&
            typeof currentImageData === "object"
        ){

            ref =
                currentImageData.ref ||
                ref;

        }

    }


    if(ref){

        element.innerHTML = `

            Referencia de imagen:

            <strong>
                ${escapeHTML(ref)}
            </strong>

        `;

    }else{

        element.textContent =
            "";

    }

}


/* =====================================================
   TALLA
===================================================== */

function selectSize(index){

    const sizes =
        getSizes(product);


    if(
        sizes[index] === undefined
    ){

        return;

    }


    selectedSize =
        sizes[index];


    document
        .querySelectorAll(
            "#sizes .size"
        )
        .forEach(
            (button,i)=>{

                button.classList.toggle(
                    "active",
                    i === index
                );

            }
        );

}


/* =====================================================
   CANTIDAD
===================================================== */

function changeQuantity(change){

    let next =
        quantity + change;


    if(next < 1){
        next = 1;
    }


    if(
        product.stock !== null &&
        product.stock !== undefined
    ){

        const stock =
            Number(product.stock);


        if(
            stock > 0 &&
            next > stock
        ){

            next =
                stock;

        }

    }


    quantity =
        next;


    const element =
        document.getElementById(
            "quantityValue"
        );


    if(element){

        element.textContent =
            quantity;

    }

}


/* =====================================================
   COMPRA
===================================================== */

function buyProduct(){

    const sizes =
        getSizes(product);


    if(
        sizes.length &&
        !selectedSize
    ){

        alert(
            "Selecciona una talla antes de continuar."
        );

        return;

    }


    if(
        product.stock !== null &&
        product.stock !== undefined &&
        Number(product.stock) <= 0
    ){

        alert(
            "Este producto está agotado."
        );

        return;

    }


    const variant =
        variants[currentVariant];


    if(!variant){

        alert(
            "No se ha podido seleccionar la variante."
        );

        return;

    }


    currentOrder = {

        product,

        variant,

        size:
            selectedSize ||
            "No especificada",

        quantity,

        total:
            Number(product.price || 0) *
            quantity

    };


    showOrderSummary();


    document
        .getElementById(
            "formError"
        )
        .classList.remove(
            "show"
        );


    document
        .getElementById(
            "formError"
        )
        .textContent =
            "";


    document
        .getElementById(
            "customerModal"
        )
        .classList.add(
            "show"
        );


    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   RESUMEN PEDIDO
===================================================== */

function showOrderSummary(){

    const order =
        currentOrder;


    document
        .getElementById(
            "orderSummary"
        )
        .innerHTML = `

            <strong>
                ${escapeHTML(
                    order.product.name
                )}
            </strong>

            <br>

            REF:
            ${escapeHTML(
                order.product.ref ||
                order.product.id
            )}

            <br>

            Categoría:
            <strong>
                ${escapeHTML(
                    order.product.category ||
                    ""
                )}
            </strong>

            <br>

            Variante:
            <strong>
                ${escapeHTML(
                    order.variant.name
                )}
            </strong>

            <br>

            Talla:
            <strong>
                ${escapeHTML(
                    order.size
                )}
            </strong>

            <br>

            Cantidad:
            <strong>
                ${order.quantity}
            </strong>

            <br>

            Precio unidad:
            <strong>
                ${money(
                    order.product.price
                )}
            </strong>

            <br>

            Total:
            <strong>
                ${money(
                    order.total
                )}
            </strong>

        `;

}


/* =====================================================
   MODAL
===================================================== */

function closeCustomerModal(){

    document
        .getElementById(
            "customerModal"
        )
        .classList.remove(
            "show"
        );


    document.body.style.overflow =
        "";

}


function fieldValue(id){

    const element =
        document.getElementById(id);


    return element
        ? element.value.trim()
        : "";

}


function showFormError(message){

    const error =
        document.getElementById(
            "formError"
        );


    error.textContent =
        message;


    error.classList.add(
        "show"
    );

}


/* =====================================================
   WHATSAPP
===================================================== */

        );

        fieldValue(

        );

        );

        );

        );

        );

        );

        fieldValue(

        );

        fieldValue(

        );

    const whatsapp =

    const message =

`🛍️ NUEVO PEDIDO

📦 PRODUCTO

Producto:
${currentOrder.product.name}

REF:
${currentOrder.product.ref || currentOrder.product.id}

${currentOrder.product.category || ""}

Variante:
${currentOrder.variant.name}

Talla:
${currentOrder.size}

Cantidad:
${currentOrder.quantity}

💰 PRECIO

Precio unidad:
${money(currentOrder.product.price)}

Total:
${money(currentOrder.total)}

🚚 ENTREGA

${currentOrder.product.shipping_min ?? 3}–${currentOrder.product.shipping_max ?? 9} días laborables

━━━━━━━━━━━━━━━━

${name}

Teléfono:
${phone}

Email:
${email || "No indicado"}

Piso/Puerta:

Código postal:
${postal}

Ciudad:
${city}

Provincia:
${province}

País:
${country}

📝 OBSERVACIONES

${notes || "Ninguna"}

━━━━━━━━━━━━━━━━`;

/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(){

    const variant =
        variants[currentVariant];


    if(!variant){
        return;
    }


    const image =
        document.getElementById(
            "lightboxImage"
        );


    image.src =
        variant.images[currentImage];


    document
        .getElementById(
            "lightbox"
        )
        .classList.add(
            "show"
        );


    document.body.style.overflow =
        "hidden";

}


function closeLightbox(){

    document
        .getElementById(
            "lightbox"
        )
        .classList.remove(
            "show"
        );


    if(
        !document
            .getElementById(
                "customerModal"
            )
            .classList.contains(
                "show"
            )
    ){

        document.body.style.overflow =
            "";

    }

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeLightbox();

            closeCustomerModal();

        }


        if(
            document
                .getElementById(
                    "lightbox"
                )
                .classList.contains(
                    "show"
                )
        ){

            if(event.key === "ArrowRight"){

                changeImage(1);

                const variant =
                    variants[currentVariant];

                document
                    .getElementById(
                        "lightboxImage"
                    )
                    .src =
                    variant.images[currentImage];

            }


            if(event.key === "ArrowLeft"){

                changeImage(-1);

                const variant =
                    variants[currentVariant];

                document
                    .getElementById(
                        "lightboxImage"
                    )
                    .src =
                    variant.images[currentImage];

            }

        }

    }
);


/* =====================================================
   CERRAR MODALES AL PULSAR FUERA
===================================================== */

document
    .getElementById(
        "customerModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeCustomerModal();

            }

        }
    );


document
    .getElementById(
        "lightbox"
    )
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeLightbox();

            }

        }
    );


/* =====================================================
   CARGAR PRODUCTO
===================================================== */

async function init(){

    const container =
        document.getElementById(
            "productContainer"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    if(!id){

        container.className =
            "error";


        container.innerHTML = `

            <div>

                <strong>
                    Producto no especificado.
                </strong>

                <br><br>

                Vuelve al catálogo para seleccionar
                un producto.

            </div>

        `;

        return;

    }


    try{

        product =
            await getProduct(id);


        if(!product){

            throw new Error(
                "Producto no encontrado."
            );

        }


        document.title =
            `${product.name || "Producto"} | Strangis`;


        const backLink =
            document.getElementById(
                "backLink"
            );


        if(backLink){

            const category =
                product.category ||
                "camisetas";


            backLink.href =
                `${category}.html`;

        }


        renderProduct();

    }
    catch(error){

        console.error(
            "ERROR PRODUCTO:",
            error
        );


        container.className =
            "error";


        container.innerHTML = `

            <div>

                <strong>
                    No se ha podido cargar el producto.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                Comprueba la consola del navegador
                si necesitas más información.

            </div>

        `;

    }

}


init();
