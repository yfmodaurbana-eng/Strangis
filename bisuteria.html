<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bisutería | Strangis</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #151515 0%,
            #292929 38%,
            #4d4d4d 65%,
            #222 100%
        );
}

button,
input,
textarea{
    font:inherit;
}


/* =====================================================
   CABECERA
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:18px 5%;

    display:flex;
    align-items:center;
    gap:30px;

    border-bottom:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(20,20,20,.92);

    backdrop-filter:
        blur(18px);
}

.logo{
    flex-shrink:0;

    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

nav{
    flex:1;

    display:flex;
    justify-content:center;
    gap:28px;

    overflow-x:auto;

    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#999;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;
    letter-spacing:1.5px;

    text-transform:uppercase;
    white-space:nowrap;

    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    width:min(1400px,90%);

    margin:auto;

    padding:
        clamp(65px,9vw,110px)
        0
        clamp(45px,6vw,75px);
}

.hero small{
    color:#aaa;

    font-size:11px;
    font-weight:bold;
    letter-spacing:5px;
}

.hero h1{
    margin-top:18px;

    font-size:
        clamp(
            58px,
            10vw,
            125px
        );

    letter-spacing:-7px;
    line-height:.85;
}

.hero p{
    max-width:600px;

    margin-top:28px;

    color:#aaa;

    font-size:15px;
    line-height:1.7;
}


/* =====================================================
   PRODUCTOS
===================================================== */

.products-section{
    width:min(1400px,90%);

    margin:auto;

    padding:
        10px
        0
        100px;
}

.products{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:20px;
}

.product{
    min-width:0;

    overflow:hidden;

    padding:16px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.15);

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.product:hover{
    transform:translateY(-4px);

    border-color:
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.075);
}


/* =====================================================
   GALERÍA / IMAGEN
===================================================== */

.product-image{
    position:relative;

    height:390px;

    margin:
        -16px
        -16px
        20px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#171717;

    cursor:zoom-in;

    touch-action:pan-y;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.04);

    user-select:none;
    -webkit-user-drag:none;

    transition:
        transform .4s ease,
        opacity .2s ease;
}

.product:hover
.product-image img{
    transform:scale(1.09);
}


/* =====================================================
   INDICADORES DE GALERÍA
===================================================== */

.gallery-dots{
    position:absolute;

    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    display:flex;

    gap:6px;

    z-index:5;

    pointer-events:none;
}

.gallery-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:
        rgba(255,255,255,.45);

    box-shadow:
        0 1px 5px
        rgba(0,0,0,.5);

    transition:.2s;
}

.gallery-dot.active{
    width:18px;

    border-radius:5px;

    background:#fff;
}


/* =====================================================
   FLECHAS GALERÍA
===================================================== */

.gallery-arrow{
    position:absolute;

    top:50%;

    width:38px;
    height:38px;

    transform:
        translateY(-50%);

    z-index:6;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    background:
        rgba(0,0,0,.45);

    color:#fff;

    cursor:pointer;

    opacity:0;

    transition:.2s;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;

    backdrop-filter:
        blur(8px);
}

.product-image:hover
.gallery-arrow{
    opacity:1;
}

.gallery-arrow.left{
    left:10px;
}

.gallery-arrow.right{
    right:10px;
}

.gallery-arrow:hover{
    background:
        rgba(255,255,255,.20);
}


/* =====================================================
   ZOOM
===================================================== */

.zoom-overlay{
    position:fixed;

    inset:0;

    z-index:10000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.92);

    backdrop-filter:
        blur(10px);

    cursor:zoom-out;
}

.zoom-overlay.show{
    display:flex;
}

.zoom-image{
    max-width:95vw;
    max-height:90vh;

    object-fit:contain;

    border-radius:8px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);

    user-select:none;
}

.zoom-close{
    position:absolute;

    top:20px;
    right:20px;

    width:44px;
    height:44px;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    background:
        rgba(0,0,0,.55);

    color:#fff;

    font-size:25px;

    cursor:pointer;

    z-index:10;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.product-name{
    font-size:16px;
    font-weight:800;

    line-height:1.35;
}

.product-code{
    margin-top:7px;

    color:#777;

    font-size:10px;
    letter-spacing:1.2px;
}

.product-description{
    margin-top:10px;

    color:#999;

    font-size:12px;
    line-height:1.55;
}

.product-price{
    margin-top:14px;

    font-size:17px;
    font-weight:800;
}


/* =====================================================
   ETIQUETAS
===================================================== */

.label{
    margin-top:18px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:1.2px;
}

.label span{
    color:#fff;
}


/* =====================================================
   COLORES
===================================================== */

.colors{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:11px;
}

.color{
    width:42px;
    height:42px;

    flex:0 0 42px;

    border:
        2px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    cursor:pointer;

    background-color:#222;

    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;

    transition:
        transform .2s ease,
        border-color .2s ease;
}

.color:hover{
    transform:scale(1.08);

    border-color:#fff;
}

.color.active{
    outline:
        2px solid
        #fff;

    outline-offset:3px;
}


/* =====================================================
   TALLAS
===================================================== */

.sizes{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:11px;
}

.size{
    min-width:43px;

    padding:
        9px 12px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:5px;

    color:#bbb;

    background:transparent;

    cursor:pointer;

    font-size:11px;
    font-weight:bold;

    transition:.2s;
}

.size:hover{
    border-color:#fff;
}

.size.active{
    background:#fff;

    color:#111;

    border-color:#fff;
}


/* =====================================================
   CANTIDAD
===================================================== */

.quantity{
    display:flex;

    align-items:center;

    gap:14px;

    margin-top:18px;
}

.quantity button{
    width:36px;
    height:36px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:5px;

    background:#181818;

    color:#fff;

    cursor:pointer;

    font-size:18px;
}

.quantity button:hover{
    background:#333;
}

.quantity span{
    min-width:25px;

    text-align:center;

    font-size:14px;
    font-weight:bold;
}


/* =====================================================
   ENVÍO ESTIMADO
===================================================== */

.shipping{
    margin-top:17px;

    padding:
        11px
        12px;

    border:
        1px solid
        rgba(255,185,70,.45);

    border-radius:7px;

    background:
        rgba(255,165,50,.10);

    color:#ffd18a;

    font-size:11px;
    font-weight:bold;

    line-height:1.4;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.12);
}

.stock{
    margin-top:8px;

    color:#777;

    font-size:10px;
}


/* =====================================================
   BOTÓN COMPRAR
===================================================== */

.buy{
    width:100%;

    margin-top:18px;

    padding:16px;

    border:0;

    border-radius:6px;

    background:#fff;

    color:#111;

    font-size:11px;
    font-weight:900;

    letter-spacing:1.5px;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.buy:hover{
    background:#ddd;

    transform:translateY(-1px);
}

.buy:active{
    transform:scale(.98);
}


/* =====================================================
   SIN PRODUCTOS
===================================================== */

.empty{
    grid-column:1 / -1;

    padding:100px 20px;

    text-align:center;

    color:#888;

    font-size:14px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:
        35px 5%;

    border-top:
        1px solid
        rgba(255,255,255,.1);

    text-align:center;

    color:#777;

    font-size:10px;
}


/* =====================================================
   MODAL CLIENTE
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);

    max-height:
        calc(100vh - 40px);

    overflow-y:auto;

    padding:30px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #222,
            #111
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
}

.modal-header{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.modal-header small{
    color:#999;

    font-size:10px;
    font-weight:bold;

    letter-spacing:3px;
}

.modal-header h2{
    margin-top:8px;

    font-size:28px;
    letter-spacing:-1px;
}

.close-modal{
    flex:0 0 auto;

    width:40px;
    height:40px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:6px;

    background:#222;

    color:#fff;

    cursor:pointer;

    font-size:20px;
}

.close-modal:hover{
    background:#333;
}


/* =====================================================
   RESUMEN
===================================================== */

.order-summary{
    margin-bottom:25px;

    padding:16px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:8px;

    background:
        rgba(255,255,255,.045);

    color:#aaa;

    font-size:12px;

    line-height:1.7;
}

.order-summary strong{
    color:#fff;
}


/* =====================================================
   FORMULARIO
===================================================== */

.form-title{
    margin:
        25px 0
        15px;

    color:#fff;

    font-size:13px;
    font-weight:900;

    letter-spacing:1.5px;
}

.form-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;
}

.form-field{
    margin-bottom:14px;
}

.form-field.full{
    grid-column:
        1 / -1;
}

.form-field label{
    display:block;

    margin-bottom:7px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    letter-spacing:1px;

    text-transform:uppercase;
}

.form-field input,
.form-field textarea{
    width:100%;

    padding:14px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:6px;

    outline:none;

    background:
        rgba(0,0,0,.35);

    color:#fff;

    font-size:14px;

    transition:
        border-color .2s,
        background .2s;
}

.form-field input{
    min-height:48px;
}

.form-field textarea{
    min-height:100px;

    resize:vertical;
}

.form-field input:focus,
.form-field textarea:focus{
    border-color:#fff;

    background:
        rgba(0,0,0,.5);
}

.form-field input::placeholder,
.form-field textarea::placeholder{
    color:#666;
}


/* =====================================================
   BOTONES PEDIDO
===================================================== */

.send-order{
    width:100%;

    margin-top:12px;

    padding:17px;

    border:0;

    border-radius:7px;

    background:#fff;

    color:#111;

    cursor:pointer;

    font-size:12px;
    font-weight:900;

    letter-spacing:1.2px;

    transition:.2s;
}

.send-order:hover{
    background:#ddd;

    transform:translateY(-1px);
}

.cancel-order{
    width:100%;

    margin-top:10px;

    padding:13px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:6px;

    background:transparent;

    color:#aaa;

    cursor:pointer;

    font-size:10px;
    font-weight:bold;
}

.cancel-order:hover{
    color:#fff;

    border-color:#fff;
}


/* =====================================================
   ERROR
===================================================== */

.form-error{
    display:none;

    margin-bottom:15px;

    padding:12px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:6px;

    background:
        rgba(255,255,255,.06);

    color:#fff;

    font-size:11px;

    line-height:1.5;
}

.form-error.show{
    display:block;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1100px){

    .products{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .product-image{
        height:330px;
    }

}


/* =====================================================
   TABLET PEQUEÑA
===================================================== */

@media(max-width:850px){

    .products{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .hero{
        width:92%;
    }

    .products-section{
        width:92%;
    }

}


/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:600px){

    header{
        padding:
            15px;

        flex-wrap:wrap;

        gap:14px;
    }

    .logo{
        font-size:17px;

        letter-spacing:2.5px;
    }

    nav{
        order:3;

        flex-basis:100%;

        justify-content:flex-start;

        gap:22px;
    }

    nav a{
        font-size:10px;
    }

    .hero{
        width:94%;

        padding:
            50px 0
            38px;
    }

    .hero small{
        font-size:9px;

        letter-spacing:3px;
    }

    .hero h1{
        margin-top:15px;

        font-size:
            clamp(48px,16vw,76px);

        letter-spacing:-5px;
    }

    .hero p{
        margin-top:22px;

        font-size:13px;
    }

    .products-section{
        width:94%;

        padding-bottom:70px;
    }


    /* UN PRODUCTO DEBAJO DE OTRO */

    .products{
        display:grid;

        grid-template-columns:1fr;

        gap:18px;
    }

    .product{
        padding:11px;

        border-radius:9px;
    }

    .product-image{
        height:380px;

        margin:
            -11px
            -11px
            14px;

        cursor:grab;
    }

    .product-image:active{
        cursor:grabbing;
    }

    .product-image img{
        transform:scale(1.02);
    }

    .product:hover
    .product-image img{
        transform:scale(1.02);
    }


    /* FLECHAS VISIBLES EN MÓVIL */

    .gallery-arrow{
        opacity:.9;

        width:34px;
        height:34px;

        font-size:17px;
    }

    .product-name{
        font-size:13px;
    }

    .product-code{
        font-size:8px;
    }

    .product-description{
        font-size:10px;
    }

    .product-price{
        font-size:14px;
    }

    .label{
        margin-top:14px;

        font-size:8px;
    }

    .colors{
        gap:8px;
    }

    .color{
        width:36px;
        height:36px;

        flex-basis:36px;
    }

    .sizes{
        gap:5px;
    }

    .size{
        min-width:34px;

        padding:
            7px 8px;

        font-size:9px;
    }

    .quantity{
        gap:9px;

        margin-top:13px;
    }

    .quantity button{
        width:32px;
        height:32px;

        font-size:16px;
    }

    .quantity span{
        font-size:11px;
    }

    .shipping{
        padding:10px;

        font-size:9px;
    }

    .stock{
        font-size:8px;
    }

    .buy{
        padding:13px;

        font-size:9px;
    }


    /* MODAL */

    .modal{
        padding:0;

        align-items:flex-end;
    }

    .modal-box{
        width:100%;

        max-height:
            96vh;

        padding:
            22px
            17px
            25px;

        border-radius:
            18px
            18px
            0
            0;
    }

    .modal-header h2{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;

        gap:0;
    }

    .form-field.full{
        grid-column:auto;
    }

    .form-field{
        margin-bottom:13px;
    }

    .form-field label{
        font-size:9px;
    }

    .form-field input,
    .form-field textarea{
        padding:14px;

        font-size:16px;
    }

    .send-order{
        padding:17px;

        font-size:11px;
    }

}


/* =====================================================
   MÓVIL MUY PEQUEÑO
===================================================== */

@media(max-width:380px){

    .product-image{
        height:330px;
    }

}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        scroll-behavior:auto !important;

        transition:none !important;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CABECERA
===================================================== -->

<header>

<div class="logo">
    Strangis
</div>

<nav>

<a href="index.html">
    Inicio
</a>

<a href="camisetas.html">
    Camisetas
</a>

<a href="pantalones.html">
    Pantalones
</a>

<a href="conjuntos.html">
    Conjuntos
</a>

<a href="gorras.html">
    Gorras
</a>

<a href="gafas.html">
    Gafas
</a>

<a class="active" href="bisuteria.html">
    Bisutería
</a>

</nav>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

<small>
    COLECCIÓN
</small>

<h1>
    BISUTERÍA
</h1>

<p>
    Descubre nuestra selección de bisutería para completar
    tus looks con personalidad.
</p>

</section>


<!-- =====================================================
     PRODUCTOS
===================================================== -->

<section class="products-section">

<div
    class="products"
    id="productsContainer"
></div>

</section>


<footer>

© 2026 Strangis · TODOS LOS DERECHOS RESERVADOS

</footer>


<!-- =====================================================
     MODAL DATOS CLIENTE
===================================================== -->

<div
    class="modal"
    id="customerModal"
>

<div class="modal-box">

<div class="modal-header">

<div>

<small>
    FINALIZAR PEDIDO
</small>

<h2>
    Datos de envío
</h2>

</div>

<button
    type="button"
    class="close-modal"
    onclick="closeCustomerModal()"
    aria-label="Cerrar"
>
    ×
</button>

</div>


<div
    class="order-summary"
    id="orderSummary"
></div>


<div
    class="form-error"
    id="formError"
></div>


<div class="form-title">
    DATOS DEL CLIENTE
</div>


<div class="form-grid">


<div class="form-field full">

<label>
    Nombre y apellidos *
</label>

<input
    id="customerName"
    type="text"
    autocomplete="name"
    placeholder="Ej: Juan García López"
>

</div>


<div class="form-field">

<label>
    Teléfono *
</label>

<input
    id="customerPhone"
    type="tel"
    autocomplete="tel"
    placeholder="Ej: 612 345 678"
>

</div>


<div class="form-field">

<label>

function money(value){

            currency:"EUR"
        }
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPAR ATRIBUTO
===================================================== */

function escapeAttribute(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;")
        .replace(/</g,"%3C")
        .replace(/>/g,"%3E");

}

function changeGalleryImage(

    const card =
        document.getElementById(
            `product-${productIndex}`

    if(!card){

        return;
    }


    card.dataset.variant =
        variantIndex;

    card.dataset.galleryIndex =
        variantIndex;


    const colorName =
        document.getElementById(
            `color-name-${productIndex}`
        );


    if(colorName){

        colorName.textContent =

    }

            button.classList.toggle(

}

/* =====================================================
   SIGUIENTE IMAGEN
===================================================== */

function nextImage(
    productIndex
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !Array.isArray(product.variants) ||
        product.variants.length < 2
    ){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    let current =
        Number(
            card.dataset.galleryIndex ||
            0
        );


    current++;


    if(
        current >=
        product.variants.length
    ){

        current = 0;

    }


    changeGalleryImage(
        productIndex,
        current
    );

}


/* =====================================================
   IMAGEN ANTERIOR
===================================================== */

function previousImage(
    productIndex
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !Array.isArray(product.variants) ||
        product.variants.length < 2
    ){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    let current =
        Number(
            card.dataset.galleryIndex ||
            0
        );


    current--;


    if(current < 0){

        current =
            product.variants.length - 1;

    }


    changeGalleryImage(
        productIndex,
        current
    );

}


/* =====================================================
   DESLIZAR CON EL DEDO
===================================================== */

const touchPositions = {};


function touchStart(
    event,
    productIndex
){

    if(
        !event.touches ||
        !event.touches.length
    ){

        return;
    }


    touchPositions[productIndex] =
        event.touches[0].clientX;

}


function touchEnd(
    event,
    productIndex
){

    if(
        touchPositions[productIndex] ===
        undefined
    ){

        return;
    }


    const endX =
        event.changedTouches[0].clientX;


    const startX =
        touchPositions[productIndex];


    const difference =
        endX - startX;


    delete touchPositions[
        productIndex
    ];


    if(
        Math.abs(difference) < 45
    ){

        return;

    }


    if(difference < 0){

        nextImage(
            productIndex
        );

    }
    else{

        previousImage(
            productIndex
        );

    }

}

        );

function closeZoom(event){

    if(
        event &&
        event.target &&
        event.target.id !==
        "zoomOverlay" &&
        !event.target.classList.contains(
            "zoom-close"
        )
    ){

        return;
    }


    document
        .getElementById(
            "zoomOverlay"
        )
        .classList.remove(
            "show"
        );


    document.body.style.overflow =
        "";

}

function selectSize(
    productIndex,
    sizeIndex
){

        PRODUCTS[productIndex];


    if(
        !product ||
        !Array.isArray(product.sizes)
    ){

        return;
    }


    const size =
        product.sizes[sizeIndex];


    if(size === undefined){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;
    }


    card.dataset.size =
        size;


    card.querySelectorAll(
        ".size"
    )
    .forEach(
        (
            button,
            buttonIndex
        ) => {

            button.classList.toggle(
                "active",
                buttonIndex ===
                sizeIndex
            );

        }
    );

}


/* =====================================================
   CANTIDAD
===================================================== */

function changeQuantity(
    productIndex,
    change
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;
    }


    let quantity =
        Number(
            card.dataset.quantity
        );


    quantity += change;


    if(quantity < 1){

        quantity = 1;

    }


    const product =
        PRODUCTS[productIndex];


    if(
        product &&
        Number.isFinite(
            Number(product.stock)
        ) &&
        Number(product.stock) > 0 &&
        quantity >
        Number(product.stock)
    ){

        quantity =
            Number(product.stock);

    }


    card.dataset.quantity =
        quantity;


    const quantityElement =
        document.getElementById(
            `quantity-${productIndex}`
        );


    if(quantityElement){

        quantityElement.textContent =
            quantity;

    }

}


/* =====================================================
   COMPRAR
===================================================== */

function buyProduct(
    productIndex
){

    const product =
        PRODUCTS[productIndex];


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!product || !card){

        return;
    }


    const variant =
        product.variants[
            Number(
                card.dataset.variant ||
                0
            )
        ];


    const size =
        card.dataset.size ||
        "No especificada";


    const quantity =
        Number(
            card.dataset.quantity ||
            1
        );


    const total =
        Number(product.price) *
        quantity;


    const shipping =
        product.shipping ||
        {
            min:3,
            max:9
        };


    if(!variant){

        alert(
            "Selecciona un color."
        );

        return;
    }


    if(
        Array.isArray(product.sizes) &&
        product.sizes.length &&
        !card.dataset.size
    ){

        alert(
            "Selecciona una talla antes de continuar."
        );

        return;
    }


    currentOrder = {

        product:product,

        variant:variant,

        size:size,

        quantity:quantity,

        total:total,

        shipping:shipping

    };


    showOrderSummary();


    document
        .getElementById(
            "customerModal"
        )
        .classList.add(
            "show"
        );


    document.body.style.overflow =

    setTimeout(

}

function sendOrderToWhatsApp(){

    if(!currentOrder){

    }


    const name =
        fieldValue(
            "customerName"
        );


    const phone =
        fieldValue(
            "customerPhone"
        );

        fieldValue(

    const province =
        fieldValue(

        );


    const country =
        fieldValue(
            "customerCountry"
        );


    const notes =
        fieldValue(

        );


    if(!name){

        showFormError(
            "Introduce tu nombre y apellidos."
        );

        return;
    }


    if(!phone){

        showFormError(
            "Introduce tu teléfono."
        );

        return;
    }


    if(!address){

        showFormError(
            "Introduce la dirección de envío."
        );

        return;
    }


    if(!number){

        showFormError(
            "Introduce el número de la dirección."
        );

        return;
    }


    if(!postal){

        showFormError(
            "Introduce el código postal."
        );

        return;
    }


    if(!city){

        showFormError(
            "Introduce la ciudad."
        );

        return;
    }


    if(!province){

        showFormError(
            "Introduce la provincia."
        );

        return;
    }


    if(!country){

        showFormError(
            "Introduce el país."
        );

        return;
    }


    if(
        email &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
    ){

        showFormError(
            "El email no parece válido."
        );

        return;
    }


    const order =
        currentOrder;


    const whatsapp =
        String(
            order.product.whatsapp ||
            ""
        )
        .replace(
            /\D/g,
            ""
        );


    if(!whatsapp){

        showFormError(
            "Este producto no tiene configurado el WhatsApp de pedidos."
        );

        return;
    }


    let message =

`🛍️ NUEVO PEDIDO

━━━━━━━━━━━━━━━━

📦 PRODUCTO

Producto: ${order.product.name}

REF: ${order.product.ref || order.product.id || ""}

Color: ${order.variant.name}

Talla: ${order.size}

Cantidad: ${order.quantity}

💰 PRECIO

Precio unidad:
${money(order.product.price)}

Total:
${money(order.total)}

🚚 ENTREGA

${order.shipping.min}–${order.shipping.max}
días laborables

━━━━━━━━━━━━━━━━

👤 DATOS DEL CLIENTE

Nombre y apellidos:
${name}

Teléfono:
${phone}

Email:
${email || "No indicado"}

📍 DIRECCIÓN DE ENVÍO

Dirección:
${address}

Número:
${number}

Piso / Puerta:
${floor || "No indicado"}

Código postal:
${postal}

Ciudad:
${city}

Provincia:
${province}

País:
${country}

📝 OBSERVACIONES:

${notes || "Ninguna"}

━━━━━━━━━━━━━━━━`;


    const whatsappURL =
        "https://wa.me/" +
        whatsapp +
        "?text=" +
        encodeURIComponent(
            message
        );


    closeCustomerModal();


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* =====================================================
   ERROR FORMULARIO
===================================================== */

function showFormError(message){

    const error =
        document.getElementById(
            "formError"
        );


    error.textContent =
        message;


    error.classList.add(
        "show"
    );


    error.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });

}


/* =====================================================
   CERRAR MODAL FUERA
===================================================== */

document
    .getElementById(
        "customerModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeCustomerModal();

            }

        }
    );


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeCustomerModal();

            closeZoom();

        }


        if(
            event.key === "ArrowRight"
        ){

            const zoom =
                document.getElementById(
                    "zoomOverlay"
                );

            if(
                zoom.classList.contains(
                    "show"
                )
            ){

                /*
                   El cambio de imagen se
                   hace desde las cartas.
                */

            }

        }

    }
);


/* =====================================================
   ERROR IMAGEN
===================================================== */

function imageError(image){

    image.style.display =
        "none";

}


/* =====================================================
   INICIAR
===================================================== */

renderProducts();


</script>

</body>

</html>
