<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111111"
>

<meta
    name="description"
    content="Marcas & Moda - Tienda online de moda"
>

<title>Marcas & Moda</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#fff;
    color:#111;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    background:#111;
    color:#fff;

    box-shadow:
        0 2px 15px rgba(0,0,0,.16);
}

.header-inner{
    max-width:1200px;
    min-height:68px;

    margin:auto;
    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    font-weight:400;
}

.cart-btn{
    border:0;
    background:#fff;
    color:#111;

    border-radius:9px;
    padding:11px 15px;

    font-weight:800;
}

.cart-btn:hover{
    background:#eee;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:410px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:60px 20px;

    background:
        linear-gradient(
            rgba(0,0,0,.52),
            rgba(0,0,0,.52)
        ),
        linear-gradient(
            135deg,
            #222,
            #777
        );

    color:#fff;
}

.hero-content{
    max-width:760px;
}

.hero h1{
    font-size:
        clamp(42px,7vw,78px);

    line-height:1;
    margin-bottom:18px;

    font-weight:900;
    letter-spacing:-2px;
}

.hero p{
    font-size:18px;
    margin-bottom:28px;
}

.hero-btn{
    display:inline-block;

    background:#fff;
    color:#111;

    text-decoration:none;

    border-radius:8px;

    padding:14px 25px;

    font-weight:800;

    transition:.2s;
}

.hero-btn:hover{
    transform:translateY(-2px);
}


/* =========================================================
   CONTENEDOR
========================================================= */

.container{
    max-width:1200px;

    margin:auto;

    padding:
        45px 18px 80px;
}


/* =========================================================
   CABECERA DE SECCIÓN
========================================================= */

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;

    gap:15px;

    margin-bottom:25px;
}

.section-head h2{
    font-size:30px;
}

.section-head p{
    color:#777;
    font-size:14px;
}


/* =========================================================
   FILTROS
========================================================= */

.filters{
    display:flex;

    gap:9px;

    flex-wrap:wrap;

    margin-bottom:28px;
}

.filter{
    border:1px solid #ddd;

    background:#fff;

    color:#111;

    padding:9px 14px;

    border-radius:20px;

    transition:.2s;
}

.filter:hover{
    border-color:#111;
}

.filter.active{
    background:#111;
    color:#fff;
    border-color:#111;
}


/* =========================================================
   PRODUCTOS
========================================================= */

.products{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:20px;
}

.product{
    border:1px solid #eee;

    border-radius:12px;

    overflow:hidden;

    background:#fff;

    transition:
        transform .2s,
        box-shadow .2s;
}

.product:hover{
    transform:translateY(-3px);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);
}

.product-image{
    position:relative;

    background:#f4f4f4;
}

.product-image img{
    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;

    display:block;
}

.product-badge{
    position:absolute;

    top:10px;
    left:10px;

    background:#111;
    color:#fff;

    padding:6px 9px;

    border-radius:6px;

    font-size:11px;
    font-weight:800;
}

.product-info{
    padding:15px;
}

.category{
    color:#888;

    font-size:11px;

    text-transform:uppercase;

    margin-bottom:6px;
}

.product-name{
    font-weight:800;

    min-height:20px;

    margin-bottom:6px;
}

.price{
    font-size:19px;

    font-weight:900;

    margin-bottom:12px;
}

.stock-info{
    color:#777;

    font-size:12px;

    margin-bottom:11px;
}

.stock-out{
    color:#b00020;

    font-weight:800;
}

.view-btn{
    width:100%;

    border:0;

    background:#111;
    color:#fff;

    padding:12px;

    border-radius:8px;

    font-weight:800;

    transition:.2s;
}

.view-btn:hover{
    background:#333;
}


/* =========================================================
   VACÍO
========================================================= */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:#777;
}


/* =========================================================
   MODAL PRODUCTO
========================================================= */

.modal{
    position:fixed;
    inset:0;

    z-index:2000;

    background:
        rgba(0,0,0,.72);

    display:none;

    align-items:flex-end;
    justify-content:center;
}

.modal.active{
    display:flex;
}

.product-modal{
    width:100%;
    max-width:1100px;

    max-height:94vh;

    overflow:auto;

    background:#fff;

    border-radius:
        18px 18px 0 0;

    padding:20px;
}

.close{
    display:block;

    margin-left:auto;

    border:0;

    background:#eee;

    width:38px;
    height:38px;

    border-radius:50%;

    font-size:22px;

    margin-bottom:15px;
}

.close:hover{
    background:#ddd;
}

.product-layout{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:30px;
}


/* =========================================================
   GALERÍA
========================================================= */

.gallery-track{
    display:flex;

    overflow-x:auto;

    scroll-snap-type:
        x mandatory;

    scrollbar-width:none;

    border-radius:12px;

    overscroll-behavior-x:contain;
}

.gallery-track::-webkit-scrollbar{
    display:none;
}

.slide{
    min-width:100%;

    scroll-snap-align:start;
}

.slide img{
    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;

    display:block;

    border-radius:12px;

    background:#f4f4f4;
}

.dots{
    display:flex;

    justify-content:center;

    gap:6px;

    margin-top:10px;
}

.dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ccc;
}

.dot.active{
    background:#111;
}


/* =========================================================
   DETALLES PRODUCTO
========================================================= */

.details h2{
    font-size:32px;

    margin-bottom:7px;
}

.reference{
    color:#888;

    font-size:13px;

    margin-bottom:15px;
}

.details-price{
    font-size:27px;

    font-weight:900;

    margin-bottom:20px;
}

.description{
    color:#555;

    line-height:1.6;

    margin-bottom:22px;

    white-space:pre-line;
}

.option-title{
    font-weight:800;

    margin-bottom:9px;
}

.options{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:20px;
}

.option{
    border:1px solid #ccc;

    background:#fff;

    padding:10px 15px;

    border-radius:7px;

    transition:.15s;
}

.option:hover{
    border-color:#111;
}

.option.selected{
    background:#111;

    color:#fff;

    border-color:#111;
}


/* =========================================================
   COLORES CON IMAGEN
========================================================= */

.color-option{
    display:inline-flex;

    align-items:center;

    gap:8px;
}

.color-image-dot{
    width:24px;
    height:30px;

    border-radius:5px;

    object-fit:cover;

    background:#eee;
}

.color-option.selected
.color-image-dot{
    outline:
        2px solid #fff;

    box-shadow:
        0 0 0 2px #111;
}

.add-cart{
    width:100%;

    border:0;

    background:#111;
    color:#fff;

    padding:16px;

    border-radius:9px;

    font-weight:900;

    transition:.2s;
}

.add-cart:hover{
    background:#333;
}

.add-cart.added{
    background:#168a42;
}


/* =========================================================
   CARRITO
========================================================= */

.cart-modal{
    position:fixed;
    inset:0;

    z-index:3000;

    background:
        rgba(0,0,0,.65);

    display:none;
}

.cart-modal.active{
    display:block;
}

.cart{
    margin-left:auto;

    width:100%;
    max-width:520px;

    height:100%;

    overflow:auto;

    background:#fff;

    padding:22px;
}

.cart-head{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.cart-head button{
    border:0;

    background:#eee;

    width:36px;
    height:36px;

    border-radius:50%;

    font-size:20px;
}

.cart-item{
    display:flex;

    gap:12px;

    border-bottom:
        1px solid #eee;

    padding:15px 0;
}

.cart-item img{
    width:70px;
    height:90px;

    object-fit:cover;

    border-radius:7px;

    background:#eee;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:800;

    margin-bottom:5px;
}

.cart-meta{
    color:#777;

    font-size:12px;

    line-height:1.6;

    margin-bottom:5px;
}

.quantity-control{
    display:flex;

    align-items:center;

    gap:7px;

    margin-top:8px;
}

.quantity-control button{
    border:1px solid #ddd;

    background:#fff;

    width:28px;
    height:28px;

    border-radius:6px;
}

.quantity-number{
    min-width:22px;

    text-align:center;

    font-weight:800;
}

.remove{
    border:0;

    background:#fee;

    color:#a00;

    width:30px;
    height:30px;

    border-radius:50%;
}

.total{
    font-size:23px;

    font-weight:900;

    margin:25px 0;
}

.checkout-btn{
    width:100%;

    border:0;

    background:#25d366;

    color:#fff;

    padding:15px;

    border-radius:9px;

    font-weight:900;
}

.checkout-btn:hover{
    background:#1fb956;
}


/* =========================================================
   CHECKOUT
========================================================= */

.checkout-modal{
    position:fixed;
    inset:0;

    z-index:4000;

    background:
        rgba(0,0,0,.7);

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;
}

.checkout-modal.active{
    display:flex;
}

.checkout-box{
    background:#fff;

    width:100%;
    max-width:600px;

    max-height:95vh;

    overflow:auto;

    border-radius:15px;

    padding:22px;
}

.checkout-box h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;

    font-size:13px;

    font-weight:800;

    margin-bottom:6px;
}

.form-group input,
.form-group textarea{
    width:100%;

    border:1px solid #ddd;

    border-radius:8px;

    padding:12px;

    outline:none;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#111;
}

.form-group textarea{
    min-height:80px;

    resize:vertical;
}

.confirm{
    width:100%;

    border:0;

    background:#25d366;

    color:#fff;

    padding:15px;

    border-radius:8px;

    font-weight:900;
}

.back{
    width:100%;

    border:0;

    background:#eee;

    padding:13px;

    border-radius:8px;

    margin-top:8px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    background:#111;

    color:#fff;

    text-align:center;

    padding:35px 20px;
}

.footer strong{
    display:block;

    font-size:20px;

    margin-bottom:8px;
}

.footer p{
    color:#aaa;

    font-size:13px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:950px){

    .products{
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:700px){

    .products{
        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .product-layout{
        grid-template-columns:1fr;
    }

    .hero{
        min-height:330px;
    }

    .container{
        padding-top:30px;
    }

    .section-head h2{
        font-size:24px;
    }

    .details h2{
        font-size:26px;
    }

    .product-modal{
        padding:15px;
    }

}

@media(max-width:430px){

    .logo{
        font-size:19px;
    }

    .cart-btn{
        padding:9px 11px;
    }

    .product-info{
        padding:12px;
    }

    .product-name{
        font-size:14px;
    }

    .price{
        font-size:17px;
    }

}


/* =========================================================
   ACCESIBILIDAD
========================================================= */

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible{
    outline:
        3px solid #777;

    outline-offset:2px;
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">

        <div class="logo">
            Marcas <span>&</span> Moda
        </div>

        <button
            class="cart-btn"
            onclick="openCart()"
            aria-label="Abrir carrito"
        >
            🛒 Carrito
            (<span id="cartCount">0</span>)
        </button>

    </div>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <div class="hero-content">

        <h1>Marcas & Moda</h1>

        <p>
            Descubre tu estilo. Descubre tu moda.
        </p>

        <a
            class="hero-btn"
            href="#catalogo"
        >
            Ver colección
        </a>

    </div>

</section>


<!-- =====================================================
     CATÁLOGO
===================================================== -->

<main
    class="container"
    id="catalogo"
>

    <div class="section-head">

        <div>

            <h2>
                Nuestra colección
            </h2>

            <p>
                Moda seleccionada para tu estilo.
            </p>

        </div>

    </div>


    <div
        id="filters"
        class="filters"
    ></div>


    <div
        id="products"
        class="products"
    ></div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <strong>
        Marcas & Moda
    </strong>

    <p>
        Moda, estilo y tendencias.
    </p>

</footer>


<!-- =====================================================
     MODAL PRODUCTO
===================================================== -->

<div
    id="productModal"
    class="modal"
>

    <div class="product-modal">

        <button
            class="close"
            onclick="closeProduct()"
            aria-label="Cerrar producto"
        >
            ×
        </button>

        <div
            id="productContent"
            class="product-layout"
        ></div>

    </div>

</div>


<!-- =====================================================
     CARRITO
===================================================== -->

<div
    id="cartModal"
    class="cart-modal"
>

    <div class="cart">

        <div class="cart-head">

            <h2>
                🛒 Tu carrito
            </h2>

            <button
                onclick="closeCart()"
                aria-label="Cerrar carrito"
            >
                ×
            </button>

        </div>

        <div id="cartItems"></div>

        <div
            id="cartTotal"
            class="total"
        >
            Total: 0,00 €
        </div>

        <button
            id="checkoutButton"
            class="checkout-btn"
            onclick="openCheckout()"
        >
            Continuar con el pedido
        </button>

    </div>

</div>


<!-- =====================================================
     CHECKOUT
===================================================== -->

<div
    id="checkoutModal"
    class="checkout-modal"
>

    <div class="checkout-box">

        <h2>
            📦 Datos de envío
        </h2>

        <div class="form-group">

            <label for="customerName">
                Nombre y apellidos *
            </label>

            <input
                id="customerName"
                type="text"
                autocomplete="name"
            >

        </div>


        <div class="form-group">

            <label for="customerPhone">
                Teléfono *
            </label>

            <input
                id="customerPhone"
                type="tel"
                autocomplete="tel"
            >

        </div>


        <div class="form-group">

            <label for="customerAddress">
                Dirección *
            </label>

            <input
                id="customerAddress"
                type="text"
                autocomplete="street-address"
            >

        </div>


        <div class="form-group">

            <label for="customerPostal">
                Código postal *
            </label>

            <input
                id="customerPostal"
                type="text"
                autocomplete="postal-code"
            >

        </div>


        <div class="form-group">

            <label for="customerCity">
                Ciudad *
            </label>

            <input
                id="customerCity"
                type="text"
                autocomplete="address-level2"
            >

        </div>


        <div class="form-group">

            <label>
                País
            </label>

            <input
                value="España"
                readonly
            >

        </div>


        <div class="form-group">

            <label for="customerNotes">
                Observaciones
            </label>

            <textarea
                id="customerNotes"
                placeholder="Ej: Entregar por la tarde..."
            ></textarea>

        </div>


        <button
            class="confirm"
            onclick="sendWhatsApp()"
        >
            Confirmar pedido por WhatsApp
        </button>


        <button
            class="back"
            onclick="closeCheckout()"
        >
            Volver
        </button>

    </div>

</div>


<script>

/* =========================================================
   🛍️ PRODUCTOS DE LA TIENDA
   =========================================================

   =========================================================
   ⚠️ IMPORTANTE
   =========================================================

   AQUÍ ES DONDE TIENES QUE PEGAR LOS PRODUCTOS
   GENERADOS DESDE admin.html.

   NO BORRES:

   NI EL:

       ];

   =========================================================

   CADA PRODUCTO GENERADO POR admin.html DEBE IR AQUÍ.

   EJEMPLO:

   {
       id: "cam-001",
       name: "Camiseta Premium",
       reference: "CAM-001",
       price: 29.99,
       stock: 10,
       category: "Camisetas",

       sizes: ["S","M","L","XL"],

       colors: [
           {
               name: "Negro",
               image: "https://i.imgur.com/imagen-negra.jpg"
           },
           {
               name: "Blanco",
               image: "https://i.imgur.com/imagen-blanca.jpg"
           }
       ],

       description: "Descripción del producto.",

       images: [
           "https://i.imgur.com/imagen-negra.jpg",
           "https://i.imgur.com/imagen-blanca.jpg"
       ]
   },

   =========================================================
   PRODUCTOS
========================================================= */

const products = [

    /* =====================================================
       👇 PEGA AQUÍ EL PRODUCTO GENERADO POR admin.html 👇
       ===================================================== */
{
    id: "00001",
    name: "Camiseta blanca lv",
    reference: "00001",
    price: 0.00,
    stock: 10,
    category: "Ropa",
    sizes: [],
    colors: [
        {
            name: "Blanco",
            images: [
                "https://i.imgur.com/tC1X3xj.jpeg"
            ]
        }
    ],
    images: [],
    description: ""
},

    /* =====================================================
       👆 FIN PRODUCTO DE EJEMPLO
       ===================================================== */


    /* =====================================================
       👇 PRODUCTO 1 AQUÍ
       ===================================================== */


    /* =====================================================
       👆 FIN PRODUCTO 1
       ===================================================== */


    /* =====================================================
       👇 PRODUCTO 2 AQUÍ
       ===================================================== */


    /* =====================================================
       👆 FIN PRODUCTO 2
       ===================================================== */


];


/* =========================================================
   CONFIGURACIÓN WHATSAPP
========================================================= */

const WHATSAPP_NUMBER =
    "34674559614";


/* =========================================================
   ESTADO
========================================================= */

let cart = [];

let currentProduct = null;

let selectedSize = "";

let selectedColor = null;

let currentCategory = "Todos";


/* =========================================================
   PRODUCTOS
========================================================= */

function renderProducts(){

    const container =
        document.getElementById("products");

    let filtered = products;


    if(currentCategory !== "Todos"){

        filtered =
            products.filter(
                p =>
                    p.category === currentCategory
            );

    }


    if(!filtered.length){

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No hay productos todavía
                </h3>

                <p>
                    Añade productos desde tu
                    panel de administración.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered.map(product => {

            const image =
                getProductMainImage(product);

            const stock =
                Number(product.stock) || 0;


            return `

                <article class="product">

                    <div class="product-image">

                        <img
                            src="${escapeAttribute(image)}"
                            alt="${escapeHTML(product.name)}"
                            loading="lazy"
                            onerror="this.style.opacity='.25'"
                        >

                        ${
                            stock <= 0
                            ?
                            `
                            <span class="product-badge">
                                Agotado
                            </span>
                            `
                            :
                            ""
                        }

                    </div>


                    <div class="product-info">

                        <div class="category">
                            ${escapeHTML(
                                product.category || "Moda"
                            )}
                        </div>


                        <div class="product-name">
                            ${escapeHTML(product.name)}
                        </div>


                        <div class="price">
                            ${formatPrice(product.price)}
                        </div>


                        <div
                            class="
                                stock-info
                                ${stock <= 0
                                    ? "stock-out"
                                    : ""}
                            "
                        >

                            ${
                                stock <= 0
                                ? "Agotado"
                                : "Disponible"
                            }

                        </div>


                        <button
                            class="view-btn"
                            onclick="openProduct(
                                '${escapeJS(product.id)}'
                            )"
                        >
                            Ver producto
                        </button>

                    </div>

                </article>

            `;

        }).join("");

}


/* =========================================================
   IMAGEN PRINCIPAL
========================================================= */

function getProductMainImage(product){

    if(
        product.colors &&
        product.colors.length
    ){

        const firstColor =
            product.colors[0];

        if(
            typeof firstColor === "object" &&
            firstColor.image
        ){

            return firstColor.image;

        }

    }


    return product.images?.[0] || "";

}


/* =========================================================
   FILTROS
========================================================= */

function renderFilters(){

    const box =
        document.getElementById("filters");


    const categories = [
        "Todos",
        ...new Set(
            products
                .map(p => p.category)
                .filter(Boolean)
        )
    ];


    box.innerHTML =
        categories.map(category => `

            <button
                class="
                    filter
                    ${
                        currentCategory === category
                        ? "active"
                        : ""
                    }
                "
                onclick="
                    selectCategory(
                        '${escapeJS(category)}'
                    )
                "
            >
                ${escapeHTML(category)}
            </button>

        `).join("");

}


function selectCategory(category){

    currentCategory =
        category;

    renderFilters();

    renderProducts();

}


/* =========================================================
   ABRIR PRODUCTO
========================================================= */

function openProduct(id){

    currentProduct =
        products.find(
            p =>
                String(p.id) ===
                String(id)
        );


    if(!currentProduct){

        return;
    }


    selectedSize =
        currentProduct.sizes?.[0] || "";


    selectedColor =
        getColorObjects(
            currentProduct
        )[0] || null;


    renderProduct();


    document
        .getElementById("productModal")
        .classList.add("active");


    document.body.style.overflow =
        "hidden";

}


function closeProduct(){

    document
        .getElementById("productModal")
        .classList.remove("active");


    document.body.style.overflow =
        "";

}


/* =========================================================
   NORMALIZAR COLORES
========================================================= */

function getColorObjects(product){

    if(!Array.isArray(product.colors)){

        return [];

    }


    return product.colors.map(color => {

        if(
            typeof color === "string"
        ){

            return {
                name:color,
                image:""
            };

        }


        return {
            name:
                color.name || "",
            image:
                color.image || ""
        };

    });

}


/* =========================================================
   RENDER PRODUCTO
========================================================= */

function renderProduct(){

        currentProduct;


    if(!p) return;


    const images =
        Array.isArray(p.images)
        ? p.images
        : [];


    const colors =

    document

        .innerHTML = `

        <div>

            <div

                    ?
                    images.map(image => `

                        <div class="slide">

                                src="${escapeAttribute(image)}"
                                alt="${escapeHTML(p.name)}"
                                onerror="
                                    this.style.opacity='.25'
                                "
                            >

                        </div>

                    `).join("")
                    :
                    `
                    <div class="slide">

                        <img
                            src=""
                            alt=""
                        >

                    </div>
                    `
                }

            </div>


            <div class="dots">

                ${
                    images.map(
                        (_,i) => `

                        <span
                            class="
                                dot
                                ${
                                    i === 0
                                    ? "active"
                                    : ""
                                }
                            "
                        ></span>

                    `
                    ).join("")
                }

            </div>

        </div>


        <div class="details">

            <h2>
                ${escapeHTML(p.name)}
            </h2>


            <div class="reference">

                Ref:
                ${escapeHTML(
                    p.reference || ""
                )}

            </div>


            <div class="details-price">

                ${formatPrice(p.price)}

            </div>


            ${
                p.description
                ?
                `
                <div class="description">

                    ${escapeHTML(
                        p.description
                    )}

                </div>
                `
                :
                ""
            }


            ${
                p.sizes?.length
                ?
                `

                <div class="option-title">
                    Talla
                </div>

                <div class="options">

                    ${
                        p.sizes.map(
                            size => `

                            <button
                                class="
                                    option
                                    ${
                                        selectedSize === size
                                        ? "selected"
                                        : ""
                                    }
                                "
                                onclick="
                                    selectSize(
                                        '${escapeJS(size)}'
                                    )
                                "
                            >
                                ${escapeHTML(size)}
                            </button>

                        `
                        ).join("")
                    }

                </div>

                `
                :
                ""
            }


            ${
                colors.length
                ?
                `

                <div class="option-title">
                    Color
                </div>

                <div class="options">

                    ${
                        colors.map(
                            (color,index) => `

                            <button
                                class="
                                    option
                                    color-option
                                    ${
                                        selectedColor &&
                                        selectedColor.name ===

                                        ? "selected"
                                        : ""
                                    }
                                "
                                onclick="
                                    selectColor(
                                        ${index}
                                    )
                                "

                                ${
                                    color.image

                                    `
                                    <img
                                        class="

                                        alt=""

                                            this.style.opacity='.3'
                                        "
                                    >

                                }

            <button

    setupGallery();


    /* =====================================================
       SI HAY COLOR SELECCIONADO, MOSTRAMOS SU IMAGEN
       COMO PRIMERA IMAGEN DE LA GALERÍA
    ===================================================== */

/* =========================================================
   MOSTRAR IMAGEN DEL COLOR
========================================================= */

function showColorImage(image){

    const track =
        document.getElementById(
            "galleryTrack"
        );


    if(!track) return;


    const slides =
        Array.from(
            track.querySelectorAll(".slide")
        );


    const target =
        slides.find(
            slide => {

                const img =
                    slide.querySelector("img");

                return img &&
                    img.src === image;

            }
        );


    if(!target){

        return;

    }


    track.scrollTo({

        left:
            target.offsetLeft,

        behavior:"smooth"

    });


    updateGalleryDots(
        slides.indexOf(target)
    );

}


/* =========================================================
   GALERÍA
========================================================= */

function setupGallery(){

    const track =
        document.getElementById(
            "galleryTrack"
        );


    if(!track) return;


    track.addEventListener(
        "scroll",
        () => {

            const index =
                Math.round(
                    track.scrollLeft /
                    track.clientWidth
                );


            updateGalleryDots(index);

        }
    );

}


function updateGalleryDots(index){

    const dots =
        document.querySelectorAll(
            ".dot"
        );


    dots.forEach(
        (dot,i) => {

            dot.classList.toggle(
                "active",
                i === index
            );

        }
    );

}


/* =========================================================
   TALLA
========================================================= */

function selectSize(size){

    selectedSize =
        size;

    renderProduct();

}


/* =========================================================
   COLOR
========================================================= */

function selectColor(index){

    const colors =
        getColorObjects(
            currentProduct
        );


    selectedColor =
        colors[index] || null;


    renderProduct();

}


/* =========================================================
   AÑADIR AL CARRITO
========================================================= */

function addToCart(){

    if(!currentProduct){

        return;
    }


    const stock =
        Number(
            currentProduct.stock
        ) || 0;


    if(stock <= 0){

        alert(
            "Este producto está agotado."
        );

        return;
    }


    const existing =
        cart.find(
            item =>
                item.id ===
                    currentProduct.id &&
                item.size ===
                    selectedSize &&
                item.color ===
                    (
                        selectedColor
                        ? selectedColor.name
                        : ""
                    )
        );


    if(existing){

        if(
            existing.quantity >=
            stock
        ){

            alert(
                "No puedes añadir más unidades de las disponibles."
            );

            return;
        }


        existing.quantity++;

    }else{

        cart.push({

            id:
                currentProduct.id,

            name:
                currentProduct.name,

            reference:
                currentProduct.reference,

            price:
                Number(
                    currentProduct.price
                ),

            image:
                selectedColor?.image ||
                currentProduct.images?.[0] ||
                "",

            size:
                selectedSize,

            color:
                selectedColor?.name ||
                "",

            quantity:
                1,

            maxStock:
                stock

        });

    }


    updateCartCount();

    closeProduct();

    renderCart();


    alert(
        "Producto añadido al carrito."
    );

}


/* =========================================================
   CONTADOR CARRITO
========================================================= */

function updateCartCount(){

    const count =
        cart.reduce(
            (sum,item) =>
                sum + item.quantity,
            0
        );


    document
        .getElementById(
            "cartCount"
        )
        .textContent =
        count;

}

                    alt="${escapeHTML(

                    )}"
                    onerror="

                    "
                >


                <div class="cart-item-info">

                    <div class="cart-item-name">

                        ${escapeHTML(
                            item.name
                        )}

                    </div>


                    <div class="cart-meta">

                        Ref:
                        ${escapeHTML(
                            item.reference
                        )}

                        ${
                            item.size
                            ?
                            `<br>Talla:
                            ${escapeHTML(
                                item.size
                            )}`
                            :
                            ""
                        }

                        ${
                            item.color
                            ?
                            `<br>Color:
                            ${escapeHTML(
                                item.color
                            )}`
                            :
                            ""
                        }

                    </div>


                    <strong>

                        ${formatPrice(
                            item.price *
                            item.quantity
                        )}

                    </strong>


                    <div
                        class="quantity-control"
                    >

                        <button
                            onclick="
                                changeQuantity(
                                    ${index},
                                    -1
                                )
                            "
                        >
                            −
                        </button>


                        <span
                            class="quantity-number"
                        >
                            ${item.quantity}
                        </span>


                        <button
                            onclick="
                                changeQuantity(
                                    ${index},
                                    1
                                )
                            "
                        >
                            +
                        </button>

                    </div>

                </div>


                <button
                    class="remove"
                    onclick="
                        removeItem(
                            ${index}
                        )
                    "
                    aria-label="Eliminar producto"
                >
                    ×
                </button>

            </div>

        `
        ).join("");


    const total =
        cart.reduce(
            (sum,item) =>
                sum +
                item.price *
                item.quantity,
            0
        );


    document
        .getElementById(
            "cartTotal"
        )
        .textContent =
        "Total: " +
        formatPrice(total);

}


/* =========================================================
   CANTIDAD
========================================================= */

function changeQuantity(
    index,
    amount
){

    const item =
        cart[index];


    if(!item) return;


    const newQuantity =
        item.quantity +
        amount;


    if(newQuantity <= 0){

        cart.splice(
            index,
            1
        );

    }else if(
        newQuantity >
        Number(item.maxStock || 999999)
    ){

        alert(
            "No hay más unidades disponibles."
        );

        return;

    }else{

        item.quantity =
            newQuantity;

    }


    updateCartCount();

    renderCart();

}


/* =========================================================
   ELIMINAR
========================================================= */

function removeItem(index){

    cart.splice(
        index,
        1
    );

    updateCartCount();

    renderCart();

}

   CHECKOUT
========================================================= */

function openCheckout(){

    closeCart();

    const url =

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* =========================================================
   ESCAPE ATRIBUTO
========================================================= */

function escapeAttribute(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}


/* =========================================================
   ESCAPE JAVASCRIPT
========================================================= */

function escapeJS(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* =========================================================
   PRECIO
========================================================= */

function formatPrice(price){

    return Number(
        price
    ).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}
