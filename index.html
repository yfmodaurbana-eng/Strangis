<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111111"
>

<meta
    name="description"
    content="Marcas & Moda - Tienda online de moda"
>

<title>Marcas & Moda</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:#fff;
    color:#111;

    line-height:1.4;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

img{
    max-width:100%;
}

body.modal-open{
    overflow:hidden;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{
    --black:#111;
    --white:#fff;
    --gray:#777;
    --light:#f5f5f5;
    --border:#e8e8e8;
    --green:#25d366;
    --danger:#b00020;
    --radius:12px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    background:#111;
    color:#fff;

    box-shadow:
        0 3px 18px rgba(0,0,0,.16);
}

.header-inner{
    max-width:1250px;
    min-height:70px;

    margin:auto;
    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.logo{
    color:#fff;
    text-decoration:none;

    font-size:24px;
    font-weight:900;

    letter-spacing:-1px;
}

.logo span{
    font-weight:400;
}

.cart-btn{
    border:0;

    background:#fff;
    color:#111;

    padding:11px 16px;

    border-radius:9px;

    font-weight:900;

    transition:.2s;
}

.cart-btn:hover{
    transform:translateY(-1px);
}

.cart-count{
    display:inline-flex;

    min-width:22px;
    height:22px;

    align-items:center;
    justify-content:center;

    margin-left:3px;

    background:#111;
    color:#fff;

    border-radius:50%;

    font-size:12px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:450px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:70px 20px;

    color:#fff;

    background:
        linear-gradient(
            rgba(0,0,0,.52),
            rgba(0,0,0,.52)
        ),
        linear-gradient(
            135deg,
            #111,
            #777
        );
}

.hero-content{
    max-width:800px;
}

.hero h1{
    font-size:clamp(42px,8vw,82px);

    line-height:.95;

    margin-bottom:20px;

    font-weight:900;

    letter-spacing:-3px;
}

.hero p{
    font-size:19px;

    margin-bottom:28px;

    color:#eee;
}

.hero-btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    background:#fff;
    color:#111;

    text-decoration:none;

    padding:14px 26px;

    border-radius:9px;

    font-weight:900;

    transition:.2s;
}

.hero-btn:hover{
    transform:translateY(-2px);
}


/* =========================================================
   CONTENEDOR
========================================================= */

.container{
    max-width:1250px;

    margin:auto;

    padding:
        55px
        18px
        90px;
}


/* =========================================================
   CABECERA CATALOGO
========================================================= */

.section-head{
    display:flex;

    align-items:flex-end;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.section-head h2{
    font-size:32px;

    margin-bottom:5px;
}

.section-head p{
    color:var(--gray);

    font-size:14px;
}


/* =========================================================
   FILTROS
========================================================= */

.filters{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:28px;
}

.filter{
    border:1px solid #ddd;

    background:#fff;
    color:#111;

    padding:9px 15px;

    border-radius:30px;

    font-weight:700;

    transition:.2s;
}

.filter:hover{
    border-color:#111;
}

.filter.active{
    background:#111;
    color:#fff;

    border-color:#111;
}


/* =========================================================
   PRODUCTOS
========================================================= */

.products{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:20px;
}

.product{
    overflow:hidden;

    background:#fff;

    border:1px solid var(--border);

    border-radius:14px;

    transition:
        transform .2s,
        box-shadow .2s;
}

.product:hover{
    transform:translateY(-4px);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.08);
}

.product-image{
    position:relative;

    overflow:hidden;

    background:#f4f4f4;
}

.product-image img{
    display:block;

    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;

    transition:transform .3s;
}

.product:hover .product-image img{
    transform:scale(1.02);
}

.stock-badge{
    position:absolute;

    top:10px;
    left:10px;

    padding:6px 9px;

    border-radius:6px;

    background:#111;
    color:#fff;

    font-size:11px;
    font-weight:800;
}

.stock-badge.out{
    background:#b00020;
}

.product-info{
    padding:16px;
}

.category{
    color:#888;

    font-size:11px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.5px;

    margin-bottom:6px;
}

.product-name{
    font-weight:900;

    margin-bottom:6px;

    min-height:22px;
}

.price{
    font-size:20px;

    font-weight:900;

    margin-bottom:13px;
}

.view-btn{
    width:100%;

    border:0;

    background:#111;
    color:#fff;

    padding:12px;

    border-radius:8px;

    font-weight:900;
}

.view-btn:hover{
    background:#222;
}

.view-btn:disabled{
    background:#bbb;

    cursor:not-allowed;
}


/* =========================================================
   SIN PRODUCTOS
========================================================= */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:80px 20px;

    color:#777;
}

.empty h3{
    color:#111;

    margin-bottom:8px;
}


/* =========================================================
   MODAL PRODUCTO
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:2000;

    display:none;

    align-items:flex-end;
    justify-content:center;

    background:
        rgba(0,0,0,.72);

    padding:0;
}

.modal.active{
    display:flex;
}

.product-modal{
    position:relative;

    width:100%;

    max-width:1150px;

    max-height:95vh;

    overflow:auto;

    background:#fff;

    border-radius:
        20px
        20px
        0
        0;

    padding:20px;
}

.close{
    display:flex;

    align-items:center;
    justify-content:center;

    margin-left:auto;

    width:40px;
    height:40px;

    border:0;

    background:#eee;

    border-radius:50%;

    font-size:24px;

    margin-bottom:15px;
}

.close:hover{
    background:#ddd;
}


/* =========================================================
   PRODUCTO DETALLE
========================================================= */

.product-layout{
    display:grid;

    grid-template-columns:
        minmax(0,1.05fr)
        minmax(0,.95fr);

    gap:35px;
}


/* =========================================================
   GALERIA
========================================================= */

.gallery-wrapper{
    min-width:0;
}

.gallery-track{
    display:flex;

    overflow-x:auto;

    scroll-snap-type:x mandatory;

    scrollbar-width:none;

    border-radius:14px;

    background:#f4f4f4;

    overscroll-behavior-x:contain;
}

.gallery-track::-webkit-scrollbar{
    display:none;
}

.slide{
    min-width:100%;

    scroll-snap-align:start;
}

.slide img{
    display:block;

    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;

    border-radius:14px;
}

.dots{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    margin-top:12px;
}

.dot{
    width:7px;
    height:7px;

    border:0;

    padding:0;

    border-radius:50%;

    background:#ccc;
}

.dot.active{
    background:#111;
}

.gallery-counter{
    text-align:center;

    color:#777;

    font-size:12px;

    margin-top:7px;
}


/* =========================================================
   DETALLES
========================================================= */

.details{
    padding:5px 0;
}

.details h2{
    font-size:34px;

    line-height:1.1;

    margin-bottom:7px;
}

.reference{
    color:#888;

    font-size:13px;

    margin-bottom:16px;
}

.details-price{
    font-size:28px;

    font-weight:900;

    margin-bottom:20px;
}

.description{
    color:#555;

    line-height:1.7;

    white-space:pre-line;

    margin-bottom:24px;
}


/* =========================================================
   OPCIONES
========================================================= */

.option-block{
    margin-bottom:21px;
}

.option-title{
    display:flex;

    justify-content:space-between;

    gap:10px;

    font-weight:900;

    margin-bottom:9px;
}

.selected-value{
    color:#777;

    font-size:13px;

    font-weight:500;
}

.options{
    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.option{
    border:1px solid #ccc;

    background:#fff;
    color:#111;

    padding:10px 15px;

    border-radius:8px;

    font-weight:700;

    transition:.2s;
}

.option:hover{
    border-color:#111;
}

.option.selected{
    background:#111;
    color:#fff;

    border-color:#111;
}

.option:disabled{
    opacity:.35;

    text-decoration:line-through;

    cursor:not-allowed;
}


/* =========================================================
   INFORMACION COLOR
========================================================= */

.color-images-info{
    display:none;
}


/* =========================================================
   STOCK
========================================================= */

.stock-info{
    margin-bottom:18px;

    padding:11px 13px;

    border-radius:8px;

    background:#f5f5f5;

    color:#555;

    font-size:13px;
}

.stock-info.low{
    background:#fff5d6;

    color:#735700;
}

.stock-info.out{
    background:#ffe8ed;

    color:#9d0020;
}


/* =========================================================
   BOTON CARRITO
========================================================= */

.add-cart{
    width:100%;

    border:0;

    background:#111;
    color:#fff;

    padding:16px;

    border-radius:9px;

    font-weight:900;

    font-size:15px;
}

.add-cart:hover{
    background:#222;
}

.add-cart:disabled{
    background:#bbb;

    cursor:not-allowed;
}


/* =========================================================
   CARRITO
========================================================= */

.cart-modal{
    position:fixed;

    inset:0;

    z-index:3000;

    display:none;

    background:
        rgba(0,0,0,.65);
}

.cart-modal.active{
    display:block;
}

.cart{
    width:100%;

    max-width:530px;

    height:100%;

    margin-left:auto;

    overflow:auto;

    background:#fff;

    padding:22px;
}

.cart-head{
    position:sticky;

    top:0;

    z-index:2;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    padding-bottom:18px;

    margin-bottom:5px;

    background:#fff;
}

.cart-head h2{
    font-size:23px;
}

.cart-head button{
    display:flex;

    align-items:center;
    justify-content:center;

    width:38px;
    height:38px;

    border:0;

    background:#eee;

    border-radius:50%;

    font-size:21px;
}


/* =========================================================
   ITEM CARRITO
========================================================= */

.cart-item{
    display:flex;

    gap:12px;

    padding:16px 0;

    border-bottom:1px solid #eee;
}

.cart-item img{
    flex:none;

    width:72px;
    height:92px;

    object-fit:cover;

    border-radius:8px;

    background:#f4f4f4;
}

.cart-item-info{
    min-width:0;

    flex:1;
}

.cart-item-name{
    font-weight:900;

    margin-bottom:5px;
}

.cart-meta{
    color:#777;

    font-size:12px;

    line-height:1.6;

    margin-bottom:8px;
}

.cart-price{
    font-weight:900;
}

.cart-actions{
    display:flex;

    align-items:center;

    gap:5px;

    margin-top:9px;
}

.quantity-btn{
    width:28px;
    height:28px;

    border:1px solid #ddd;

    background:#fff;

    border-radius:6px;

    font-weight:900;
}

.quantity-value{
    min-width:28px;

    text-align:center;

    font-size:13px;

    font-weight:800;
}

.remove{
    flex:none;

    width:31px;
    height:31px;

    border:0;

    background:#fff0f2;

    color:#a00020;

    border-radius:50%;

    font-size:18px;
}

.empty-cart{
    padding:60px 10px;

    text-align:center;

    color:#777;
}

.empty-cart strong{
    display:block;

    color:#111;

    font-size:18px;

    margin-bottom:5px;
}


/* =========================================================
   TOTAL
========================================================= */

.cart-footer{
    padding-top:20px;

    position:sticky;

    bottom:0;

    background:#fff;
}

.total{
    display:flex;

    justify-content:space-between;

    gap:15px;

    font-size:23px;

    font-weight:900;

    margin-bottom:15px;
}

.checkout-btn{
    width:100%;

    border:0;

    background:#25d366;
    color:#fff;

    padding:15px;

    border-radius:9px;

    font-weight:900;

    font-size:15px;
}

.checkout-btn:hover{
    background:#1fbd5b;
}

.checkout-btn:disabled{
    background:#bbb;

    cursor:not-allowed;
}


/* =========================================================
   CHECKOUT
========================================================= */

.checkout-modal{
    position:fixed;

    inset:0;

    z-index:4000;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.72);

    padding:15px;
}

.checkout-modal.active{
    display:flex;
}

.checkout-box{
    width:100%;

    max-width:620px;

    max-height:95vh;

    overflow:auto;

    background:#fff;

    border-radius:16px;

    padding:24px;
}

.checkout-head{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;
}

.checkout-head h2{
    font-size:24px;
}

.checkout-close{
    width:36px;
    height:36px;

    border:0;

    background:#eee;

    border-radius:50%;

    font-size:20px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;

    font-size:13px;

    font-weight:900;

    margin-bottom:6px;
}

.form-group input,
.form-group textarea{
    width:100%;

    border:1px solid #ddd;

    border-radius:8px;

    padding:12px;

    outline:none;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#111;
}

.form-group textarea{
    min-height:90px;

    resize:vertical;
}

.required-note{
    color:#777;

    font-size:12px;

    margin-bottom:15px;
}

.confirm{
    width:100%;

    border:0;

    background:#25d366;
    color:#fff;

    padding:15px;

    border-radius:9px;

    font-weight:900;
}

.back{
    width:100%;

    border:0;

    background:#eee;
    color:#111;

    padding:13px;

    border-radius:8px;

    margin-top:8px;

    font-weight:800;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    background:#111;

    color:#fff;

    text-align:center;

    padding:40px 20px;
}

.footer strong{
    display:block;

    font-size:21px;

    margin-bottom:8px;
}

.footer p{
    color:#aaa;

    font-size:13px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;

    bottom:25px;

    z-index:9999;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#111;
    color:#fff;

    padding:12px 18px;

    border-radius:8px;

    font-size:13px;

    font-weight:700;

    transition:.25s;
}

.toast.show{
    transform:
        translate(-50%,0);

    opacity:1;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

    .products{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

}

@media(max-width:760px){

    .products{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:11px;
    }

    .product-layout{
        grid-template-columns:1fr;

        gap:22px;
    }

    .hero{
        min-height:380px;
    }

    .hero h1{
        letter-spacing:-2px;
    }

    .container{
        padding-top:35px;
    }

    .section-head h2{
        font-size:26px;
    }

    .details h2{
        font-size:28px;
    }

}

@media(max-width:480px){

    .header-inner{
        min-height:62px;

        padding:
            0 12px;
    }

    .logo{
        font-size:19px;
    }

    .cart-btn{
        padding:9px 11px;

        font-size:12px;
    }

    .hero{
        min-height:340px;

        padding:50px 16px;
    }

    .hero p{
        font-size:16px;
    }

    .container{
        padding-left:12px;
        padding-right:12px;
    }

    .product-info{
        padding:12px;
    }

    .product-name{
        font-size:14px;
    }

    .price{
        font-size:17px;
    }

    .view-btn{
        padding:10px;

        font-size:12px;
    }

    .product-modal{
        padding:13px;
    }

    .cart{
        padding:17px;
    }

    .checkout-box{
        padding:18px;
    }

}


/* =========================================================
   ACCESIBILIDAD
========================================================= */

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
    outline:3px solid #777;

    outline-offset:2px;
}

</style>
</head>

<body>


<!-- =======================================================
     CABECERA
======================================================= -->

<header class="header">

    <div class="header-inner">

        <a
            href="#"
            class="logo"
        >
            Marcas <span>&</span> Moda
        </a>

        <button
            class="cart-btn"
            type="button"
            onclick="openCart()"
        >
            🛒 Carrito
            <span
                id="cartCount"
                class="cart-count"
            >0</span>
        </button>

    </div>

</header>


<!-- =======================================================
     HERO
======================================================= -->

<section class="hero">

    <div class="hero-content">

        <h1>Marcas & Moda</h1>

        <p>
            Descubre tu estilo. Descubre tu moda.
        </p>

        <a
            class="hero-btn"
            href="#catalogo"
        >
            Ver colección
        </a>

    </div>

</section>


<!-- =======================================================
     CATALOGO
======================================================= -->

<main
    id="catalogo"
    class="container"
>

    <div class="section-head">

        <div>

            <h2>
                Nuestra colección
            </h2>

            <p>
                Moda seleccionada para tu estilo.
            </p>

        </div>

    </div>


    <!-- FILTROS -->

    <div
        id="filters"
        class="filters"
    ></div>


    <!-- PRODUCTOS -->

    <div
        id="products"
        class="products"
    ></div>

</main>


<!-- =======================================================
     FOOTER
======================================================= -->

<footer class="footer">

    <strong>
        Marcas & Moda
    </strong>

    <p>
        Moda, estilo y tendencias.
    </p>

</footer>


<!-- =======================================================
     MODAL PRODUCTO
======================================================= -->

<div
    id="productModal"
    class="modal"
    aria-hidden="true"
>

    <div class="product-modal">

        <button
            class="close"
            type="button"
            onclick="closeProduct()"
            aria-label="Cerrar"
        >
            ×
        </button>

        <div
            id="productContent"
            class="product-layout"
        ></div>

    </div>

</div>


<!-- =======================================================
     CARRITO
======================================================= -->

<div
    id="cartModal"
    class="cart-modal"
    aria-hidden="true"
>

    <div class="cart">

        <div class="cart-head">

            <h2>
                🛒 Tu carrito
            </h2>

            <button
                type="button"
                onclick="closeCart()"
                aria-label="Cerrar carrito"
            >
                ×
            </button>

        </div>


        <div id="cartItems"></div>


        <div class="cart-footer">

            <div
                id="cartTotal"
                class="total"
            >
                <span>Total</span>
                <span>0,00 €</span>
            </div>

            <button
                id="checkoutButton"
                class="checkout-btn"
                type="button"
                onclick="openCheckout()"
            >
                Continuar con el pedido
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     CHECKOUT
======================================================= -->

<div
    id="checkoutModal"
    class="checkout-modal"
    aria-hidden="true"
>

    <div class="checkout-box">

        <div class="checkout-head">

            <h2>
                📦 Datos de envío
            </h2>

            <button
                class="checkout-close"
                type="button"
                onclick="closeCheckout()"
            >
                ×
            </button>

        </div>


        <p class="required-note">
            Los campos marcados con * son obligatorios.
        </p>

function loadCart(){

                cart = parsed;

/* =========================================================
   PRECIO
========================================================= */

function formatPrice(value){

    const number =
        Number(value);

    if(!Number.isFinite(number)){
        return "0,00 €";
    }

    return number.toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


/* =========================================================
   STOCK
========================================================= */

function getProductStock(product){

    if(!product){
        return 0;
    }

    /*
       Si el producto tiene colores con stock,
       sumamos el stock de los colores.
    */

    if(
        Array.isArray(product.colors) &&
        product.colors.length
    ){

        const variantStocks =
            product.colors
                .map(color =>
                    Number(color.stock)
                )
                .filter(Number.isFinite);

        if(variantStocks.length){

            return variantStocks.reduce(
                (sum,stock) =>
                    sum + Math.max(0,stock),
                0
            );

        }

    }

    return Math.max(
        0,
        Number(product.stock) || 0
    );

}


function getSelectedColorVariant(){

    if(!currentProduct){
        return null;
    }

    if(
        !Array.isArray(currentProduct.colors)
    ){
        return null;
    }

    return currentProduct.colors.find(
        color =>
            String(color.name) ===
            String(selectedColor)
    ) || null;

}


function getSelectedStock(){

    const variant =
        getSelectedColorVariant();

    if(variant){

        const stock =
            Number(variant.stock);

        return Number.isFinite(stock)
            ? Math.max(0,stock)
            : 0;
    }

    return Math.max(
        0,
        Number(currentProduct?.stock) || 0
    );

}


/* =========================================================
   IMAGEN PRINCIPAL DEL PRODUCTO
========================================================= */

function getProductMainImage(product){

    if(!product){
        return "";
    }

    if(
        Array.isArray(product.colors) &&
        product.colors.length
    ){

        const firstColor =
            product.colors[0];

        if(
            Array.isArray(firstColor.images) &&
            firstColor.images.length
        ){

            return firstColor.images[0];
        }

    }

    if(
        Array.isArray(product.images) &&
        product.images.length
    ){

        return product.images[0];
    }

    return "";

}


/* =========================================================
   OBTENER IMAGENES SEGÚN COLOR
========================================================= */

function getProductImages(product){

    if(!product){
        return [];
    }


    /*
       SISTEMA NUEVO:

       colors: [
           {
               name:"Blanco",
               images:[...]
           }
       ]
    */

    if(
        Array.isArray(product.colors) &&
        product.colors.length
    ){

        const selected =
            product.colors.find(
                color =>
                    String(color.name) ===
                    String(selectedColor)
            );

        if(
            selected &&
            Array.isArray(selected.images)
        ){

            return selected.images
                .filter(Boolean);
        }

    }


    /*
       COMPATIBILIDAD CON PRODUCTOS ANTIGUOS
    */

    if(
        Array.isArray(product.images)
    ){

        return product.images
            .filter(Boolean);
    }


    return [];

}

function openProduct(id){

        return;
    }


    selectedSize =
        Array.isArray(
            currentProduct.sizes

            ? (

                ""

            : "";


    selectedColor = "";


    if(
        Array.isArray(
            currentProduct.colors

        currentProduct.colors.length

        selectedColor =
            String(
                currentProduct.colors[0].name
            );

    }


    currentGalleryIndex = 0;


    renderProduct();


    const modal =
        document.getElementById(
            "productModal"

    modal.classList.add("active");

    modal.setAttribute(
        "aria-hidden",

    document.body.classList.add(

    );

}


function closeProduct(){

    const modal =
        document.getElementById(
            "productModal"

    modal.classList.remove(
        "active"

    modal.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.classList.remove(
        "modal-open"
    );

}

/* =========================================================
   SELECCIONAR TALLA
========================================================= */

function selectSize(size){

    selectedSize =
        String(size);

    renderProduct();

}


/* =========================================================
   SELECCIONAR COLOR
=========================================================

   🔥 ESTA ES LA PARTE IMPORTANTE.

   Al cambiar el color:

   1. Se cambia selectedColor.
   2. Se buscan las imágenes de ese color.
   3. Se vuelve a pintar la galería.
   4. Las fotografías cambian automáticamente.
*/

function selectColor(color){

    selectedColor =
        String(color);

    currentGalleryIndex = 0;

    renderProduct();

}


/* =========================================================
   GALERIA
========================================================= */

function setupGallery(){

    const track =
        document.getElementById(
            "galleryTrack"
        );


    if(!track){
        return;
    }


    track.addEventListener(
        "scroll",
        updateGalleryPosition,
        {
            passive:true
        }
    );


    /*
       Si el usuario desliza con el dedo,
       actualizamos los puntos.
    */

    updateGalleryPosition();

}


function updateGalleryPosition(){

    const track =
        document.getElementById(
            "galleryTrack"
        );


    if(!track){
        return;
    }


    if(!track.clientWidth){
        return;
    }


    const index =
        Math.round(
            track.scrollLeft /
            track.clientWidth
        );


    currentGalleryIndex =
        Math.max(0,index);


    const dots =
        document.querySelectorAll(
            "#galleryDots .dot"
        );


    dots.forEach(
        (dot,i) => {

            dot.classList.toggle(
                "active",
                i === currentGalleryIndex
            );

        }
    );


    const counter =
        document.getElementById(
            "galleryCounter"
        );


    if(counter){

        const total =
            getProductImages(
                currentProduct
            ).length;


        counter.textContent =
            `${currentGalleryIndex + 1} / ${total}`;

    }

}


function goToGallery(index){

    const track =
        document.getElementById(
            "galleryTrack"
        );


    if(!track){
        return;
    }


    const safeIndex =
        Math.max(
            0,
            Number(index) || 0
        );


    track.scrollTo({

        left:
            safeIndex *
            track.clientWidth,

        behavior:"smooth"

    });

}


/* =========================================================
   AÑADIR AL CARRITO
========================================================= */

function addToCart(){

    if(!currentProduct){
        return;
    }


    const stock =
        getSelectedStock();


    if(stock <= 0){

        showToast(
            "Este producto está agotado."
        );

        return;
    }


    /*
       Si tiene tallas,
       obligamos a tener talla.
    */

    if(
        Array.isArray(
            currentProduct.sizes
        ) &&
        currentProduct.sizes.length &&
        !selectedSize
    ){

        showToast(
            "Selecciona una talla."
        );

        return;
    }


    /*
       Si tiene colores,
       obligamos a seleccionar color.
    */

    if(
        Array.isArray(
            currentProduct.colors
        ) &&
        currentProduct.colors.length &&
        !selectedColor
    ){

        showToast(
            "Selecciona un color."
        );

        return;
    }


    const existing =
        cart.find(item =>

            String(item.id) ===
            String(currentProduct.id)

            &&

            String(item.size) ===
            String(selectedSize)

            &&

            String(item.color) ===
            String(selectedColor)

        );


    if(existing){

        if(
            existing.quantity + 1 >
            stock
        ){

            showToast(
                "No hay más unidades disponibles."
            );

            return;
        }


        existing.quantity++;

    }else{

        cart.push({

            id:
                String(
                    currentProduct.id
                ),

            name:
                currentProduct.name,

            reference:
                currentProduct.reference ||
                currentProduct.id,

            price:
                Number(
                    currentProduct.price
                ) || 0,

            image:
                getProductImages(
                    currentProduct
                )[0] ||
                getProductMainImage(
                    currentProduct
                ),

            size:
                selectedSize,

            color:
                selectedColor,

            quantity:1

        });

    }


    saveCart();

    updateCartCount();

    closeProduct();

    showToast(
        "✓ Producto añadido al carrito"
    );

}


/* =========================================================
   CONTADOR CARRITO
========================================================= */

function updateCartCount(){

    const count =
        cart.reduce(
            (total,item) =>
                total +
                (
                    Number(item.quantity) ||
                    0
                ),
            0
        );


    const element =
        document.getElementById(
            "cartCount"
        );


    element.textContent =
        count;

}

   ABRIR CARRITO
========================================================= */

function openCart(){

    renderCart();


    const modal =
        document.getElementById(
            "cartModal"
        );


    modal.classList.add(
        "active"
    );

    modal.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.classList.add(
        "modal-open"
    );

}


function closeCart(){

    const modal =
        document.getElementById(
            "cartModal"
        );


    modal.classList.remove(
        "active"
    );

    modal.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.classList.remove(
        "modal-open"
    );

}


/* =========================================================
   RENDER CARRITO
========================================================= */

function renderCart(){

    const box =
        document.getElementById(
            "cartItems"
        );


    const checkoutButton =
        document.getElementById(
            "checkoutButton"
        );


    if(!cart.length){

        box.innerHTML = `

            <div class="empty-cart">

                <strong>
                    Tu carrito está vacío
                </strong>

                <span>
                    Añade productos para continuar.
                </span>

            </div>

        `;


        updateCartTotal();

        checkoutButton.disabled =
            true;

        return;
    }


    checkoutButton.disabled =
        false;


    box.innerHTML =
        cart.map(
            (item,index) => `

                <div class="cart-item">

                    <img
                        src="${escapeAttribute(
                            item.image
                        )}"
                        alt="${escapeHTML(
                            item.name
                        )}"
                        onerror="imageError(this)"
                    >


                    <div
                        class="cart-item-info"
                    >

                        <div
                            class="cart-item-name"
                        >

                            ${
                                escapeHTML(
                                    item.name
                                )
                            }

                        </div>


                        <div class="cart-meta">

                            Ref:
                            ${
                                escapeHTML(
                                    item.reference
                                )
                            }

                            ${
                                item.size
                                    ? `
                                        <br>
                                        Talla:
                                        ${escapeHTML(
                                            item.size
                                        )}
                                    `
                                    : ""
                            }

                            ${
                                item.color
                                    ? `
                                        <br>
                                        Color:
                                        ${escapeHTML(
                                            item.color
                                        )}
                                    `
                                    : ""
                            }

                        </div>


                        <div class="cart-price">

                            ${
                                formatPrice(
                                    (
                                        Number(
                                            item.price
                                        ) || 0
                                    ) *
                                    (
                                        Number(
                                            item.quantity
                                        ) || 0
                                    )
                                )
                            }

                        </div>


                        <div class="cart-actions">

                            <button
                                type="button"
                                class="quantity-btn"
                                onclick="
                                    changeQuantity(
                                        ${index},
                                        -1
                                    )
                                "
                            >
                                −
                            </button>


                            <span
                                class="quantity-value"
                            >
                                ${
                                    Number(
                                        item.quantity
                                    ) || 0
                                }
                            </span>


                            <button
                                type="button"
                                class="quantity-btn"
                                onclick="
                                    changeQuantity(
                                        ${index},
                                        1
                                    )
                                "
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <button
                        type="button"
                        class="remove"
                        onclick="
                            removeItem(
                                ${index}
                            )
                        "
                        aria-label="Eliminar producto"
                    >
                        ×
                    </button>

                </div>

            `
        ).join("");


    updateCartTotal();

}


/* =========================================================
   TOTAL CARRITO
========================================================= */

function getCartTotal(){

    return cart.reduce(

        (total,item) =>

            total +

            (
                (
                    Number(
                        item.price
                    ) || 0
                )

                *

                (
                    Number(
                        item.quantity
                    ) || 0
                )
            ),

        0

    );

}


function updateCartTotal(){

    const total =
        getCartTotal();


    document.getElementById(
        "cartTotal"
    ).innerHTML = `

        <span>
            Total
        </span>

        <span>
            ${formatPrice(total)}
        </span>

    `;

}


/* =========================================================
   CAMBIAR CANTIDAD
========================================================= */

function changeQuantity(
    index,
    amount
){

    const item =
        cart[index];


    if(!item){
        return;
    }


    const product =
        products.find(
            product =>
                String(product.id) ===
                String(item.id)
        );


    if(!product){
        return;
    }


    let maxStock =
        Number(
            product.stock
        ) || 0;


    /*
       Si el producto tiene colores,
       buscamos el stock del color
       seleccionado en el carrito.
    */

    if(
        item.color &&
        Array.isArray(
            product.colors
        )
    ){

        const variant =
            product.colors.find(
                color =>
                    String(color.name) ===
                    String(item.color)
            );


        if(variant){

            maxStock =
                Number(
                    variant.stock
                ) || 0;

        }

    }


    const newQuantity =
        (
            Number(
                item.quantity
            ) || 0
        ) + amount;


    if(newQuantity <= 0){

        cart.splice(
            index,
            1
        );

    }else if(
        newQuantity <= maxStock
    ){

        item.quantity =
            newQuantity;

    }else{

        showToast(
            "No hay más stock disponible."
        );

        return;
    }


    saveCart();

    updateCartCount();

    renderCart();

}


/* =========================================================
   ELIMINAR ITEM
========================================================= */

function removeItem(index){

    if(
        index < 0 ||
        index >= cart.length
    ){
        return;
    }


    cart.splice(
        index,
        1
    );


    saveCart();

    updateCartCount();

    renderCart();

}


/* =========================================================
   CHECKOUT
========================================================= */

function openCheckout(){

    if(!cart.length){

        showToast(
            "Tu carrito está vacío."
        );

        return;
    }


    closeCart();


    const modal =
        document.getElementById(
            "checkoutModal"
        );


    modal.classList.add(
        "active"
    );

    modal.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.classList.add(
        "modal-open"
    );

}


function closeCheckout(){

    const modal =
        document.getElementById(
            "checkoutModal"
        );


    modal.classList.remove(
        "active"
    );

    modal.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.classList.remove(
        "modal-open"
    );

}


/* =========================================================
   WHATSAPP
========================================================= */

function sendWhatsApp(){

    if(!cart.length){

        showToast(
            "El carrito está vacío."
        );

        return;
    }


    const name =
        document
            .getElementById(
                "customerName"
            )
            .value
            .trim();


    const phone =
        document
            .getElementById(
                "customerPhone"
            )
            .value
            .trim();


    const address =
        document
            .getElementById(
                "customerAddress"
            )
            .value
            .trim();


    const postal =
        document
            .getElementById(
                "customerPostal"
            )
            .value
            .trim();


    const city =
        document
            .getElementById(
                "customerCity"
            )
            .value
            .trim();


    const notes =
        document
            .getElementById(
                "customerNotes"
            )
            .value
            .trim();


    if(
        !name ||
        !phone ||
        !address ||
        !postal ||
        !city
    ){

        showToast(
            "Completa todos los campos obligatorios."
        );

        return;
    }


    let message =
        "🛍️ NUEVO PEDIDO - MARCAS & MODA\n\n";


    message +=
        "👤 DATOS DEL CLIENTE\n";

    message +=
        "Nombre: " +
        name +
        "\n";

    message +=
        "Teléfono: " +
        phone +
        "\n";

    message +=
        "Dirección: " +
        address +
        "\n";

    message +=
        "Código postal: " +
        postal +
        "\n";

    message +=
        "Ciudad: " +
        city +
        "\n";

    message +=
        "País: España\n";


    if(notes){

        message +=
            "Observaciones: " +
            notes +
            "\n";

    }


    message +=
        "\n🛒 PRODUCTOS\n";


    cart.forEach(
        (item,index) => {

            message +=
                "\n" +
                (index + 1) +
                ". " +
                item.name +
                "\n";


            message +=
                "Referencia: " +
                item.reference +
                "\n";


            if(item.size){

                message +=
                    "Talla: " +
                    item.size +
                    "\n";

            }


            if(item.color){

                message +=
                    "Color: " +
                    item.color +
                    "\n";

            }


            message +=
                "Cantidad: " +
                item.quantity +
                "\n";


            message +=
                "Precio: " +
                formatPrice(
                    (
                        Number(
                            item.price
                        ) || 0
                    ) *
                    (
                        Number(
                            item.quantity
                        ) || 0
                    )
                ) +
                "\n";

        }
    );


    const total =
        getCartTotal();


    message +=
        "\n💰 TOTAL: " +
        formatPrice(total);


    const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* =========================================================
   SEGURIDAD ATRIBUTOS
========================================================= */

function escapeAttribute(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}


/* =========================================================
   ERROR DE IMAGEN
========================================================= */

function imageError(img){

    if(!img){
        return;
    }


    img.onerror =
        null;


    img.style.objectFit =
        "contain";


    img.style.padding =
        "25px";


    img.alt =
        "Imagen no disponible";

}
