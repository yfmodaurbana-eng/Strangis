<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111111">

<meta
    name="description"
    content="Marcas & Moda - Tienda online de moda"
>

<title>Marcas & Moda</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#111;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

body.no-scroll{
    overflow:hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111;
    color:#fff;
    box-shadow:0 2px 15px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1250px;
    min-height:70px;
    margin:auto;
    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    color:#fff;
    font-size:24px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    font-weight:400;
}

.cart-btn{
    border:0;
    background:#fff;
    color:#111;

    padding:11px 16px;

    border-radius:9px;

    font-weight:900;
}

.cart-btn:hover{
    background:#eee;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:430px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:70px 20px;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.55)
        ),
        linear-gradient(
            135deg,
            #111,
            #777
        );

    color:#fff;
}

.hero-content{
    max-width:800px;
}

.hero h1{
    font-size:clamp(42px,7vw,78px);
    line-height:1;
    margin-bottom:18px;
    font-weight:900;
    letter-spacing:-3px;
}

.hero p{
    font-size:18px;
    margin-bottom:28px;
    color:#eee;
}

.hero-btn{
    display:inline-block;

    background:#fff;
    color:#111;

    text-decoration:none;

    border-radius:9px;

    padding:14px 26px;

    font-weight:900;
}

.hero-btn:hover{
    background:#eee;
}


/* =========================================================
   CONTENIDO
========================================================= */

.container{
    max-width:1250px;
    margin:auto;

    padding:50px 20px 90px;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.section-head h2{
    font-size:32px;
}

.section-head p{
    margin-top:6px;
    color:#777;
    font-size:14px;
}


/* =========================================================
   FILTROS
========================================================= */

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;

    margin-bottom:28px;
}

.filter{
    border:1px solid #ddd;

    background:#fff;

    padding:9px 15px;

    border-radius:30px;

    font-weight:700;
}

.filter:hover{
    border-color:#111;
}

.filter.active{
    background:#111;
    color:#fff;
    border-color:#111;
}


/* =========================================================
   PRODUCTOS
========================================================= */

.products{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:20px;
}

.product{
    overflow:hidden;

    background:#fff;

    border:1px solid #eee;

    border-radius:13px;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.product:hover{
    transform:translateY(-4px);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.08);
}

.product-image{
    position:relative;
    background:#f4f4f4;
}

.product-image img{
    display:block;

    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;
}

.stock-badge{
    position:absolute;

    top:10px;
    left:10px;

    background:#fff;
    color:#111;

    padding:6px 9px;

    border-radius:6px;

    font-size:11px;

    font-weight:900;

    box-shadow:
        0 2px 8px rgba(0,0,0,.12);
}

.out-stock{
    background:#111;
    color:#fff;
}

.product-info{
    padding:16px;
}

.category{
    color:#888;

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:.5px;

    margin-bottom:7px;
}

.product-name{
    font-weight:900;

    font-size:16px;

    margin-bottom:7px;
}

.price{
    font-size:20px;

    font-weight:900;

    margin-bottom:13px;
}

.view-btn{
    width:100%;

    border:0;

    background:#111;
    color:#fff;

    padding:12px;

    border-radius:8px;

    font-weight:900;
}

.view-btn:hover{
    background:#333;
}

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:80px 20px;

    color:#777;
}


/* =========================================================
   MODAL PRODUCTO
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:2000;

    background:rgba(0,0,0,.72);

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;
}

.modal.active{
    display:flex;
}

.product-modal{
    position:relative;

    width:100%;
    max-width:1100px;

    max-height:94vh;

    overflow:auto;

    background:#fff;

    border-radius:18px;

    padding:22px;
}

.close{
    display:block;

    margin-left:auto;

    margin-bottom:15px;

    border:0;

    background:#eee;

    width:40px;
    height:40px;

    border-radius:50%;

    font-size:23px;
}

.close:hover{
    background:#ddd;
}

.product-layout{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:35px;
}


/* =========================================================
   GALERÍA
========================================================= */

.gallery{
    position:relative;
}

.gallery-track{
    display:flex;

    overflow-x:auto;

    scroll-snap-type:x mandatory;

    scrollbar-width:none;

    border-radius:12px;
}

.gallery-track::-webkit-scrollbar{
    display:none;
}

.slide{
    min-width:100%;

    scroll-snap-align:start;
}

.slide img{
    display:block;

    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;

    border-radius:12px;

    background:#f4f4f4;
}

.gallery-empty{
    aspect-ratio:3/4;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f4f4f4;

    border-radius:12px;

    color:#888;
}

.dots{
    display:flex;

    justify-content:center;

    gap:7px;

    margin-top:11px;
}

.dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ccc;
}

.dot.active{
    background:#111;
}


/* =========================================================
   DETALLES PRODUCTO
========================================================= */

.details h2{
    font-size:34px;

    line-height:1.1;

    margin-bottom:8px;
}

.reference{
    color:#888;

    font-size:13px;

    margin-bottom:15px;
}

.details-price{
    font-size:29px;

    font-weight:900;

    margin-bottom:20px;
}

.description{
    color:#555;

    line-height:1.65;

    margin-bottom:25px;

    white-space:pre-line;
}

.option-block{
    margin-bottom:20px;
}

.option-title{
    font-weight:900;

    margin-bottom:9px;
}

.options{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.option{
    border:1px solid #ccc;

    background:#fff;

    padding:10px 15px;

    border-radius:8px;

    font-weight:700;
}

.option:hover{
    border-color:#111;
}

.option.selected{
    background:#111;

    color:#fff;

    border-color:#111;
}

.color-option{
    display:flex;

    align-items:center;

    gap:7px;
}

.color-dot{
    width:12px;
    height:12px;

    border-radius:50%;

    background:#ddd;

    border:1px solid rgba(0,0,0,.15);
}

.stock-info{
    margin-bottom:18px;

    font-size:13px;

    color:#555;
}

.stock-info strong{
    color:#111;
}

.add-cart{
    width:100%;

    border:0;

    background:#111;
    color:#fff;

    padding:16px;

    border-radius:9px;

    font-weight:900;

    font-size:15px;
}

.add-cart:hover{
    background:#333;
}

.add-cart:disabled{
    background:#aaa;
    cursor:not-allowed;
}


/* =========================================================
   CARRITO
========================================================= */

.cart-modal{
    position:fixed;

    inset:0;

    z-index:3000;

    background:rgba(0,0,0,.65);

    display:none;
}

.cart-modal.active{
    display:block;
}

.cart{
    margin-left:auto;

    width:100%;
    max-width:520px;

    height:100%;

    overflow:auto;

    background:#fff;

    padding:22px;
}

.cart-head{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}

.cart-head h2{
    font-size:23px;
}

.cart-head button{
    border:0;

    background:#eee;

    width:38px;
    height:38px;

    border-radius:50%;

    font-size:20px;
}

.cart-item{
    display:flex;

    gap:12px;

    border-bottom:1px solid #eee;

    padding:15px 0;
}

.cart-item img{
    width:72px;
    height:92px;

    object-fit:cover;

    border-radius:7px;

    background:#f4f4f4;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:900;

    margin-bottom:5px;
}

.cart-meta{
    color:#777;

    font-size:12px;

    line-height:1.7;

    margin-bottom:6px;
}

.quantity-controls{
    display:flex;

    align-items:center;

    gap:8px;

    margin-top:8px;
}

.quantity-controls button{
    width:28px;
    height:28px;

    border:1px solid #ddd;

    background:#fff;

    border-radius:6px;

    font-weight:900;
}

.remove{
    flex-shrink:0;

    border:0;

    background:#fee;

    color:#a00;

    width:30px;
    height:30px;

    border-radius:50%;
}

.total{
    font-size:24px;

    font-weight:900;

    margin:25px 0;
}

.checkout-btn{
    width:100%;

    border:0;

    background:#25d366;
    color:#fff;

    padding:15px;

    border-radius:9px;

    font-weight:900;
}

.checkout-btn:disabled{
    background:#aaa;
}


/* =========================================================
   CHECKOUT
========================================================= */

.checkout-modal{
    position:fixed;

    inset:0;

    z-index:4000;

    background:rgba(0,0,0,.7);

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;
}

.checkout-modal.active{
    display:flex;
}

.checkout-box{
    width:100%;

    max-width:600px;

    max-height:95vh;

    overflow:auto;

    background:#fff;

    border-radius:15px;

    padding:24px;
}

.checkout-box h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;

    font-size:13px;

    font-weight:900;

    margin-bottom:6px;
}

.form-group input,
.form-group textarea{
    width:100%;

    border:1px solid #ddd;

    border-radius:8px;

    padding:12px;

    outline:none;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#111;
}

.form-group textarea{
    min-height:90px;

    resize:vertical;
}

.confirm{
    width:100%;

    border:0;

    background:#25d366;
    color:#fff;

    padding:15px;

    border-radius:8px;

    font-weight:900;
}

.back{
    width:100%;

    border:0;

    background:#eee;

    padding:13px;

    border-radius:8px;

    margin-top:8px;

    font-weight:800;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    background:#111;

    color:#fff;

    text-align:center;

    padding:40px 20px;
}

.footer strong{
    display:block;

    font-size:21px;

    margin-bottom:8px;
}

.footer p{
    color:#aaa;

    font-size:13px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:950px){

    .products{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

}

@media(max-width:700px){

    .products{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:10px;
    }

    .product-layout{
        grid-template-columns:1fr;
    }

    .hero{
        min-height:350px;
    }

    .container{
        padding-top:35px;
    }

    .section-head h2{
        font-size:25px;
    }

    .details h2{
        font-size:28px;
    }

}

@media(max-width:430px){

    .header-inner{
        padding:0 13px;
    }

    .logo{
        font-size:18px;
    }

    .cart-btn{
        padding:9px 11px;
    }

    .product-info{
        padding:12px;
    }

    .product-name{
        font-size:14px;
    }

    .price{
        font-size:17px;
    }

}

</style>
</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">

        <div class="logo">
            Marcas <span>&</span> Moda
        </div>

        <button
            class="cart-btn"
            onclick="openCart()"
        >
            🛒 Carrito
            (<span id="cartCount">0</span>)
        </button>

    </div>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <div class="hero-content">

        <h1>Marcas & Moda</h1>

        <p>
            Descubre tu estilo. Descubre tu moda.
        </p>

        <a
            class="hero-btn"
            href="#catalogo"
        >
            Ver colección
        </a>

    </div>

</section>


<!-- =====================================================
     CATÁLOGO
===================================================== -->

<main
    class="container"
    id="catalogo"
>

    <div class="section-head">

        <div>

            <h2>Nuestra colección</h2>

            <p>
                Moda seleccionada para tu estilo.
            </p>

        </div>

    </div>


    <div
        id="filters"
        class="filters"
    ></div>


    <div
        id="products"
        class="products"
    ></div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <strong>
        Marcas & Moda
    </strong>

    <p>
        Moda, estilo y tendencias.
    </p>

</footer>


<!-- =====================================================
     MODAL PRODUCTO
===================================================== -->

<div
    id="productModal"
    class="modal"
>

    <div class="product-modal">

        <button
            class="close"
            onclick="closeProduct()"
        >
            ×
        </button>

        <div
            id="productContent"
            class="product-layout"
        ></div>

    </div>

</div>


<!-- =====================================================
     CARRITO
===================================================== -->

<div
    id="cartModal"
    class="cart-modal"
>

    <div class="cart">

        <div class="cart-head">

            <h2>
                🛒 Tu carrito
            </h2>

            <button onclick="closeCart()">
                ×
            </button>

        </div>

        <div id="cartItems"></div>

        <div
            id="cartTotal"
            class="total"
        >
            Total: 0,00 €
        </div>

        <button
            id="checkoutButton"
            class="checkout-btn"
            onclick="openCheckout()"
        >
            Continuar con el pedido
        </button>

    </div>

</div>


<!-- =====================================================
     CHECKOUT
===================================================== -->

<div
    id="checkoutModal"
    class="checkout-modal"
>

    <div class="checkout-box">

        <h2>
            📦 Datos de envío
        </h2>

        <div class="form-group">

            <label>
                Nombre y apellidos *
            </label>

            <input
                id="customerName"
                type="text"
                autocomplete="name"
            >

        </div>


        <div class="form-group">

            <label>
                Teléfono *
            </label>

            <input
                id="customerPhone"
                type="tel"
                autocomplete="tel"
            >

        </div>


        <div class="form-group">

            <label>
                Dirección *
            </label>

            <input
                id="customerAddress"
                type="text"
                autocomplete="street-address"
            >

        </div>


        <div class="form-group">

            <label>
                Código postal *
            </label>

            <input
                id="customerPostal"
                type="text"
                autocomplete="postal-code"
            >

        </div>


        <div class="form-group">

            <label>
                Ciudad *
            </label>

            <input
                id="customerCity"
                type="text"
                autocomplete="address-level2"
            >

        </div>


        <div class="form-group">

            <label>
                País
            </label>

            <input
                value="España"
                readonly
            >

        </div>


        <div class="form-group">

            <label>
                Observaciones
            </label>

            <textarea
                id="customerNotes"
            ></textarea>

        </div>


        <button
            class="confirm"
            onclick="sendWhatsApp()"
        >
            Confirmar pedido por WhatsApp
        </button>


        <button
            class="back"
            onclick="closeCheckout()"
        >
            Volver
        </button>

    </div>

</div>


<script>

/* =========================================================
   🟢 PRODUCTOS DE LA TIENDA
   =========================================================

   AQUÍ PEGARÁS LOS PRODUCTOS GENERADOS DESDE admin.html.

   IMPORTANTE:

   Cada producto tiene:

   id
   name
   reference
   price
   category
   description
   variants

   Cada variante puede tener:

   color
   stock
   sizes
   images

   EJEMPLO:

   {
       id: "cam-001",
       name: "Camiseta Premium",
       reference: "CAM-001",
       price: 29.99,
       category: "Camisetas",

       description: "Descripción...",

       variants: [

           {
               color: "Blanco",
               stock: 10,
               sizes: ["S","M","L","XL"],
               images: [
                   "URL-FOTO-BLANCA-1",
                   "URL-FOTO-BLANCA-2"
               ]
           },

           {
               color: "Negro",
               stock: 5,
               sizes: ["S","M","L"],
               images: [
                   "URL-FOTO-NEGRA-1",
                   "URL-FOTO-NEGRA-2"
               ]
           }

       ]
   },

   ========================================================= */


/* 🟢 PEGA AQUÍ LOS PRODUCTOS GENERADOS DESDE ADMIN */

const products = [

    /*
       EJEMPLO DE PRODUCTO

       Puedes borrarlo cuando empieces.

    */

    {
        id: "ejemplo-001",

        name: "Camiseta de ejemplo",

        reference: "EJ-001",

        price: 29.99,

        category: "Camisetas",

        description:
            "Producto de ejemplo. Puedes eliminarlo cuando empieces a añadir tus productos.",

        variants: [

            {
                color: "Blanco",

                stock: 10,

                sizes: [
                    "S",
                    "M",
                    "L",
                    "XL"
                ],

                images: [
                    "https://placehold.co/800x1067/f2f2f2/111111?text=Blanco+1",
                    "https://placehold.co/800x1067/e9e9e9/111111?text=Blanco+2"
                ]
            },

            {
                color: "Negro",

                stock: 5,

                sizes: [
                    "S",
                    "M",
                    "L"
                ],

                images: [
                    "https://placehold.co/800x1067/222222/ffffff?text=Negro+1",
                    "https://placehold.co/800x1067/111111/ffffff?text=Negro+2"
                ]
            }

        ]
    }

    // 🟢 AQUÍ PUEDES PEGAR MÁS PRODUCTOS
    // Cada producto debe terminar en una coma excepto el último.

];


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WHATSAPP_NUMBER = "34674559614";

const CART_STORAGE_KEY =
    "marcas_moda_cart_v2";


let cart = [];

let currentProduct = null;

let selectedVariant = null;

let selectedSize = "";

let currentCategory = "Todos";


/* =========================================================
   INICIO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    init
);


function init(){

    loadCart();

    renderFilters();

    renderProducts();

    updateCartCount();

    setupKeyboard();

}


/* =========================================================
   CATEGORÍAS
========================================================= */

function renderFilters(){

    const box =
        document.getElementById("filters");

    const categories = [
        "Todos",
        ...new Set(
            products
                .map(p => p.category)
                .filter(Boolean)
        )
    ];

    box.innerHTML =
        categories.map(category => `

            <button
                class="filter ${
                    currentCategory === category
                    ? "active"
                    : ""
                }"
                onclick="selectCategory('${escapeJS(category)}')"
            >
                ${escapeHTML(category)}
            </button>

        `).join("");
}


function selectCategory(category){

    currentCategory = category;

    renderFilters();

    renderProducts();

}


/* =========================================================
   PRODUCTOS
========================================================= */

function renderProducts(){

    const container =
        document.getElementById("products");

    let filtered = products;

    if(currentCategory !== "Todos"){

        filtered =
            products.filter(
                p =>
                    p.category ===
                    currentCategory
            );

    }


    if(!filtered.length){

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No hay productos todavía
                </h3>

                <p>
                    Añade productos desde tu panel
                    de administración.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered.map(product => {

            const variant =
                getFirstAvailableVariant(
                    product
                );

            const image =
                variant?.images?.[0] || "";

            const stock =
                getTotalStock(product);


            return `

                <article class="product">

                    <div class="product-image">

                        <img
                            src="${escapeAttribute(image)}"
                            alt="${escapeHTML(product.name)}"
                            loading="lazy"
                            onerror="this.style.opacity='.25'"
                        >

                        <span
                            class="stock-badge ${
                                stock <= 0
                                ? "out-stock"
                                : ""
                            }"
                        >
                            ${
                                stock > 0
                                ? "Disponible"
                                : "Agotado"
                            }
                        </span>

                    </div>


                    <div class="product-info">

                        <div class="category">
                            ${escapeHTML(
                                product.category ||
                                "Moda"
                            )}
                        </div>


                        <div class="product-name">
                            ${escapeHTML(
                                product.name
                            )}
                        </div>


                        <div class="price">
                            ${formatPrice(
                                product.price
                            )}
                        </div>


                        <button
                            class="view-btn"
                            onclick="openProduct('${escapeJS(product.id)}')"
                        >
                            Ver producto
                        </button>

                    </div>

                </article>

            `;

        }).join("");

}


/* =========================================================
   STOCK
========================================================= */

function getTotalStock(product){

    return (product.variants || [])
        .reduce(
            (total,variant) =>
                total +
                Math.max(
                    0,
                    Number(variant.stock) || 0
                ),
            0
        );

}


function getFirstAvailableVariant(product){

    return (
        product.variants || []
    ).find(
        variant =>
            Number(variant.stock) > 0
    )
    ||
    product.variants?.[0]
    ||
    null;

}


/* =========================================================
   PRODUCTO
========================================================= */

function openProduct(id){

    currentProduct =
        products.find(
            p =>
                String(p.id) ===
                String(id)
        );


    if(!currentProduct) return;


    selectedVariant =
        getFirstAvailableVariant(
            currentProduct
        );


    selectedSize =
        selectedVariant?.sizes?.[0] || "";


    renderProduct();


    document
        .getElementById("productModal")
        .classList.add("active");


    document.body.classList.add(
        "no-scroll"
    );

}


function closeProduct(){

    document
        .getElementById("productModal")
        .classList.remove("active");


    document.body.classList.remove(
        "no-scroll"
    );

}


function renderProduct(){

    const p =
        currentProduct;


    if(!p) return;


    const variants =
        p.variants || [];


    const images =
        selectedVariant?.images || [];


    const sizes =
        selectedVariant?.sizes || [];


    document.getElementById(
        "productContent"
    ).innerHTML = `

        <div class="gallery">

            ${
                images.length

                ?

                `

                <div
                    id="galleryTrack"
                    class="gallery-track"
                >

                    ${
                        images.map(
                            image => `

                                <div
                                    class="slide"
                                >

                                    <img
                                        src="${escapeAttribute(image)}"
                                        alt="${escapeHTML(p.name)}"
                                        onerror="this.style.opacity='.25'"
                                    >

                                </div>

                            `
                        ).join("")
                    }

                </div>


                <div class="dots">

                    ${
                        images.map(
                            (_,index) => `

                                <span
                                    class="dot ${
                                        index === 0
                                        ? "active"
                                        : ""
                                    }"
                                ></span>

                            `
                        ).join("")
                    }

                </div>

                `

                :

                `

                <div class="gallery-empty">

                    Sin imágenes

                </div>

                `
            }

        </div>


        <div class="details">

            <h2>
                ${escapeHTML(p.name)}
            </h2>


            <div class="reference">
                Ref:
                ${escapeHTML(
                    p.reference || ""
                )}
            </div>


            <div class="details-price">
                ${formatPrice(p.price)}
            </div>


            ${
                p.description

                ?

                `

                <div class="description">
                    ${escapeHTML(
                        p.description
                    )}
                </div>

                `

                :

                ""
            }


            ${
                variants.length

                ?

                `

                <div class="option-block">

                    <div class="option-title">
                        Color
                    </div>

                    <div class="options">

                        ${
                            variants.map(
                                (variant,index) => `

                                    <button
                                        class="option color-option ${
                                            selectedVariant === variant
                                            ? "selected"
                                            : ""
                                        }"
                                        onclick="selectVariant(${index})"
                                        ${
                                            Number(variant.stock) <= 0
                                            ? "disabled"
                                            : ""
                                        }
                                    >

                                        <span
                                            class="color-dot"
                                        ></span>

                                        ${escapeHTML(
                                            variant.color
                                        )}

                                    </button>

                                `
                            ).join("")
                        }

                    </div>

                </div>

                `

                :

                ""
            }


            ${
                sizes.length

                ?

                `

                <div class="option-block">

                    <div class="option-title">
                        Talla
                    </div>

                    <div class="options">

                        ${
                            sizes.map(
                                size => `

                                    <button
                                        class="option ${
                                            selectedSize === size
                                            ? "selected"
                                            : ""
                                        }"
                                        onclick="selectSize('${escapeJS(size)}')"
                                    >
                                        ${escapeHTML(size)}
                                    </button>

                                `
                            ).join("")
                        }

                    </div>

                </div>

                `

                :

                ""
            }


            <div class="stock-info">

                ${
                    selectedVariant &&
                    Number(
                        selectedVariant.stock
                    ) > 0

                    ?

                    `Stock disponible:
                     <strong>
                        ${Number(
                            selectedVariant.stock
                        )}
                     </strong>`

                    :

                    `<strong>
                        Agotado
                     </strong>`
                }

            </div>


            <button
                class="add-cart"
                onclick="addToCart()"
                ${
                    !selectedVariant ||
                    Number(
                        selectedVariant.stock
                    ) <= 0

                    ? "disabled"

                    : ""
                }
            >

                🛒 Añadir al carrito

            </button>

        </div>

    `;


    setupGallery();

}


/* =========================================================
   CAMBIO DE COLOR
========================================================= */

function selectVariant(index){

    if(!currentProduct) return;


    const variant =
        currentProduct.variants?.[index];


    if(!variant) return;


    if(Number(variant.stock) <= 0){

        return;

    }


    selectedVariant =
        variant;


    selectedSize =
        variant.sizes?.[0] || "";


    renderProduct();

}


/* =========================================================
   CAMBIO DE TALLA
========================================================= */

function selectSize(size){

    selectedSize =
        size;

    renderProduct();

}


/* =========================================================
   GALERÍA
========================================================= */

function setupGallery(){

    const track =
        document.getElementById(
            "galleryTrack"
        );


    if(!track) return;


    const dots =
        document.querySelectorAll(
            ".dot"
        );


    track.addEventListener(
        "scroll",
        () => {

            const index =
                Math.round(
                    track.scrollLeft /
                    track.clientWidth
                );


            dots.forEach(
                (dot,i) => {

                    dot.classList.toggle(
                        "active",
                        i === index
                    );

                }
            );

        }
    );

}


/* =========================================================
   CARRITO
========================================================= */

function addToCart(){

    if(!currentProduct ||
       !selectedVariant){

        return;

    }


    const stock =
        Number(
            selectedVariant.stock
        ) || 0;


    if(stock <= 0){

        alert(
            "Este color está agotado."
        );

        return;

    }


    if(
        selectedVariant.sizes?.length &&
        !selectedSize
    ){

        alert(
            "Selecciona una talla."
        );

        return;

    }


    const variantKey =
        selectedVariant.color;


    const existing =
        cart.find(
            item =>
                item.id ===
                    currentProduct.id &&

                item.color ===
                    variantKey &&

                item.size ===
                    selectedSize
        );


    if(existing){

        if(
            existing.quantity >=
            stock
        ){

            alert(
                "No hay más unidades disponibles."
            );

            return;

        }


        existing.quantity++;

    }else{

        cart.push({

            id:
                currentProduct.id,

            name:
                currentProduct.name,

            reference:
                currentProduct.reference,

            price:
                Number(
                    currentProduct.price
                ),

            image:
                selectedVariant.images?.[0]
                || "",

            color:
                selectedVariant.color,

            size:
                selectedSize,

            quantity:
                1

        });

    }


    saveCart();

    updateCartCount();

    closeProduct();

    alert(
        "Producto añadido al carrito."
    );

}


/* =========================================================
   CARRITO - INTERFAZ
========================================================= */

function openCart(){

    renderCart();

    document
        .getElementById("cartModal")
        .classList.add("active");

    document.body.classList.add(
        "no-scroll"
    );

}


function closeCart(){

    document
        .getElementById("cartModal")
        .classList.remove("active");

    document.body.classList.remove(
        "no-scroll"
    );

}


function renderCart(){

    const box =
        document.getElementById(
            "cartItems"
        );


    const checkoutButton =
        document.getElementById(
            "checkoutButton"
        );


    if(!cart.length){

        box.innerHTML = `

            <p style="
                color:#777;
                padding:20px 0;
            ">
                Tu carrito está vacío.
            </p>

        `;


        document.getElementById(
            "cartTotal"
        ).textContent =
            "Total: 0,00 €";


        checkoutButton.disabled =
            true;


        return;

    }


    checkoutButton.disabled =
        false;


    box.innerHTML =
        cart.map(
            (item,index) => `

                <div class="cart-item">

                    <img
                        src="${escapeAttribute(item.image)}"
                        alt="${escapeHTML(item.name)}"
                    >


                    <div class="cart-item-info">

                        <div class="cart-item-name">
                            ${escapeHTML(item.name)}
                        </div>


                        <div class="cart-meta">

                            Ref:
                            ${escapeHTML(
                                item.reference
                            )}

                            ${
                                item.color
                                ?
                                `<br>Color:
                                 ${escapeHTML(
                                     item.color
                                 )}`
                                :
                                ""
                            }

                            ${
                                item.size
                                ?
                                `<br>Talla:
                                 ${escapeHTML(
                                     item.size
                                 )}`
                                :
                                ""
                            }

                        </div>


                        <strong>
                            ${formatPrice(
                                item.price *
                                item.quantity
                            )}
                        </strong>


                        <div
                            class="quantity-controls"
                        >

                            <button
                                onclick="changeQuantity(${index},-1)"
                            >
                                −
                            </button>

                            <strong>
                                ${item.quantity}
                            </strong>

                            <button
                                onclick="changeQuantity(${index},1)"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <button
                        class="remove"
                        onclick="removeItem(${index})"
                    >
                        ×
                    </button>

                </div>

            `
        ).join("");


    const total =
        cart.reduce(
            (sum,item) =>
                sum +
                (
                    item.price *
                    item.quantity
                ),
            0
        );


    document.getElementById(
        "cartTotal"
    ).textContent =
        "Total: " +
        formatPrice(total);

}


function changeQuantity(index,change){

    const item =
        cart[index];


    if(!item) return;


    if(change > 0){

        const product =
            products.find(
                p =>
                    p.id === item.id
            );


        const variant =
            product?.variants?.find(
                v =>
                    v.color ===
                    item.color
            );


        const stock =
            Number(
                variant?.stock
            ) || 0;


        if(
            item.quantity >=
            stock
        ){

            alert(
                "Has alcanzado el stock disponible."
            );

            return;

        }

    }


    item.quantity +=
        change;


    if(item.quantity <= 0){

        cart.splice(index,1);

    }


    saveCart();

    updateCartCount();

    renderCart();

}


function removeItem(index){

    cart.splice(
        index,
        1
    );

    saveCart();

    updateCartCount();

    renderCart();

}


/* =========================================================
   LOCAL STORAGE CARRITO
========================================================= */

function saveCart(){

    localStorage.setItem(
        CART_STORAGE_KEY,
        JSON.stringify(cart)
    );

}


function loadCart(){

    try{

        const saved =
            localStorage.getItem(
                CART_STORAGE_KEY
            );


        cart =
            saved
            ? JSON.parse(saved)
            : [];


        if(!Array.isArray(cart)){
            cart = [];
        }

    }catch(error){

        cart = [];

    }

}


function updateCartCount(){

    const count =
        cart.reduce(
            (sum,item) =>
                sum +
                Number(item.quantity || 0),
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent =
        count;

}


/* =========================================================
   CHECKOUT
========================================================= */

function openCheckout(){

    if(!cart.length){

        alert(
            "Tu carrito está vacío."
        );

        return;

    }


    closeCart();


    document
        .getElementById(
            "checkoutModal"
        )
        .classList.add("active");


    document.body.classList.add(
        "no-scroll"
    );

}


function closeCheckout(){

    document
        .getElementById(
            "checkoutModal"
        )
        .classList.remove("active");


    document.body.classList.remove(
        "no-scroll"
    );

}


/* =========================================================
   WHATSAPP
========================================================= */

function sendWhatsApp(){

    const name =
        document
            .getElementById(
                "customerName"
            )
            .value
            .trim();


    const phone =
        document
            .getElementById(
                "customerPhone"
            )
            .value
            .trim();


    const address =
        document
            .getElementById(
                "customerAddress"
            )
            .value
            .trim();


    const postal =
        document
            .getElementById(
                "customerPostal"
            )
            .value
            .trim();


    const city =
        document
            .getElementById(
                "customerCity"
            )
            .value
            .trim();


    const notes =
        document
            .getElementById(
                "customerNotes"
            )
            .value
            .trim();


    if(
        !name ||
        !phone ||
        !address ||
        !postal ||
        !city
    ){

        alert(
            "Completa todos los campos obligatorios."
        );

        return;

    }


    let message =
        "🛍️ *NUEVO PEDIDO - MARCAS & MODA*\n\n";


    message +=
        "👤 *DATOS DEL CLIENTE*\n";

    message +=
        "Nombre: " +
        name +
        "\n";

    message +=
        "Teléfono: " +
        phone +
        "\n";

    message +=
        "Dirección: " +
        address +
        "\n";

    message +=
        "Código postal: " +
        postal +
        "\n";

    message +=
        "Ciudad: " +
        city +
        "\n";

    message +=
        "País: España\n";


    if(notes){

        message +=
            "Observaciones: " +
            notes +
            "\n";

    }


    message +=
        "\n🛒 *PRODUCTOS*\n";


    cart.forEach(
        (item,index) => {

            message +=
                "\n" +
                (index + 1) +
                ". " +
                item.name +
                "\n";


            message +=
                "Referencia: " +
                item.reference +
                "\n";


            if(item.color){

                message +=
                    "Color: " +
                    item.color +
                    "\n";

            }


            if(item.size){

                message +=
                    "Talla: " +
                    item.size +
                    "\n";

            }


            message +=
                "Cantidad: " +
                item.quantity +
                "\n";


            message +=
                "Precio: " +
                formatPrice(
                    item.price *
                    item.quantity
                ) +
                "\n";

        }
    );


    const total =
        cart.reduce(
            (sum,item) =>
                sum +
                (
                    item.price *
                    item.quantity
                ),
            0
        );


    message +=
        "\n💰 *TOTAL: " +
        formatPrice(total) +
        "*";


    const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   TECLADO / CIERRES
========================================================= */

function setupKeyboard(){

    document.addEventListener(
        "keydown",
        event => {

            if(event.key !== "Escape"){
                return;
            }


            closeProduct();

            closeCart();

            closeCheckout();

        }
    );


    document
        .getElementById(
            "productModal"
        )
        .addEventListener(
            "click",
            event => {

                if(
                    event.target.id ===
                    "productModal"
                ){

                    closeProduct();

                }

            }
        );


    document
        .getElementById(
            "cartModal"
        )
        .addEventListener(
            "click",
            event => {

                if(
                    event.target.id ===
                    "cartModal"
                ){

                    closeCart();

                }

            }
        );


    document
        .getElementById(
            "checkoutModal"
        )
        .addEventListener(
            "click",
            event => {

                if(
                    event.target.id ===
                    "checkoutModal"
                ){

                    closeCheckout();

                }

            }
        );

}


/* =========================================================
   UTILIDADES
========================================================= */

function formatPrice(price){

    return Number(
        price || 0
    ).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


function escapeAttribute(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


function escapeJS(value){

    return String(
        value ?? ""
    )
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}
