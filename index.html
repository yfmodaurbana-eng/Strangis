<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="Marcas & Moda - Tienda online de moda">

<title>Marcas & Moda</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#111;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111;
    color:#fff;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    min-height:68px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{font-weight:400}

.cart-btn{
    border:0;
    background:#fff;
    color:#111;
    border-radius:9px;
    padding:11px 15px;
    font-weight:800;
}

.hero{
    min-height:390px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;
    background:
        linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
        linear-gradient(135deg,#222,#777);
    color:#fff;
}

.hero-content{max-width:750px}

.hero h1{
    font-size:clamp(40px,7vw,76px);
    line-height:1;
    margin-bottom:18px;
    font-weight:900;
}

.hero p{
    font-size:18px;
    margin-bottom:25px;
}

.hero-btn{
    display:inline-block;
    background:#fff;
    color:#111;
    text-decoration:none;
    border-radius:8px;
    padding:14px 25px;
    font-weight:800;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:45px 18px 80px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:15px;
    margin-bottom:25px;
}

.section-head h2{
    font-size:30px;
}

.section-head p{
    color:#777;
    font-size:14px;
}

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.filter{
    border:1px solid #ddd;
    background:#fff;
    padding:9px 14px;
    border-radius:20px;
}

.filter.active{
    background:#111;
    color:#fff;
    border-color:#111;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product{
    border:1px solid #eee;
    border-radius:12px;
    overflow:hidden;
    background:#fff;
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.product-image{
    position:relative;
    background:#f4f4f4;
}

.product-image img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    display:block;
}

.product-info{padding:15px}

.category{
    color:#888;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:6px;
}

.product-name{
    font-weight:800;
    margin-bottom:6px;
}

.price{
    font-size:19px;
    font-weight:900;
    margin-bottom:12px;
}

.view-btn{
    width:100%;
    border:0;
    background:#111;
    color:#fff;
    padding:12px;
    border-radius:8px;
    font-weight:800;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:#777;
}

/* MODAL PRODUCTO */

.modal{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal.active{display:flex}

.product-modal{
    width:100%;
    max-width:1100px;
    max-height:94vh;
    overflow:auto;
    background:#fff;
    border-radius:18px 18px 0 0;
    padding:20px;
}

.close{
    display:block;
    margin-left:auto;
    border:0;
    background:#eee;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:22px;
    margin-bottom:15px;
}

.product-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.gallery-track{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    border-radius:12px;
}

.gallery-track::-webkit-scrollbar{display:none}

.slide{
    min-width:100%;
    scroll-snap-align:start;
}

.slide img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    display:block;
    border-radius:12px;
}

.dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:10px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ccc;
}

.dot.active{background:#111}

.details h2{
    font-size:32px;
    margin-bottom:7px;
}

.reference{
    color:#888;
    font-size:13px;
    margin-bottom:15px;
}

.details-price{
    font-size:27px;
    font-weight:900;
    margin-bottom:20px;
}

.description{
    color:#555;
    line-height:1.6;
    margin-bottom:22px;
}

.option-title{
    font-weight:800;
    margin-bottom:9px;
}

.options{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.option{
    border:1px solid #ccc;
    background:#fff;
    padding:10px 15px;
    border-radius:7px;
}

.option.selected{
    background:#111;
    color:#fff;
    border-color:#111;
}

.add-cart{
    width:100%;
    border:0;
    background:#111;
    color:#fff;
    padding:16px;
    border-radius:9px;
    font-weight:900;
}

/* CARRITO */

.cart-modal{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,0,0,.65);
    display:none;
}

.cart-modal.active{display:block}

.cart{
    margin-left:auto;
    width:100%;
    max-width:520px;
    height:100%;
    overflow:auto;
    background:#fff;
    padding:22px;
}

.cart-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.cart-head button{
    border:0;
    background:#eee;
    width:36px;
    height:36px;
    border-radius:50%;
}

.cart-item{
    display:flex;
    gap:12px;
    border-bottom:1px solid #eee;
    padding:15px 0;
}

.cart-item img{
    width:70px;
    height:90px;
    object-fit:cover;
    border-radius:7px;
}

.cart-item-info{flex:1}

.cart-item-name{
    font-weight:800;
    margin-bottom:5px;
}

.cart-meta{
    color:#777;
    font-size:12px;
    line-height:1.6;
}

.remove{
    border:0;
    background:#fee;
    color:#a00;
    width:30px;
    height:30px;
    border-radius:50%;
}

.total{
    font-size:23px;
    font-weight:900;
    margin:25px 0;
}

.checkout-btn{
    width:100%;
    border:0;
    background:#25d366;
    color:#fff;
    padding:15px;
    border-radius:9px;
    font-weight:900;
}

/* CHECKOUT */

.checkout-modal{
    position:fixed;
    inset:0;
    z-index:4000;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.checkout-modal.active{display:flex}

.checkout-box{
    background:#fff;
    width:100%;
    max-width:600px;
    max-height:95vh;
    overflow:auto;
    border-radius:15px;
    padding:22px;
}

.checkout-box h2{margin-bottom:20px}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:800;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.confirm{
    width:100%;
    border:0;
    background:#25d366;
    color:#fff;
    padding:15px;
    border-radius:8px;
    font-weight:900;
}

.back{
    width:100%;
    border:0;
    background:#eee;
    padding:13px;
    border-radius:8px;
    margin-top:8px;
}

.footer{
    background:#111;
    color:#fff;
    text-align:center;
    padding:35px 20px;
}

.footer strong{
    display:block;
    font-size:20px;
    margin-bottom:8px;
}

.footer p{
    color:#aaa;
    font-size:13px;
}

@media(max-width:950px){
    .products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:700px){
    .products{grid-template-columns:repeat(2,1fr);gap:10px}
    .product-layout{grid-template-columns:1fr}
    .hero{min-height:330px}
    .container{padding-top:30px}
    .section-head h2{font-size:24px}
    .details h2{font-size:26px}
}

@media(max-width:430px){
    .logo{font-size:19px}
    .cart-btn{padding:9px 11px}
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">Marcas <span>&</span> Moda</div>

        <button class="cart-btn" onclick="openCart()">
            🛒 Carrito (<span id="cartCount">0</span>)
        </button>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>Marcas & Moda</h1>
        <p>Descubre tu estilo. Descubre tu moda.</p>
        <a class="hero-btn" href="#catalogo">Ver colección</a>
    </div>
</section>

<main class="container" id="catalogo">

    <div class="section-head">
        <div>
            <h2>Nuestra colección</h2>
            <p>Moda seleccionada para tu estilo.</p>
        </div>
    </div>

    <div id="filters" class="filters"></div>

    <div id="products" class="products"></div>

</main>

<footer class="footer">
    <strong>Marcas & Moda</strong>
    <p>Moda, estilo y tendencias.</p>
</footer>


<!-- =====================================================
     MODAL PRODUCTO
===================================================== -->

<div id="productModal" class="modal">

    <div class="product-modal">

        <button class="close" onclick="closeProduct()">×</button>

        <div id="productContent" class="product-layout"></div>

    </div>

</div>


<!-- =====================================================
     CARRITO
===================================================== -->

<div id="cartModal" class="cart-modal">

    <div class="cart">

        <div class="cart-head">
            <h2>🛒 Tu carrito</h2>

            <button onclick="closeCart()">×</button>
        </div>

        <div id="cartItems"></div>

        <div id="cartTotal" class="total">
            Total: 0,00 €
        </div>

        <button class="checkout-btn" onclick="openCheckout()">
            Continuar con el pedido
        </button>

    </div>

</div>


<!-- =====================================================
     DATOS DE ENVÍO
===================================================== -->

<div id="checkoutModal" class="checkout-modal">

    <div class="checkout-box">

        <h2>📦 Datos de envío</h2>

        <div class="form-group">
            <label>Nombre y apellidos *</label>
            <input id="customerName" type="text">
        </div>

        <div class="form-group">
            <label>Teléfono *</label>
            <input id="customerPhone" type="tel">
        </div>

        <div class="form-group">
            <label>Dirección *</label>
            <input id="customerAddress" type="text">
        </div>

        <div class="form-group">
            <label>Código postal *</label>
            <input id="customerPostal" type="text">
        </div>

        <div class="form-group">
            <label>Ciudad *</label>
            <input id="customerCity" type="text">
        </div>

        <div class="form-group">
            <label>País</label>
            <input value="España" readonly>
        </div>

        <div class="form-group">
            <label>Observaciones</label>
            <textarea id="customerNotes"></textarea>
        </div>

        <button class="confirm" onclick="sendWhatsApp()">
            Confirmar pedido por WhatsApp
        </button>

        <button class="back" onclick="closeCheckout()">
            Volver
        </button>

    </div>

</div>


<script>

/* =========================================================
   🛍️ PRODUCTOS DE LA TIENDA
   =========================================================

   ⬇️⬇️⬇️ PEGA AQUÍ TODOS LOS PRODUCTOS GENERADOS
   DESDE admin.html ⬇️⬇️⬇️

   Puedes tener 1, 10, 50 o más productos.

   Cada producto va separado por una coma.

   ========================================================= */

const products = [

    // =====================================================
    // 👇 PRODUCTO 1 AQUÍ 👇
    // =====================================================
{
    id: "cvcv",
    name: "Cokito",
    reference: "CVCV",
    price: 3688,
    stock: 10,
    category: "Camisetas",
    sizes: ["S","M","L","XL"],
    colors: ["Negro"],
    description: "",
    images: [
    "https://i.imgur.com/SeHMqF2.jpeg"
]
},

    {
    id: "00023",
    name: "Camiseta gris Luis vuitoon",
    reference: "00023",
    price: 12,
    stock: 10,
    category: "Camisetas",
    sizes: ["S","M","L","XL"],
    colors: ["Gris","Blaca"],
    description: "",
    images: [
    "https://imgur.com/a/oZ6tsGL",
    "https://imgur.com/a/zsPu7Y5"
]
},
    
    // =====================================================
    // 👆 FIN PRODUCTO 1 👆
    // =====================================================


    // =====================================================
    // 👇 PRODUCTO 2 AQUÍ 👇
    // =====================================================


    // =====================================================
    // 👆 FIN PRODUCTO 2 👆
    // =====================================================


    // =====================================================
    // 👇 PRODUCTO 3 AQUÍ 👇
    // =====================================================


    // =====================================================
    // 👆 FIN PRODUCTO 3 👆
    // =====================================================

];


/* =========================================================
   CONFIGURACIÓN WHATSAPP
========================================================= */

const WHATSAPP_NUMBER = "34674559614";


let cart = [];
let currentProduct = null;
let selectedSize = "";
let selectedColor = "";
let currentCategory = "Todos";


/* =========================================================
   PRODUCTOS
========================================================= */

function renderProducts(){

    const container = document.getElementById("products");

    let filtered = products;

    if(currentCategory !== "Todos"){
        filtered = products.filter(
            p => p.category === currentCategory
        );
    }

    if(!filtered.length){

        container.innerHTML = `
            <div class="empty">
                <h3>No hay productos todavía</h3>
                <p>Añade productos desde tu panel de administración.</p>
            </div>
        `;

        return;
    }

    container.innerHTML = filtered.map(product => `

        <article class="product">

            <div class="product-image">
                <img
                    src="${escapeAttribute(product.images?.[0] || "")}"
                    alt="${escapeHTML(product.name)}"
                >
            </div>

            <div class="product-info">

                <div class="category">
                    ${escapeHTML(product.category || "Moda")}
                </div>

                <div class="product-name">
                    ${escapeHTML(product.name)}
                </div>

                <div class="price">
                    ${formatPrice(product.price)}
                </div>

                <button
                    class="view-btn"
                    onclick="openProduct('${escapeJS(product.id)}')"
                >
                    Ver producto
                </button>

            </div>

        </article>

    `).join("");
}


/* =========================================================
   FILTROS
========================================================= */

function renderFilters(){

    const box = document.getElementById("filters");

    const categories = [
        "Todos",
        ...new Set(
            products
                .map(p => p.category)
                .filter(Boolean)
        )
    ];

    box.innerHTML = categories.map(category => `

        <button
            class="filter ${currentCategory === category ? "active" : ""}"
            onclick="selectCategory('${escapeJS(category)}')"
        >
            ${escapeHTML(category)}
        </button>

    `).join("");
}


function selectCategory(category){

    currentCategory = category;

    renderFilters();
    renderProducts();
}


/* =========================================================
   PRODUCTO
========================================================= */

function openProduct(id){

    currentProduct = products.find(
        p => String(p.id) === String(id)
    );

    if(!currentProduct) return;

    selectedSize = currentProduct.sizes?.[0] || "";
    selectedColor = currentProduct.colors?.[0] || "";

    renderProduct();

    document
        .getElementById("productModal")
        .classList.add("active");
}


function closeProduct(){

    document
        .getElementById("productModal")
        .classList.remove("active");
}


function renderProduct(){

    const p = currentProduct;

    const images = p.images || [];

    document.getElementById("productContent").innerHTML = `

        <div>

            <div
                id="galleryTrack"
                class="gallery-track"
            >

                ${images.map(image => `

                    <div class="slide">

                        <img
                            src="${escapeAttribute(image)}"
                            alt="${escapeHTML(p.name)}"
                        >

                    </div>

                `).join("")}

            </div>

            <div class="dots">

                ${images.map((_,i) => `

                    <span
                        class="dot ${i === 0 ? "active" : ""}"
                    ></span>

                `).join("")}

            </div>

        </div>


        <div class="details">

            <h2>${escapeHTML(p.name)}</h2>

            <div class="reference">
                Ref: ${escapeHTML(p.reference || "")}
            </div>

            <div class="details-price">
                ${formatPrice(p.price)}
            </div>

            <div class="description">
                ${escapeHTML(p.description || "")}
            </div>


            ${
                p.sizes?.length
                ? `
                    <div class="option-title">Talla</div>

                    <div class="options">

                        ${p.sizes.map(size => `

                            <button
                                class="option ${selectedSize === size ? "selected" : ""}"
                                onclick="selectSize('${escapeJS(size)}')"
                            >
                                ${escapeHTML(size)}
                            </button>

                        `).join("")}

                    </div>
                `
                : ""
            }


            ${
                p.colors?.length
                ? `
                    <div class="option-title">Color</div>

                    <div class="options">

                        ${p.colors.map(color => `

                            <button
                                class="option ${selectedColor === color ? "selected" : ""}"
                                onclick="selectColor('${escapeJS(color)}')"
                            >
                                ${escapeHTML(color)}
                            </button>

                        `).join("")}

                    </div>
                `
                : ""
            }


            <button
                class="add-cart"
                onclick="addToCart()"
            >
                🛒 Añadir al carrito
            </button>

        </div>

    `;

    setupGallery();
}


function setupGallery(){

    const track = document.getElementById("galleryTrack");

    if(!track) return;

    const dots = document.querySelectorAll(".dot");

    track.addEventListener("scroll", () => {

        const index = Math.round(
            track.scrollLeft / track.clientWidth
        );

        dots.forEach((dot,i) => {
            dot.classList.toggle("active",i === index);
        });

    });
}


function selectSize(size){

    selectedSize = size;

    renderProduct();
}


function selectColor(color){

    selectedColor = color;

    renderProduct();
}


/* =========================================================
   CARRITO
========================================================= */

function addToCart(){

    const existing = cart.find(item =>
        item.id === currentProduct.id &&
        item.size === selectedSize &&
        item.color === selectedColor
    );

    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            id:currentProduct.id,
            name:currentProduct.name,
            reference:currentProduct.reference,
            price:Number(currentProduct.price),
            image:currentProduct.images?.[0] || "",
            size:selectedSize,
            color:selectedColor,
            quantity:1

        });

    }

    updateCartCount();
    closeProduct();

    alert("Producto añadido al carrito.");
}


function updateCartCount(){

    const count = cart.reduce(
        (sum,item) => sum + item.quantity,
        0
    );

    document.getElementById("cartCount").textContent = count;
}


function openCart(){

    renderCart();

    document
        .getElementById("cartModal")
        .classList.add("active");
}


function closeCart(){

    document
        .getElementById("cartModal")
        .classList.remove("active");
}


function renderCart(){

    const box = document.getElementById("cartItems");

    if(!cart.length){

        box.innerHTML = `
            <p style="color:#777">
                Tu carrito está vacío.
            </p>
        `;

        document.getElementById("cartTotal").textContent =
            "Total: 0,00 €";

        return;
    }

    box.innerHTML = cart.map((item,index) => `

        <div class="cart-item">

            <img
                src="${escapeAttribute(item.image)}"
                alt=""
            >

            <div class="cart-item-info">

                <div class="cart-item-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="cart-meta">

                    Ref: ${escapeHTML(item.reference)}

                    ${
                        item.size
                        ? `<br>Talla: ${escapeHTML(item.size)}`
                        : ""
                    }

                    ${
                        item.color
                        ? `<br>Color: ${escapeHTML(item.color)}`
                        : ""
                    }

                    <br>
                    Cantidad: ${item.quantity}

                </div>

                <strong>
                    ${formatPrice(item.price * item.quantity)}
                </strong>

            </div>

            <button
                class="remove"
                onclick="removeItem(${index})"
            >
                ×
            </button>

        </div>

    `).join("");

    const total = cart.reduce(
        (sum,item) =>
            sum + item.price * item.quantity,
        0
    );

    document.getElementById("cartTotal").textContent =
        "Total: " + formatPrice(total);
}


function removeItem(index){

    cart.splice(index,1);

    updateCartCount();
    renderCart();
}


/* =========================================================
   CHECKOUT
========================================================= */

function openCheckout(){

    if(!cart.length){

        alert("Tu carrito está vacío.");

        return;
    }

    closeCart();

    document
        .getElementById("checkoutModal")
        .classList.add("active");
}


function closeCheckout(){

    document
        .getElementById("checkoutModal")
        .classList.remove("active");
}


/* =========================================================
   WHATSAPP
========================================================= */

function sendWhatsApp(){

    const name =
        document.getElementById("customerName").value.trim();

    const phone =
        document.getElementById("customerPhone").value.trim();

    const address =
        document.getElementById("customerAddress").value.trim();

    const postal =
        document.getElementById("customerPostal").value.trim();

    const city =
        document.getElementById("customerCity").value.trim();

    const notes =
        document.getElementById("customerNotes").value.trim();


    if(!name || !phone || !address || !postal || !city){

        alert(
            "Completa todos los campos obligatorios."
        );

        return;
    }


    let message =
        "🛍️ *NUEVO PEDIDO - MARCAS & MODA*%0A%0A";


    message +=
        "👤 *DATOS DEL CLIENTE*%0A";

    message +=
        "Nombre: " +
        encodeURIComponent(name) +
        "%0A";

    message +=
        "Teléfono: " +
        encodeURIComponent(phone) +
        "%0A";

    message +=
        "Dirección: " +
        encodeURIComponent(address) +
        "%0A";

    message +=
        "Código postal: " +
        encodeURIComponent(postal) +
        "%0A";

    message +=
        "Ciudad: " +
        encodeURIComponent(city) +
        "%0A";

    message +=
        "País: España%0A";


    if(notes){

        message +=
            "Observaciones: " +
            encodeURIComponent(notes) +
            "%0A";

    }


    message += "%0A🛒 *PRODUCTOS*%0A";


    cart.forEach((item,index) => {

        message +=
            "%0A" +
            (index + 1) +
            ". " +
            encodeURIComponent(item.name) +
            "%0A";

        message +=
            "Referencia: " +
            encodeURIComponent(item.reference) +
            "%0A";

        if(item.size){

            message +=
                "Talla: " +
                encodeURIComponent(item.size) +
                "%0A";
        }

        if(item.color){

            message +=
                "Color: " +
                encodeURIComponent(item.color) +
                "%0A";
        }

        message +=
            "Cantidad: " +
            item.quantity +
            "%0A";

        message +=
            "Precio: " +
            encodeURIComponent(
                formatPrice(
                    item.price * item.quantity
                )
            ) +
            "%0A";
    });


    const total = cart.reduce(
        (sum,item) =>
            sum + item.price * item.quantity,
        0
    );


    message +=
        "%0A💰 *TOTAL: " +
        encodeURIComponent(
            formatPrice(total)
        ) +
        "*";


    const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        message;


    window.open(url,"_blank");
}


/* =========================================================
   UTILIDADES
========================================================= */

function formatPrice(price){

    return Number(price).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );
}


function escapeHTML(value){

    const div = document.createElement("div");

    div.textContent = value ?? "";

    return div.innerHTML;
}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* =========================================================
   INICIO
========================================================= */

renderFilters();
renderProducts();

</script>
