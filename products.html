<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>STRANGIS — Productos</title>

    <meta
        name="description"
        content="Gestión de productos STRANGIS"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        body {
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            background: #111;
            color: #fff;
            padding: 24px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #ccc;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 700;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d5d5d5;
            border-radius: 9px;
            padding: 12px;
            font-size: 15px;
            background: #fff;
            color: #111;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #111;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: #111;
            color: #fff;
        }

        .btn-secondary {
            background: #e9e9e9;
            color: #111;
        }

        .variants,
        .sizes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .variant {
            display: grid;
            grid-template-columns:
                1fr 2fr auto;
            gap: 10px;
            align-items: end;
        }

        .size-row {
            display: flex;
            gap: 10px;
        }

        .size-row input {
            flex: 1;
        }

        .products-list {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(240px, 1fr)
                );
            gap: 16px;
        }

        .product {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 16px;
            background: #fff;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: #eee;
            margin-bottom: 12px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product h3 {
            margin: 0 0 8px;
        }

        .product p {
            margin: 5px 0;
            color: #555;
        }

        .status {
            padding: 12px;
            border-radius: 9px;
            background: #f0f0f0;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .variant {
                grid-template-columns: 1fr;
            }

            .size-row {
                flex-direction: column;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">

        <h1>STRANGIS</h1>

        <p>
            Gestión de productos
        </p>

    </header>


    <!-- =================================================
         ESTADO
    ================================================== -->

    <section class="card">

        <div
            id="productsStatus"
            class="status"
        >
            Cargando productos...
        </div>

        <div class="actions">

            <button
                type="button"
                class="btn-secondary"
                id="refreshProductsButton"
            >
                Actualizar productos
            </button>

        </div>

    </section>


    <!-- =================================================
         FORMULARIO
    ================================================== -->

    <section class="card">

        <h2>
            Añadir producto
        </h2>


        <form
            id="productForm"
            autocomplete="off"
        >

            <div class="grid">


                <!-- NOMBRE -->

                <div class="field">

                    <label for="productName">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        id="productName"
                        name="productName"
                        placeholder="Ej. Camiseta Strangis"
                        required
                    >

                </div>


                <!-- REFERENCIA -->

                <div class="field">

                    <label for="productRef">
                        Referencia / ID
                    </label>

                    <input
                        type="text"
                        id="productRef"
                        name="productRef"
                        placeholder="Ej. CAM-001"
                        required
                    >

                </div>


                <!-- PRECIO -->

                <div class="field">

                    <label for="productPrice">
                        Precio (€)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        name="productPrice"
                        min="0"
                        step="0.01"
                        placeholder="29.99"
                        required
                    >

                </div>


                <!-- STOCK -->

                <div class="field">

                    <label for="productStock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        name="productStock"
                        min="0"
                        step="1"
                        placeholder="10"
                        required
                    >

                </div>


                <!-- CATEGORÍA -->

                <div class="field">

                    <label for="productCategory">
                        Categoría
                    </label>

                    <select
                        id="productCategory"
                        name="productCategory"
                    >

                        <option value="camisetas">
                            Camisetas
                        </option>

                        <option value="pantalones">
                            Pantalones
                        </option>

                        <option value="conjuntos">
                            Conjuntos
                        </option>

                        <option value="gorras">
                            Gorras
                        </option>

                        <option value="gafas">
                            Gafas
                        </option>

                        <option value="bisuteria">
                            Bisutería
                        </option>

                    </select>

                </div>


                <!-- WHATSAPP -->

                <div class="field">

                    <label for="productWhatsapp">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="productWhatsapp"
                        name="productWhatsapp"
                        placeholder="34600000000"
                    >

                </div>


                <!-- ENVÍO MÍNIMO -->

                <div class="field">

                    <label for="shippingMin">
                        Envío mínimo (€)
                    </label>

                    <input
                        type="number"
                        id="shippingMin"
                        name="shippingMin"
                        min="0"
                        step="0.01"
                        value="3"
                    >

                </div>


                <!-- ENVÍO MÁXIMO -->

                <div class="field">

                    <label for="shippingMax">
                        Envío máximo (€)
                    </label>

                    <input
                        type="number"
                        id="shippingMax"
                        name="shippingMax"
                        min="0"
                        step="0.01"
                        value="9"
                    >

                </div>


                <!-- DESCRIPCIÓN -->

                <div class="field full">

                    <label for="productDescription">
                        Descripción
                    </label>

                    <textarea
                        id="productDescription"
                        name="productDescription"
                        placeholder="Descripción del producto..."
                    ></textarea>

                </div>


                <!-- VARIANTES -->

                <div class="field full">

                    <label>
                        Colores / variantes
                    </label>

                    <div
                        id="variantsContainer"
                        class="variants"
                    ></div>

                    <button
                        type="button"
                        class="btn-secondary"
                        id="addVariantButton"
                    >
                        + Añadir color
                    </button>

                </div>


                <!-- TALLAS -->

                <div class="field full">

                    <label>
                        Tallas
                    </label>

                    <div
                        id="sizesContainer"
                        class="sizes"
                    ></div>

                    <button
                        type="button"
                        class="btn-secondary"
                        id="addSizeButton"
                    >
                        + Añadir talla
                    </button>

                </div>

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Guardar producto
                </button>

                <button
                    type="reset"
                    class="btn-secondary"
                >
                    Limpiar
                </button>

            </div>

        </form>

    </section>


    <!-- =================================================
         PRODUCTOS
    ================================================== -->

    <section class="card">

        <h2>
            Productos cargados
        </h2>

        <div
            id="productsList"
            class="products-list"
        >

            <div class="empty">
                Cargando productos...
            </div>

        </div>

    </section>

</div>


<!-- =====================================================
     VARIABLES GLOBALES DEL FORMULARIO
===================================================== -->

<script>

    window.variants = [];

    window.sizes = [];

</script>


<!-- =====================================================
     PRODUCTS.JS
===================================================== -->

<script src="./products.js"></script>


<!-- =====================================================
     CONTROL DE LA PÁGINA
===================================================== -->

<script>

(function () {

    "use strict";


    /*
     * ELEMENTOS
     */

    const form =
        document.getElementById(
            "productForm"
        );

    const variantsContainer =
        document.getElementById(
            "variantsContainer"
        );

    const sizesContainer =
        document.getElementById(
            "sizesContainer"
        );

    const productsList =
        document.getElementById(
            "productsList"
        );

    const productsStatus =
        document.getElementById(
            "productsStatus"
        );

    const addVariantButton =
        document.getElementById(
            "addVariantButton"
        );

    const addSizeButton =
        document.getElementById(
            "addSizeButton"
        );

    const refreshButton =
        document.getElementById(
            "refreshProductsButton"
        );


    /*
     * ESCAPAR HTML
     */

    function escapeHTML(value) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /*
     * RENDERIZAR VARIANTES
     */

    function renderVariants() {

        variantsContainer.innerHTML = "";


        window.variants.forEach(
            function (variant, index) {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "variant";


                row.innerHTML = `

                    <div class="field">

                        <label>
                            Color
                        </label>

                        <input
                            type="text"
                            value="${escapeHTML(
                                variant.name
                            )}"
                            placeholder="Ej. Negro"
                            data-variant-name="${index}"
                        >

                    </div>


                    <div class="field">

                        <label>
                            URL de imagen
                        </label>

                        <input
                            type="url"
                            value="${escapeHTML(
                                variant.image
                            )}"
                            placeholder="https://..."
                            data-variant-image="${index}"
                        >

                    </div>


                    <button
                        type="button"
                        class="btn-secondary"
                        data-remove-variant="${index}"
                    >
                        Eliminar
                    </button>

                `;


                variantsContainer.appendChild(
                    row
                );

            }
        );

    }


    /*
     * AÑADIR VARIANTE
     */

    addVariantButton.addEventListener(
        "click",
        function () {

            window.variants.push({

                name: "",

                image: ""

            });


            renderVariants();

        }
    );


    /*
     * CAMBIOS EN VARIANTES
     */

    variantsContainer.addEventListener(
        "input",
        function (event) {

            const target =
                event.target;


            const nameIndex =
                target.dataset.variantName;


            const imageIndex =
                target.dataset.variantImage;


            if (
                nameIndex !==
                undefined
            ) {

                window.variants[
                    Number(nameIndex)
                ].name =
                    target.value;

            }


            if (
                imageIndex !==
                undefined
            ) {

                window.variants[
                    Number(imageIndex)
                ].image =
                    target.value;

            }

        }
    );


    /*
     * ELIMINAR VARIANTE
     */

    variantsContainer.addEventListener(
        "click",
        function (event) {

            const button =
                event.target.closest(
                    "[data-remove-variant]"
                );


            if (!button) {

                return;

            }


            const index =
                Number(
                    button.dataset.removeVariant
                );


            window.variants.splice(
                index,
                1
            );


            renderVariants();

        }
    );


    /*
     * RENDERIZAR TALLAS
     */

    function renderSizes() {

        sizesContainer.innerHTML = "";


        window.sizes.forEach(
            function (size, index) {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "size-row";


                row.innerHTML = `

                    <input
                        type="text"
                        value="${escapeHTML(size)}"
                        placeholder="Ej. M"
                        data-size="${index}"
                    >

                    <button
                        type="button"
                        class="btn-secondary"
                        data-remove-size="${index}"
                    >
                        Eliminar
                    </button>

                `;


                sizesContainer.appendChild(
                    row
                );

            }
        );

    }


    /*
     * AÑADIR TALLA
     */

    addSizeButton.addEventListener(
        "click",
        function () {

            window.sizes.push("");

            renderSizes();

        }
    );


    /*
     * CAMBIAR TALLA
     */

    sizesContainer.addEventListener(
        "input",
        function (event) {

            const target =
                event.target;


            const index =
                target.dataset.size;


            if (
                index ===
                undefined
            ) {

                return;

            }


            window.sizes[
                Number(index)
            ] =
                target.value;

        }
    );


    /*
     * ELIMINAR TALLA
     */

    sizesContainer.addEventListener(
        "click",
        function (event) {

            const button =
                event.target.closest(
                    "[data-remove-size]"
                );


            if (!button) {

                return;

            }


            const index =
                Number(
                    button.dataset.removeSize
                );


            window.sizes.splice(
                index,
                1
            );


            renderSizes();

        }
    );


    /*
     * RENDERIZAR PRODUCTOS
     */

    function renderProducts() {

        const products =
            typeof getProducts ===
            "function"
                ? getProducts()
                : [];


        if (!products.length) {

            productsList.innerHTML = `

                <div class="empty">

                    No hay productos cargados.

                </div>

            `;

            productsStatus.textContent =
                "0 productos cargados.";

            return;

        }


        productsStatus.textContent =
            `${products.length} producto(s) cargado(s).`;


        productsList.innerHTML =
            products
                .map(
                    function (product) {

                        const image =
                            typeof getProductImage ===
                            "function"
                                ? getProductImage(
                                    product
                                )
                                : "";


                        return `

                            <article class="product">

                                <div class="product-image">

                                    ${
                                        image
                                            ? `
                                                <img
                                                    src="${escapeHTML(image)}"
                                                    alt="${escapeHTML(product.name)}"
                                                    loading="lazy"
                                                >
                                              `
                                            : ""
                                    }

                                </div>

                                <h3>
                                    ${escapeHTML(
                                        product.name
                                    )}
                                </h3>

                                <p>
                                    Ref:
                                    ${escapeHTML(
                                        product.ref
                                    )}
                                </p>

                                <p>
                                    Categoría:
                                    ${escapeHTML(
                                        getCategoryName(
                                            product.category
                                        )
                                    )}
                                </p>

                                <p>
                                    Precio:
                                    ${Number(
                                        product.price
                                    ).toFixed(2)}
                                    €
                                </p>

                                <p>
                                    Stock:
                                    ${Number(
                                        product.stock
                                    )}
                                </p>

                            </article>

                        `;

                    }
                )
                .join("");

    }


    /*
     * CARGAR PRODUCTOS
     */

    async function loadPageProducts() {

        productsStatus.textContent =
            "Cargando productos...";


        try {

            await initStrangisProducts();

            renderProducts();

        }
        catch (error) {

            console.error(
                error
            );

            productsStatus.textContent =
                "No se pudieron cargar los productos.";

        }

    }


    /*
     * GUARDAR PRODUCTO
     */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const result =
                await saveProductToSupabase();


            if (!result) {

                return;

            }


            renderProducts();

            form.reset();

            window.variants = [];

            window.sizes = [];

            renderVariants();

            renderSizes();

        }
    );


    /*
     * ACTUALIZAR
     */

    refreshButton.addEventListener(
        "click",
        async function () {

            productsStatus.textContent =
                "Actualizando...";


            try {

                await refreshProducts();

                renderProducts();

            }
            catch (error) {

                console.error(
                    error
                );

                productsStatus.textContent =
                    "Error al actualizar.";

            }

        }
    );


    /*
     * ESTADO INICIAL
     */

    renderVariants();

    renderSizes();

    loadPageProducts();

})();

</script>

</body>
</html>
