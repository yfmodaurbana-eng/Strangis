<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gafas | MI MARCA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #151515 0%,
            #292929 38%,
            #4d4d4d 65%,
            #222 100%
        );
}

button,
input,
textarea{
    font:inherit;
}

/* =====================================================
   CABECERA
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:18px 5%;

    display:flex;
    align-items:center;
    gap:30px;

    border-bottom:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(20,20,20,.92);

    backdrop-filter:blur(18px);
}

.logo{
    flex-shrink:0;

    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

nav{
    flex:1;

    display:flex;
    justify-content:center;
    gap:28px;

    overflow-x:auto;

    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#999;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;
    letter-spacing:1.5px;

    text-transform:uppercase;
    white-space:nowrap;

    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    width:min(1400px,90%);

    margin:auto;

    padding:
        clamp(65px,9vw,110px)
        0
        clamp(45px,6vw,75px);
}

.hero small{
    color:#aaa;

    font-size:11px;
    font-weight:bold;
    letter-spacing:5px;
}

.hero h1{
    margin-top:18px;

    font-size:
        clamp(
            58px,
            10vw,
            125px
        );

    letter-spacing:-7px;
    line-height:.85;
}

.hero p{
    max-width:600px;

    margin-top:28px;

    color:#aaa;

    font-size:15px;
    line-height:1.7;
}

/* =====================================================
   PRODUCTOS
===================================================== */

.products-section{
    width:min(1400px,90%);

    margin:auto;

    padding:
        10px
        0
        100px;
}

.products{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:20px;
}

.product{
    min-width:0;

    overflow:hidden;

    padding:16px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.15);

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.product:hover{
    transform:translateY(-4px);

    border-color:
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.075);
}

/* =====================================================
   IMAGEN
===================================================== */

.product-image{
    height:390px;

    margin:
        -16px
        -16px
        20px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#171717;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.04);

    transition:
        transform .4s ease,
        opacity .2s ease;
}

.product:hover
.product-image img{
    transform:scale(1.09);
}

/* =====================================================
   INFORMACIÓN
===================================================== */

.product-name{
    font-size:16px;
    font-weight:800;

    line-height:1.35;
}

.product-code{
    margin-top:7px;

    color:#777;

    font-size:10px;
    letter-spacing:1.2px;
}

.product-description{
    margin-top:10px;

    color:#999;

    font-size:12px;
    line-height:1.55;
}

.product-price{
    margin-top:14px;

    font-size:17px;
    font-weight:800;
}

   ETIQUET
