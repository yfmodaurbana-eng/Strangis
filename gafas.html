<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gorras | Strangis</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #151515 0%,
            #292929 38%,
            #4d4d4d 65%,
            #222 100%
        );
}

button,
input,
textarea{
    font:inherit;
}


/* =====================================================
   CABECERA
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:18px 5%;

    display:flex;
    align-items:center;
    gap:30px;

    border-bottom:1px solid rgba(255,255,255,.12);

    background:rgba(20,20,20,.92);

    backdrop-filter:blur(18px);
}

.logo{
    flex-shrink:0;

    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

nav{
    flex:1;

    display:flex;
    justify-content:center;
    gap:28px;

    overflow-x:auto;

    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#999;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;

    letter-spacing:1.5px;
    text-transform:uppercase;

    white-space:nowrap;

    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    width:min(1400px,90%);

    margin:auto;

    padding:
        clamp(65px,9vw,110px)
        0
        clamp(45px,6vw,75px);
}

.hero small{
    color:#aaa;

    font-size:11px;
    font-weight:bold;

    letter-spacing:5px;
}

.hero h1{
    margin-top:18px;

    font-size:clamp(58px,10vw,125px);

    letter-spacing:-7px;
    line-height:.85;
}

.hero p{
    max-width:600px;

    margin-top:28px;

    color:#aaa;

    font-size:15px;
    line-height:1.7;
}


/* =====================================================
   PRODUCTOS
===================================================== */

.products-section{
    width:min(1400px,90%);

    margin:auto;

    padding:
        10px
        0
        100px;
}

.products{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:20px;
}

.product{
    min-width:0;

    overflow:hidden;

    padding:16px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:12px;

    background:rgba(255,255,255,.055);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.15);

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.product:hover{
    transform:translateY(-4px);

    border-color:rgba(255,255,255,.25);

    background:rgba(255,255,255,.075);
}


/* =====================================================
   GALERÍA
===================================================== */

.product-image{
    position:relative;

    height:390px;

    margin:
        -16px
        -16px
        20px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#171717;

    touch-action:pan-y;

    cursor:zoom-in;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.04);

    user-select:none;
    -webkit-user-drag:none;

    transition:
        transform .35s ease,
        opacity .2s ease;
}

.product-image:hover img{
    transform:scale(1.09);
}

.product-image.zoomed{
    cursor:zoom-out;
}

.product-image.zoomed img{
    transform:scale(1.8);
}


/* INDICADORES */

.image-counter{
    position:absolute;

    right:12px;
    bottom:12px;

    z-index:5;

    padding:6px 9px;

    border-radius:20px;

    background:rgba(0,0,0,.65);

    color:#fff;

    font-size:10px;
    font-weight:bold;

    pointer-events:none;
}

.image-arrow{
    position:absolute;

    top:50%;

    z-index:5;

    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.25);

    border-radius:50%;

    background:rgba(0,0,0,.55);

    color:#fff;

    cursor:pointer;

    transform:translateY(-50%);

    opacity:.8;

    transition:.2s;
}

.image-arrow:hover{
    background:rgba(0,0,0,.85);

    opacity:1;
}

.image-arrow.left{
    left:10px;
}

.image-arrow.right{
    right:10px;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.product-name{
    font-size:16px;
    font-weight:800;

    line-height:1.35;
}

.product-code{
    margin-top:7px;

    color:#777;

    font-size:10px;

    letter-spacing:1.2px;
}

.product-description{
    margin-top:10px;

    color:#999;

    font-size:12px;
    line-height:1.55;
}

.product-price{
    margin-top:14px;

    font-size:17px;
    font-weight:800;
}


/* =====================================================
   ETIQUETAS
===================================================== */

.label{
    margin-top:18px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:1.2px;
}

.label span{
    color:#fff;
}


/* =====================================================
   COLORES
===================================================== */

.colors{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:11px;
}

.color{
    width:42px;
    height:42px;

    flex:0 0 42px;

    border:2px solid rgba(255,255,255,.25);

    border-radius:50%;

    cursor:pointer;

    background-color:#222;

    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;

    transition:
        transform .2s ease,
        border-color .2s ease;
}

.color:hover{
    transform:scale(1.08);

    border-color:#fff;
}

.color.active{
    outline:2px solid #fff;

    outline-offset:3px;
}


/* =====================================================
   TALLAS
===================================================== */

.sizes{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:11px;
}

.size{
    min-width:43px;

    padding:9px 12px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:5px;

    color:#bbb;

    background:transparent;

    cursor:pointer;

    font-size:11px;
    font-weight:bold;

    transition:.2s;
}

.size:hover{
    border-color:#fff;
}

.size.active{
    background:#fff;

    color:#111;

    border-color:#fff;
}


/* =====================================================
   CANTIDAD
===================================================== */

.quantity{
    display:flex;

    align-items:center;

    gap:14px;

    margin-top:18px;
}

.quantity button{
    width:36px;
    height:36px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:5px;

    background:#181818;

    color:#fff;

    cursor:pointer;

    font-size:18px;
}

.quantity button:hover{
    background:#333;
}

.quantity span{
    min-width:25px;

    text-align:center;

    font-size:14px;
    font-weight:bold;
}


/* =====================================================
   ENVÍO
===================================================== */

.shipping{
    margin-top:17px;

    padding:10px 12px;

    border:1px solid rgba(255,180,70,.35);

    border-radius:6px;

    background:rgba(255,160,40,.08);

    color:#e4b66e;

    font-size:11px;
    font-weight:bold;
}


/* =====================================================
   STOCK
===================================================== */

.stock{
    margin-top:8px;

    color:#777;

    font-size:10px;
}


/* =====================================================
   COMPRAR
===================================================== */

.buy{
    width:100%;

    margin-top:18px;

    padding:16px;

    border:0;

    border-radius:6px;

    background:#fff;

    color:#111;

    font-size:11px;
    font-weight:900;

    letter-spacing:1.5px;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.buy:hover{
    background:#ddd;

    transform:translateY(-1px);
}

.buy:active{
    transform:scale(.98);
}


/* =====================================================
   SIN PRODUCTOS
===================================================== */

.empty{
    grid-column:1 / -1;

    padding:100px 20px;

    text-align:center;

    color:#888;

    font-size:14px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:35px 5%;

    border-top:1px solid rgba(255,255,255,.1);

    text-align:center;

    color:#777;

    font-size:10px;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);

    max-height:calc(100vh - 40px);

    overflow-y:auto;

    padding:30px;

    border:1px solid rgba(255,255,255,.16);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #222,
            #111
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
}

.modal-header{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.modal-header small{
    color:#999;

    font-size:10px;
    font-weight:bold;

    letter-spacing:3px;
}

.modal-header h2{
    margin-top:8px;

    font-size:28px;

    letter-spacing:-1px;
}

.close-modal{
    flex:0 0 auto;

    width:40px;
    height:40px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:6px;

    background:#222;

    color:#fff;

    cursor:pointer;

    font-size:20px;
}

.close-modal:hover{
    background:#333;
}


/* =====================================================
   RESUMEN
===================================================== */

.order-summary{
    margin-bottom:25px;

    padding:16px;

    border:1px solid rgba(255,255,255,.10);

    border-radius:8px;

    background:rgba(255,255,255,.045);

    color:#aaa;

    font-size:12px;

    line-height:1.7;
}

.order-summary strong{
    color:#fff;
}


/* =====================================================
   FORMULARIO
===================================================== */

.form-title{
    margin:25px 0 15px;

    color:#fff;

    font-size:13px;
    font-weight:900;

    letter-spacing:1.5px;
}

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;
}

.form-field{
    margin-bottom:14px;
}

.form-field.full{
    grid-column:1 / -1;
}

.form-field label{
    display:block;

    margin-bottom:7px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    letter-spacing:1px;

    text-transform:uppercase;
}

.form-field input,
.form-field textarea{
    width:100%;

    padding:14px;

    border:1px solid rgba(255,255,255,.16);

    border-radius:6px;

    outline:none;

    background:rgba(0,0,0,.35);

    color:#fff;

    font-size:14px;
}

.form-field input{
    min-height:48px;
}

.form-field textarea{
    min-height:100px;

    resize:vertical;
}

.form-field input:focus,
.form-field textarea:focus{
    border-color:#fff;

    background:rgba(0,0,0,.5);
}

.form-field input::placeholder,
.form-field textarea::placeholder{
    color:#666;
}


/* =====================================================
   BOTONES MODAL
===================================================== */

.send-order{
    width:100%;

    margin-top:12px;

    padding:17px;

    border:0;

    border-radius:7px;

    background:#fff;

    color:#111;

    cursor:pointer;

    font-size:12px;
    font-weight:900;

    letter-spacing:1.2px;
}

.cancel-order{
    width:100%;

    margin-top:10px;

    padding:13px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:6px;

    background:transparent;

    color:#aaa;

    cursor:pointer;

    font-size:10px;
    font-weight:bold;
}


/* =====================================================
   ERROR
===================================================== */

.form-error{
    display:none;

    margin-bottom:15px;

    padding:12px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:6px;

    background:rgba(255,255,255,.06);

    color:#fff;

    font-size:11px;

    line-height:1.5;
}

.form-error.show{
    display:block;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1100px){

    .products{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .product-image{
        height:330px;
    }

}


/* =====================================================
   TABLET PEQUEÑA
===================================================== */

@media(max-width:850px){

    .products{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .hero,
    .products-section{
        width:92%;
    }

}


/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:600px){

    header{
        padding:15px;

        flex-wrap:wrap;

        gap:14px;
    }

    .logo{
        font-size:17px;

        letter-spacing:2.5px;
    }

    nav{
        order:3;

        flex-basis:100%;

        justify-content:flex-start;

        gap:22px;
    }

    nav a{
        font-size:10px;
    }

    .hero{
        width:94%;

        padding:
            50px 0
            38px;
    }

    .hero small{
        font-size:9px;

        letter-spacing:3px;
    }

    .hero h1{
        margin-top:15px;

        font-size:clamp(48px,16vw,76px);

        letter-spacing:-5px;
    }

    .hero p{
        margin-top:22px;

        font-size:13px;
    }

    .products-section{
        width:94%;

        padding-bottom:70px;
    }

    .products{
        grid-template-columns:1fr;

        gap:16px;
    }

    .product{
        padding:12px;

        border-radius:10px;
    }

    .product-image{
        height:390px;

        margin:
            -12px
            -12px
            15px;
    }

    .product-name{
        font-size:14px;
    }

    .product-code{
        font-size:9px;
    }

    .product-description{
        font-size:11px;
    }

    .product-price{
        font-size:15px;
    }

    .color{
        width:38px;
        height:38px;

        flex-basis:38px;
    }

    .shipping{
        font-size:10px;

        padding:10px;
    }

    .buy{
        padding:15px;

        font-size:10px;
    }

    .image-arrow{
        width:36px;
        height:36px;
    }

    .modal{
        padding:0;

        align-items:flex-end;
    }

    .modal-box{
        width:100%;

        max-height:96vh;

        padding:
            22px
            17px
            25px;

        border-radius:
            18px
            18px
            0
            0;
    }

    .modal-header h2{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;

        gap:0;
    }

    .form-field.full{
        grid-column:auto;
    }

    .form-field input,
    .form-field textarea{
        font-size:16px;
    }

}


/* =====================================================
   MÓVIL MUY PEQUEÑO
===================================================== */

@media(max-width:380px){

    .product-image{
        height:340px;
    }

    .hero h1{
        font-size:18vw;
    }

}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        scroll-behavior:auto !important;

        transition:none !important;
    }

}

</style>

</head>

</div>


<div class="form-field">

<label>
    Ciudad *
</label>

<input
    id="customerCity"
    type="text"
    autocomplete="address-level2"

>

</div>


<div class="form-field">

<label>
    Provincia *
</label>

<input
    id="customerProvince"
    type="text"
    autocomplete="address-level1"
    placeholder="Ej: Valencia"
>

</div>


<div class="form-field">

<label>
    País *
</label>

<input
    id="customerCountry"
    type="text"
    autocomplete="country-name"
    value="España"
>

</div>


<div class="form-field full">

<label>
    Observaciones
</label>

<textarea
    id="customerNotes"
    placeholder="Indica aquí cualquier información adicional..."

</div>

</div>

    class="send-order"

<button
    type="button"
    class="cancel-order"
    onclick="closeCustomerModal()"

</button>

</div>

</div>

let currentOrder=null;


/* =====================================================
   PRECIO
===================================================== */

function money(value){

    return Number(value).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ATRIBUTO
===================================================== */

function escapeAttribute(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;")
        .replace(/</g,"%3C")
        .replace(/>/g,"%3E");

}


/* =====================================================
   MOSTRAR PRODUCTOS
===================================================== */

function renderProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );


    if(
        !Array.isArray(PRODUCTS) ||
        !PRODUCTS.length
    ){

        container.innerHTML=`

            <div class="empty">

                Todavía no hay productos
                disponibles en esta categoría.

            </div>

        `;

        return;
    }


    container.innerHTML =
        PRODUCTS
        .map(
            (product,index)=>
                createProductHTML(
                    product,
                    index
                )
        )
        .join("");


    PRODUCTS.forEach(
        (_,index)=>{
            setupSwipe(index);
        }
    );

}


/* =====================================================
   CREAR PRODUCTO
===================================================== */

function createProductHTML(
    product,
    index
){

    const variants =
        Array.isArray(product.variants)
        ? product.variants
        : [];


    const firstVariant =
        variants[0];


    if(!firstVariant){

        return "";

    }


    const sizes =
        Array.isArray(product.sizes)
        ? product.sizes
        : [];


    const shipping =
        product.shipping ||
        {
            min:3,
            max:9
        };


    return `

    <article
        class="product"
        id="product-${index}"
        data-variant="0"
        data-size=""
        data-quantity="1"
    >


        <div
            class="product-image"
            id="gallery-${index}"
        >

            <img
                id="image-${index}"
                src="${escapeAttribute(firstVariant.image)}"
                alt="${escapeHTML(product.name)}"
                loading="lazy"
                draggable="false"
                onerror="imageError(this)"
            >


            <button
                type="button"
                class="image-arrow left"
                onclick="previousImage(${index})"
                aria-label="Imagen anterior"
            >
                ‹
            </button>


            <button
                type="button"
                class="image-arrow right"
                onclick="nextImage(${index})"
                aria-label="Imagen siguiente"
            >
                ›
            </button>


            ${
                variants.length > 1
                ?
                `
                <div
                    class="image-counter"
                    id="counter-${index}"
                >
                    1 / ${variants.length}
                </div>
                `
                :
                ""
            }

        </div>


        <div class="product-name">
            ${escapeHTML(product.name)}
        </div>


        <div class="product-code">

            REF:
            ${escapeHTML(
                product.ref ||
                product.id ||
                ""
            )}

        </div>


        ${
            product.description
            ?
            `
            <div class="product-description">
                ${escapeHTML(product.description)}
            </div>
            `
            :
            ""
        }


        <div class="product-price">
            ${money(product.price)}
        </div>


        <div class="label">

            Color:

            <span id="color-name-${index}">
                ${escapeHTML(firstVariant.name)}
            </span>

        </div>


        <div class="colors">

            ${
                variants.map(
                    (
                        variant,
                        variantIndex
                    )=>`

                    <button
                        type="button"
                        class="
                            color
                            ${
                                variantIndex===0
                                ?
                                "active"
                                :
                                ""
                            }
                        "
                        style="
                            background-image:
                            url('${escapeAttribute(
                                variant.image
                            )}');
                        "
                        title="${escapeAttribute(
                            variant.name
                        )}"
                        aria-label="${escapeAttribute(
                            variant.name
                        )}"
                        onclick="
                            selectColor(
                                ${index},
                                ${variantIndex}
                            )
                        "
                    ></button>

                    `
                ).join("")
            }

        </div>


        ${
            sizes.length
            ?
            `

            <div class="label">
                Talla
            </div>

            <div class="sizes">

                ${
                    sizes.map(
                        (
                            size,
                            sizeIndex
                        )=>`

                        <button
                            type="button"
                            class="size"
                            onclick="
                                selectSize(
                                    ${index},
                                    ${sizeIndex}
                                )
                            "
                        >
                            ${escapeHTML(size)}
                        </button>

                        `
                    ).join("")
                }

            </div>

            `
            :
            ""
        }


        <div class="quantity">

            <button
                type="button"
                onclick="
                    changeQuantity(
                        ${index},
                        -1
                    )
                "
            >
                −
            </button>


            <span id="quantity-${index}">
                1
            </span>


            <button
                type="button"
                onclick="
                    changeQuantity(
                        ${index},
                        1
                    )
                "
            >
                +
            </button>

        </div>


        <div class="shipping">

            🚚 Envío estimado:

            ${escapeHTML(shipping.min)}
            –
            ${escapeHTML(shipping.max)}

            días laborables

        </div>


        ${
            product.stock!==undefined
            ?
            `
            <div class="stock">

                Stock disponible:
                ${escapeHTML(product.stock)}

            </div>
            `
            :
            ""
        }


        <button
            type="button"
            class="buy"
            onclick="
                buyProduct(${index})
            "
        >
            COMPRAR
        </button>


    </article>

    `;

}


/* =====================================================
   CAMBIAR COLOR
===================================================== */

function selectColor(
    productIndex,
    variantIndex
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !Array.isArray(product.variants)
    ){

        return;
    }


    const variant =
        product.variants[variantIndex];


    if(!variant){

        return;
    }


    const image =
        document.getElementById(
            `image-${productIndex}`
        );


    image.src =
        variant.image;


    image.alt =
        product.name +
        " - " +
        variant.name;


    const colorName =
        document.getElementById(
            `color-name-${productIndex}`
        );


    if(colorName){

        colorName.textContent =
            variant.name;

    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;
    }


    card.dataset.variant =
        variantIndex;


    card.querySelectorAll(
        ".color"
    )
    .forEach(
        (
            button,
            buttonIndex
        )=>{

            button.classList.toggle(
                "active",
                buttonIndex===variantIndex
            );

        }
    );


    updateImageCounter(
        productIndex
    );

}


/* =====================================================
   SIGUIENTE IMAGEN
===================================================== */

function nextImage(productIndex){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !product.variants ||
        product.variants.length < 2
    ){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    let current =
        Number(
            card.dataset.variant || 0
        );


    current++;


    if(
        current >=
        product.variants.length
    ){

        current=0;

    }


    selectColor(
        productIndex,
        current
    );

}


/* =====================================================
   IMAGEN ANTERIOR
===================================================== */

function previousImage(productIndex){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !product.variants ||
        product.variants.length < 2
    ){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    let current =
        Number(
            card.dataset.variant || 0
        );


    current--;


    if(current<0){

        current =
            product.variants.length-1;

    }


    selectColor(
        productIndex,
        current
    );

}


/* =====================================================
   CONTADOR IMAGEN
===================================================== */

function updateImageCounter(productIndex){

    const product =
        PRODUCTS[productIndex];


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    const counter =
        document.getElementById(
            `counter-${productIndex}`
        );


    if(
        !product ||
        !card ||
        !counter
    ){

        return;
    }


    counter.textContent =
        (
            Number(
                card.dataset.variant || 0
            ) + 1
        )
        +
        " / "
        +
        product.variants.length;

}


/* =====================================================
   DESLIZAR CON EL DEDO
===================================================== */

function setupSwipe(productIndex){

    const gallery =
        document.getElementById(
            `gallery-${productIndex}`
        );


    if(!gallery){

        return;
    }


    let startX=0;
    let startY=0;


    gallery.addEventListener(
        "touchstart",
        function(event){

            if(
                !event.touches ||
                !event.touches.length
            ){

                return;
            }


            startX =
                event.touches[0].clientX;


            startY =
                event.touches[0].clientY;

        },
        {
            passive:true
        }
    );


    gallery.addEventListener(
        "touchend",
        function(event){

            if(
                !event.changedTouches ||
                !event.changedTouches.length
            ){

                return;
            }


            const endX =
                event.changedTouches[0].clientX;


            const endY =
                event.changedTouches[0].clientY;


            const differenceX =
                endX-startX;


            const differenceY =
                endY-startY;


            if(
                Math.abs(differenceX) < 45 ||
                Math.abs(differenceX) <=
                Math.abs(differenceY)
            ){

                return;
            }


            if(differenceX<0){

                nextImage(productIndex);

            }else{

                previousImage(productIndex);

            }

        },
        {
            passive:true
        }
    );

}


/* =====================================================
   ZOOM
===================================================== */

document.addEventListener(
    "click",
    function(event){

        const gallery =
            event.target.closest(
                ".product-image"
            );


        if(!gallery){

            return;
        }


        if(
            event.target.closest(
                ".image-arrow"
            )
        ){

            return;
        }


        gallery.classList.toggle(
            "zoomed"
        );

    }
);


/* =====================================================
   TALLA
===================================================== */

function selectSize(
    productIndex,
    sizeIndex
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !Array.isArray(product.sizes)
    ){

        return;
    }


    const size =
        product.sizes[sizeIndex];


    if(size===undefined){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;
    }


    card.dataset.size =
        size;


    card.querySelectorAll(
        ".size"
    )
    .forEach(
        (
            button,
            buttonIndex
        )=>{

            button.classList.toggle(
                "active",
                buttonIndex===sizeIndex
            );

        }
    );

}


/* =====================================================
   CANTIDAD
===================================================== */

function changeQuantity(
    productIndex,
    change
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;
    }


    let quantity =
        Number(
            card.dataset.quantity
        );


    quantity+=change;


    if(quantity<1){

        quantity=1;

    }


    const product =
        PRODUCTS[productIndex];


    if(
        product &&
        Number.isFinite(
            Number(product.stock)
        ) &&
        Number(product.stock)>0 &&
        quantity>
        Number(product.stock)
    ){

        quantity =
            Number(product.stock);

    }


    card.dataset.quantity =
        quantity;


    const quantityElement =
        document.getElementById(
            `quantity-${productIndex}`
        );


    if(quantityElement){

        quantityElement.textContent =
            quantity;

    }

}


/* =====================================================
   COMPRAR
===================================================== */

function buyProduct(
    productIndex
){

    const product =
        PRODUCTS[productIndex];


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!product || !card){

        return;
    }


    const variant =
        product.variants[
            Number(
                card.dataset.variant || 0
            )
        ];


    const size =
        card.dataset.size ||
        "No especificada";


    const quantity =
        Number(
            card.dataset.quantity || 1
        );


    const total =
        Number(product.price) *
        quantity;


    const shipping =
        product.shipping ||
        {
            min:3,
            max:9
        };


    if(!variant){

        alert(
            "Selecciona un color."
        );

        return;
    }


    if(
        Array.isArray(product.sizes) &&
        product.sizes.length &&
        !card.dataset.size
    ){

        alert(
            "Selecciona una talla antes de continuar."
        );

        return;
    }


    currentOrder={

        product,
        variant,
        size,
        quantity,
        total,
        shipping

    };


    showOrderSummary();


    document
        .getElementById(
            "customerModal"
        )
        .classList.add(
            "show"
        );


    document.body.style.overflow =
        "hidden";


    setTimeout(
        ()=>{
            document
                .getElementById(
                    "customerName"
                )
                .focus();
        },
        150
    );

}

/* =====================================================
   CERRAR MODAL
===================================================== */

function closeCustomerModal(){

    document
        .getElementById(
            "customerModal"
        )
        .classList.remove(
            "show"
        );


    document.body.style.overflow="";


    document
        .getElementById(
            "formError"
        )
        .classList.remove(
            "show"
        );

}


/* =====================================================
   CAMPO
===================================================== */

function fieldValue(id){

    return document
        .getElementById(id)
        .value
        .trim();

}


/* =====================================================
   WHATSAPP
===================================================== */

function sendOrderToWhatsApp(){

    if(!currentOrder){

        return;
    }


    const name=fieldValue(
        "customerName"
    );

    const phone=fieldValue(
        "customerPhone"
    );

    const email=fieldValue(
        "customerEmail"
    );

    const address=fieldValue(
        "customerAddress"
    );

    const number=fieldValue(
        "customerNumber"
    );

    const floor=fieldValue(
        "customerFloor"
    );

    const postal=fieldValue(
        "customerPostal"
    );

    const city=fieldValue(
        "customerCity"
    );

    const province=fieldValue(
        "customerProvince"
    );

    const country=fieldValue(
        "customerCountry"
    );

    const notes=fieldValue(
        "customerNotes"
    );


    if(!name){

        showFormError(
            "Introduce tu nombre y apellidos."
        );

        return;
    }


    if(!phone){

        showFormError(
            "Introduce tu teléfono."
        );

        return;
    }


    if(!address){

        showFormError(
            "Introduce la dirección de envío."
        );

        return;
    }


    if(!number){

        showFormError(
            "Introduce el número de la dirección."
        );

        return;
    }


    if(!postal){

        showFormError(
            "Introduce el código postal."
        );

        return;
    }


    if(!city){

        showFormError(
            "Introduce la ciudad."
        );

        return;
    }


    if(!province){

        showFormError(
            "Introduce la provincia."
        );

        return;
    }


    if(!country){

        showFormError(
            "Introduce el país."
        );

        return;
    }


    if(
        email &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email)
    ){

        showFormError(
            "El email no parece válido."
        );

        return;
    }


    const order =
        currentOrder;


    const whatsapp =
        String(
            order.product.whatsapp || ""
        )
        .replace(
            /\D/g,
            ""
        );


    if(!whatsapp){

        showFormError(
            "Este producto no tiene configurado el WhatsApp de pedidos."
        );

        return;
    }


    const message=

`🛍️ NUEVO PEDIDO

━━━━━━━━━━━━━━━━

📦 PRODUCTO

Producto: ${order.product.name}

REF: ${order.product.ref || order.product.id || ""}

Color: ${order.variant.name}

Talla: ${order.size}

Cantidad: ${order.quantity}

💰 PRECIO

Precio unidad:
${money(order.product.price)}

Total:
${money(order.total)}

🚚 ENTREGA

${order.shipping.min}–${order.shipping.max}
días laborables

━━━━━━━━━━━━━━━━

👤 DATOS DEL CLIENTE

Nombre y apellidos:
${name}

Teléfono:
${phone}

Email:
${email || "No indicado"}

📍 DIRECCIÓN DE ENVÍO

Dirección:
${address}

Número:
${number}

Piso / Puerta:
${floor || "No indicado"}

Código postal:
${postal}

Ciudad:
${city}

Provincia:
${province}

País:
${country}

📝 OBSERVACIONES:

${notes || "Ninguna"}

━━━━━━━━━━━━━━━━`;


    const whatsappURL=
        "https://wa.me/" +
        whatsapp +
        "?text=" +
        encodeURIComponent(
            message
        );


    closeCustomerModal();


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* =====================================================
   ERROR
===================================================== */

function showFormError(message){

    const error =
        document.getElementById(
            "formError"
        );


    error.textContent =
        message;


    error.classList.add(
        "show"
    );


    error.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });

}


/* =====================================================
   CERRAR AL PULSAR FUERA
===================================================== */

document
    .getElementById(
        "customerModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target===this
            ){

                closeCustomerModal();

            }

        }
    );


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key==="Escape"
        ){

            closeCustomerModal();

        }

    }
);


/* =====================================================
   ERROR IMAGEN
===================================================== */

function imageError(image){

    image.style.display="none";

}


/* =====================================================
   INICIAR
===================================================== */

renderProducts();

</script>
