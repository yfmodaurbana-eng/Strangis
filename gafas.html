<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gafas | Strangis</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:linear-gradient(
        135deg,
        #151515 0%,
        #292929 38%,
        #4d4d4d 65%,
        #222 100%
    );
}

button,input,textarea{font:inherit}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    padding:16px 5%;
    display:flex;
    align-items:center;
    gap:30px;
    border-bottom:1px solid rgba(255,255,255,.12);
    background:rgba(20,20,20,.92);
    backdrop-filter:blur(18px);
}

.logo{
    flex-shrink:0;
    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

nav{
    flex:1;
    display:flex;
    justify-content:center;
    gap:28px;
    overflow-x:auto;
    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#999;
    text-decoration:none;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1.5px;
    text-transform:uppercase;
    white-space:nowrap;
    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
}

/* =========================
   HERO
========================= */

.hero{
    width:min(1400px,90%);
    margin:auto;
    padding:75px 0 50px;
}

.hero small{
    color:#aaa;
    font-size:11px;
    font-weight:bold;
    letter-spacing:5px;
}

.hero h1{
    margin-top:18px;
    font-size:clamp(58px,10vw,125px);
    letter-spacing:-7px;
    line-height:.85;
}

.hero p{
    max-width:600px;
    margin-top:25px;
    color:#aaa;
    font-size:14px;
    line-height:1.6;
}

/* =========================
   PRODUCT GRID
========================= */

.products-section{
    width:min(1400px,90%);
    margin:auto;
    padding:10px 0 90px;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:18px;
}

/* =========================
   PRODUCT CARD
========================= */

.product{
    min-width:0;
    overflow:hidden;

    /*
     * TARJETA MÁS COMPACTA
     */
    padding:13px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;

    background:rgba(255,255,255,.055);

    box-shadow:
        0 12px 35px rgba(0,0,0,.15);

    transition:.25s;
}

.product:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.25);
    background:rgba(255,255,255,.075);
}

/* =========================
   PRODUCT IMAGE
========================= */

.product-gallery{
    position:relative;

    /*
     * ANTES: 390px
     * AHORA: 270px
     */
    height:270px;

    margin:-13px -13px 14px;

    overflow:hidden;

    background:#171717;

    touch-action:pan-y;
}

.product-image{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:zoom-in;
    user-select:none;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.02);

    transition:.35s;
}

.product:hover .product-image img{
    transform:scale(1.05);
}

/* =========================
   GALLERY BUTTONS
========================= */

.gallery-arrow,
.lightbox-arrow{
    position:absolute;
    z-index:5;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;

    background:rgba(0,0,0,.55);

    color:#fff;

    cursor:pointer;
}

.gallery-arrow{
    top:50%;

    width:34px;
    height:34px;

    transform:translateY(-50%);
}

.gallery-arrow.prev{
    left:10px;
}

.gallery-arrow.next{
    right:10px;
}

.gallery-counter,
.lightbox-counter{
    position:absolute;
    left:50%;
    bottom:9px;
    z-index:5;

    padding:5px 9px;

    border-radius:20px;

    background:rgba(0,0,0,.55);

    color:#fff;

    font-size:9px;
    font-weight:bold;

    transform:translateX(-50%);
}

.swipe-hint{
    position:absolute;
    left:50%;
    bottom:36px;
    z-index:4;

    padding:4px 8px;

    border-radius:15px;

    background:rgba(0,0,0,.42);

    color:#ddd;

    font-size:8px;

    transform:translateX(-50%);

    opacity:.8;

    pointer-events:none;
}

/* =========================
   PRODUCT INFO
========================= */

.product-name{
    font-size:15px;
    font-weight:800;
    line-height:1.3;
}

.product-code{
    margin-top:5px;

    color:#777;

    font-size:9px;
    letter-spacing:1.1px;
}

.product-description{
    margin-top:7px;

    color:#999;

    font-size:11px;
    line-height:1.45;

    /*
     * Evita que una descripción enorme
     * haga crecer demasiado la tarjeta.
     */
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.product-price{
    margin-top:10px;

    font-size:16px;
    font-weight:800;
}

/* =========================
   LABELS
========================= */

.label{
    margin-top:13px;

    color:#aaa;

    font-size:9px;
    font-weight:bold;

    text-transform:uppercase;
    letter-spacing:1.1px;
}

.label span{
    color:#fff;
}

/* =========================
   COLORS
========================= */

.colors{
    display:flex;
    flex-wrap:wrap;

    gap:8px;

    margin-top:8px;
}

.color{
    width:34px;
    height:34px;

    flex:0 0 34px;

    border:2px solid rgba(255,255,255,.25);

    border-radius:50%;

    cursor:pointer;

    background-color:#222;
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;

    transition:.2s;
}

.color:hover{
    transform:scale(1.06);
    border-color:#fff;
}

.color.active{
    outline:2px solid #fff;
    outline-offset:2px;
}

/* =========================
   SIZES
========================= */

.sizes{
    display:flex;
    flex-wrap:wrap;

    gap:6px;

    margin-top:8px;
}

.size{
    min-width:39px;

    padding:7px 10px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:5px;

    color:#bbb;

    background:transparent;

    cursor:pointer;

    font-size:10px;
    font-weight:bold;
}

.size:hover{
    border-color:#fff;
}

.size.active{
    background:#fff;
    color:#111;
    border-color:#fff;
}

/* =========================
   QUANTITY
========================= */

.quantity{
    display:flex;
    align-items:center;

    gap:11px;

    margin-top:13px;
}

.quantity button{
    width:32px;
    height:32px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:5px;

    background:#181818;
    color:#fff;

    cursor:pointer;

    font-size:16px;
}

.quantity span{
    min-width:22px;

    text-align:center;

    font-size:13px;
    font-weight:bold;
}

/* =========================
   SHIPPING
========================= */

.shipping{
    margin-top:12px;

    padding:9px 10px;

    border:1px solid rgba(255,177,72,.28);

    border-left:3px solid #f0a44b;

    border-radius:6px;

    background:rgba(240,164,75,.10);

    color:#f2c58f;

    font-size:10px;
    font-weight:bold;

    line-height:1.4;
}

.shipping strong{
    color:#fff;
}

/* =========================
   STOCK
========================= */

.stock{
    margin-top:6px;

    color:#777;

    font-size:9px;
}

.stock.out{
    color:#ff8d8d;
    font-weight:bold;
}

/* =========================
   BUY BUTTON
========================= */

.buy{
    width:100%;

    margin-top:13px;

    padding:13px;

    border:0;

    border-radius:5px;

    background:#fff;
    color:#111;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.4px;

    cursor:pointer;
}

.buy:hover{
    background:#ddd;
}

.buy:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =========================
   LOADING
========================= */

.empty,
.loading{
    grid-column:1/-1;

    padding:100px 20px;

    text-align:center;

    color:#aaa;
}

/* =========================
   FOOTER
========================= */

footer{
    padding:35px 5%;

    border-top:1px solid rgba(255,255,255,.1);

    text-align:center;

    color:#777;

    font-size:10px;
}

/* =========================
   LIGHTBOX
========================= */

.image-lightbox{
    position:fixed;
    inset:0;
    z-index:10000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(0,0,0,.92);

    backdrop-filter:blur(12px);
}

.image-lightbox.show{
    display:flex;
}

.lightbox-content{
    position:relative;

    width:min(1100px,100%);

    height:min(90vh,900px);

    display:flex;

    align-items:center;
    justify-content:center;
}

.lightbox-image{
    max-width:100%;
    max-height:90vh;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:8px;
}

.lightbox-close{
    position:absolute;

    top:-10px;
    right:-10px;

    z-index:10;

    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:50%;

    background:rgba(0,0,0,.7);

    color:#fff;

    cursor:pointer;

    font-size:24px;
}

.lightbox-arrow{
    top:50%;

    width:48px;
    height:48px;

    font-size:22px;

    transform:translateY(-50%);
}

.lightbox-arrow.prev{
    left:10px;
}

.lightbox-arrow.next{
    right:10px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);

    max-height:calc(100vh - 40px);

    overflow-y:auto;

    padding:30px;

    border:1px solid rgba(255,255,255,.16);

    border-radius:15px;

    background:linear-gradient(
        145deg,
        #222,
        #111
    );
}

.modal-header{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.modal-header small{
    color:#999;

    font-size:10px;
    font-weight:bold;

    letter-spacing:3px;
}

.modal-header h2{
    margin-top:8px;

    font-size:28px;
}

.close-modal{
    width:40px;
    height:40px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:6px;

    background:#222;

    color:#fff;

    cursor:pointer;

    font-size:20px;
}

.order-summary{
    margin-bottom:25px;

    padding:16px;

    border:1px solid rgba(255,255,255,.10);

    border-radius:8px;

    background:rgba(255,255,255,.045);

    color:#aaa;

    font-size:12px;

    line-height:1.7;
}

.order-summary strong{
    color:#fff;
}

.form-title{
    margin:25px 0 15px;

    font-size:13px;
    font-weight:900;

    letter-spacing:1.5px;
}

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;
}

.form-field{
    margin-bottom:14px;
}

.form-field.full{
    grid-column:1/-1;
}

.form-field label{
    display:block;

    margin-bottom:7px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    letter-spacing:1px;

    text-transform:uppercase;
}

.form-field input,
.form-field textarea{
    width:100%;

    padding:14px;

    border:1px solid rgba(255,255,255,.16);

    border-radius:6px;

    outline:none;

    background:rgba(0,0,0,.35);

    color:#fff;

    font-size:14px;
}

.form-field input{
    min-height:48px;
}

.form-field textarea{
    min-height:100px;

    resize:vertical;
}

.form-error{
    display:none;

    margin-bottom:15px;

    padding:12px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:6px;

    background:rgba(255,255,255,.06);

    color:#fff;

    font-size:11px;
}

.form-error.show{
    display:block;
}

.send-order{
    width:100%;

    margin-top:12px;

    padding:17px;

    border:0;

    border-radius:7px;

    background:#fff;

    color:#111;

    cursor:pointer;

    font-size:12px;
    font-weight:900;

    letter-spacing:1.2px;
}

.cancel-order{
    width:100%;

    margin-top:10px;

    padding:13px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:6px;

    background:transparent;

    color:#aaa;

    cursor:pointer;
}

/* =========================
   TABLET
========================= */

@media(max-width:1100px){

    .products{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .product-gallery{
        height:250px;
    }
}

/* =========================
   TABLET PEQUEÑA
========================= */

@media(max-width:850px){

    .products{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .hero,
    .products-section{
        width:92%;
    }

    .product-gallery{
        height:250px;
    }
}

/* =========================
   MÓVIL
========================= */

@media(max-width:600px){

    header{
        padding:15px;

        flex-wrap:wrap;

        gap:14px;
    }

    .logo{
        font-size:17px;

        letter-spacing:2.5px;
    }

    nav{
        order:3;

        flex-basis:100%;

        justify-content:flex-start;

        gap:22px;
    }

    .hero{
        width:94%;

        padding:50px 0 35px;
    }

    .hero h1{
        font-size:
            clamp(48px,16vw,76px);

        letter-spacing:-5px;
    }

    .hero p{
        font-size:13px;
    }

    .products-section{
        width:94%;
    }

    /*
     * En móvil también reducimos mucho
     * la altura de la tarjeta.
     */
    .products{
        display:flex;

        flex-direction:column;

        gap:16px;
    }

    .product{
        width:100%;

        padding:11px;
    }

    .product-gallery{

        /*
         * ANTES: hasta 430px
         * AHORA: mucho más corta
         */
        height:280px;

        margin:
            -11px
            -11px
            14px;
    }

    .product:hover{
        transform:none;
    }

    .product-image img,
    .product:hover .product-image img{
        transform:none;
    }

    .product-name{
        font-size:15px;
    }

    .product-description{
        font-size:11px;
    }

    .color{
        width:35px;
        height:35px;

        flex-basis:35px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-field.full{
        grid-column:auto;
    }

    .modal{
        padding:0;

        align-items:flex-end;
    }

    .modal-box{
        width:100%;

        max-height:96vh;

        padding:22px 17px 25px;

        border-radius:
            18px 18px 0 0;
    }
}

/* =========================
   MÓVILES MUY PEQUEÑOS
========================= */

@media(max-width:400px){

    .product-gallery{
        height:250px;
    }

    .product{
        padding:10px;
    }

    .product-gallery{
        margin:
            -10px
            -10px
            13px;
    }

    .shipping{
        font-size:9px;
    }

    .buy{
        padding:12px;
    }
}
</style>
</head>

<header>

    <div class="logo">
        Strangis
    </div>

    <nav>

        <a href="index.html">

    </small>

    <h1>
        GAFAS
    </h1>

    <p>
        Gafas seleccionadas para completar

    </p>

</section>


<section class="products-section">

    <div

        id="productsContainer"

</section>


<footer>

</footer>


<!-- =========================
     LIGHTBOX
========================= -->

<div

>

    <div class="lightbox-content">

        <button

            type="button"

        </button>

        <div

        </div>

    </div>

</div>


<!-- =========================
     MODAL PEDIDO
========================= -->

<div
    class="modal"
    id="customerModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div>

                <small>
                    FINALIZAR PEDIDO
                </small>

                <h2>
                    Datos de envío
                </h2>

            </div>

            <button
                class="close-modal"
                type="button"
                onclick="closeCustomerModal()"
            >
                ×
            </button>

        </div>


        <div
            class="order-summary"
            id="orderSummary"
        ></div>


        <div
            class="form-error"
            id="formError"
        ></div>


        <div class="form-title">
            DATOS DEL CLIENTE
        </div>


        <div class="form-grid">

            <div class="form-field full">

                <label>
                    Nombre y apellidos *
                </label>

                <input
                    id="customerName"
                    type="text"
                    autocomplete="name"
                >

            </div>


            <div class="form-field">

                <label>
                    Teléfono *
                </label>

                <input
                    id="customerPhone"
                    type="tel"
                    autocomplete="tel"
                >

            </div>


            <div class="form-field">

                <label>
                    Email
                </label>

                <input
                    id="customerEmail"
                    type="email"
                    autocomplete="email"
                >

            </div>

        </div>


        <div class="form-title">
            DIRECCIÓN DE ENVÍO
        </div>


        <div class="form-grid">

            <div class="form-field full">

                <label>
                    Dirección *
                </label>

                <input
                    id="customerAddress"
                    type="text"
                    autocomplete="street-address"
                >

            </div>


            <div class="form-field">

                <label>
                    Número *
                </label>

                <input
                    id="customerNumber"
                    type="text"
                >

            </div>


            <div class="form-field">

                <label>
                    Piso / Puerta
                </label>

                <input
                    id="customerFloor"
                    type="text"
                >

            </div>


            <div class="form-field">

                <label>
                    Código postal *
                </label>

                <input
                    id="customerPostal"
                    type="text"
                    inputmode="numeric"
                >

            </div>


            <div class="form-field">

                <label>
                    Ciudad *
                </label>

                <input
                    id="customerCity"
                    type="text"
                >

            </div>


            <div class="form-field">

                <label>
                    Provincia *
                </label>

                <input
                    id="customerProvince"
                    type="text"
                >

            </div>


            <div class="form-field">

                <label>
                    País *
                </label>

                <input
                    id="customerCountry"
                    type="text"
                    value="España"
                >

            </div>


            <div class="form-field full">

                <label>
                    Observaciones
                </label>

                <textarea
                    id="customerNotes"
                ></textarea>

            </div>

        </div>


        <button
            class="send-order"
            type="button"
            onclick="sendOrderToWhatsApp()"
        >
            ENVIAR PEDIDO POR WHATSAPP
        </button>


        <button
            class="cancel-order"
            type="button"
            onclick="closeCustomerModal()"
        >
            CANCELAR
        </button>

    </div>

</div>

    async request(path,options={}){

        const response =
            await fetch(
                STRANGIS_SUPABASE_URL + path,
                {
                    ...options,

                    headers:{
                        "apikey":
                            STRANGIS_SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            STRANGIS_SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        ...(options.headers || {})
                    }
                }
            );

        const text =
            await response.text();

        let data = null;

        try{

            data =
                text
                    ? JSON.parse(text)
                    : null;

        }catch{

            data = text;

        }

        if(!response.ok){

            throw new Error(
                data?.message ||
                data?.error_description ||
                data?.hint ||
                text ||
                `Error HTTP ${response.status}`
            );

        }

        return data;
    },


    async getProducts(){

        const params =
            new URLSearchParams({

                select:"*",

                category:
                    `eq.${CATEGORY}`,

                active:"eq.true",

                order:"id.asc"

            });

        return this.request(
            `/rest/v1/${encodeURIComponent(
                STRANGIS_PRODUCTS_TABLE
            )}?${params.toString()}`
        );

    }

};


/* =========================
   HELPERS
========================= */

function money(value){

    return Number(
        value || 0
    ).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function parseJSON(
    value,
    fallback=[]
){

    if(Array.isArray(value)){
        return value;
    }

    if(typeof value === "string"){

        try{

            const parsed =
                JSON.parse(value);

            return Array.isArray(parsed)
                ? parsed
                : fallback;

        }catch{

            return fallback;

        }

    }

    return fallback;
}


/* =========================
   VARIANTS
========================= */

function getVariants(product){

    const rawVariants =
        parseJSON(
            product.images,
            []
        );

    const result = [];


    rawVariants.forEach(
        (variant,index)=>{

            if(typeof variant === "string"){

                if(variant.trim()){

                    result.push({

                        name:
                            `Color ${index + 1}`,

                        image:
                            variant.trim()

                    });

                }

                return;
            }


            if(
                !variant ||
                typeof variant !== "object"
            ){
                return;
            }


            const images =
                parseJSON(
                    variant.images,
                    []
                );


            let image = "";


            if(images.length){

                image =
                    String(
                        images[0] || ""
                    ).trim();

            }else if(variant.image){

                image =
                    String(
                        variant.image
                    ).trim();

            }else if(variant.url){

                image =
                    String(
                        variant.url
                    ).trim();

            }else if(variant.src){

                image =
                    String(
                        variant.src
                    ).trim();

            }


            if(!image){
                return;
            }


            result.push({

                name:
                    variant.name ||
                    variant.color ||
                    `Color ${index + 1}`,

                image

            });

        }
    );


    return result;
}


function getSizes(product){

    return parseJSON(
        product.sizes,
        []
    );

}

        );

/* =========================
   VARIANTS
========================= */

function setVariant(
    productIndex,
    variantIndex
){

    const product =
        PRODUCTS[productIndex];

    if(!product)return;


    const variants =
        getVariants(product);

    const variant =
        variants[variantIndex];

    if(!variant)return;


    const card =
        document.getElementById(
            `product-${productIndex}`
        );

    const image =
        document.getElementById(
            `image-${productIndex}`
        );


    if(!card || !image)return;


    card.dataset.variant =
        variantIndex;


    image.src =
        variant.image;


    image.alt =
        `${product.name || "Producto"} - ${variant.name}`;


    card
        .querySelectorAll(".color")
        .forEach(
            (button,i)=>{

                button.classList.toggle(
                    "active",
                    i === variantIndex
                );

            }
        );


    const colorName =
        document.getElementById(
            `color-name-${productIndex}`
        );


    if(colorName){

        colorName.textContent =
            variant.name;

    }


    const counter =
        document.getElementById(
            `gallery-counter-${productIndex}`
        );


    if(counter){

        counter.textContent =
            `${variantIndex + 1} / ${variants.length}`;

    }

}


function selectColor(
    productIndex,
    variantIndex
){

    setVariant(
        productIndex,
        variantIndex
    );

}


function selectNextVariant(
    productIndex
){

    const product =
        PRODUCTS[productIndex];

    if(!product)return;


    const variants =
        getVariants(product);


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(
        !card ||
        !variants.length
    ){
        return;
    }


    let current =
        Number(
            card.dataset.variant || 0
        );


    current++;


    if(current >= variants.length){

        current = 0;

    }


    setVariant(
        productIndex,
        current
    );

}


function selectPreviousVariant(
    productIndex
){

    const product =
        PRODUCTS[productIndex];

    if(!product)return;


    const variants =
        getVariants(product);


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(
        !card ||
        !variants.length
    ){
        return;
    }


    let current =
        Number(
            card.dataset.variant || 0
        );


    current--;


    if(current < 0){

        current =
            variants.length - 1;

    }


    setVariant(
        productIndex,
        current
    );

}


/* =========================
   TOUCH
========================= */

let galleryStartX = 0;
let galleryStartY = 0;


function galleryTouchStart(event){

    if(
        !event.touches ||
        !event.touches.length
    ){
        return;
    }


    galleryStartX =
        event.touches[0].clientX;

    galleryStartY =
        event.touches[0].clientY;

}


function galleryTouchEnd(
    event,
    productIndex
){

    if(
        !event.changedTouches ||
        !event.changedTouches.length
    ){
        return;
    }


    const endX =
        event.changedTouches[0].clientX;

    const endY =
        event.changedTouches[0].clientY;


    const diffX =
        endX - galleryStartX;

    const diffY =
        endY - galleryStartY;


    if(
        Math.abs(diffX) < 45 ||
        Math.abs(diffX) <
        Math.abs(diffY)
    ){
        return;
    }


    if(diffX < 0){

        selectNextVariant(
            productIndex
        );

    }else{

        selectPreviousVariant(
            productIndex
        );

    }

}


/* =========================
   SIZE
========================= */

function selectSize(
    productIndex,
    sizeIndex
){

    const product =
        PRODUCTS[productIndex];

    if(!product)return;


    const sizes =
        getSizes(product);

    const size =
        sizes[sizeIndex];


    const card =
        document.getElementById(

        );


    if(
        !card ||
        size === undefined
    ){
        return;
    }


    card.dataset.size =

    card
        .querySelectorAll(".size")
        .forEach(
            (button,index)=>{

                button.classList.toggle(
                    "active",
                    index === sizeIndex
                );

            }
        );

}


/* =========================
   QUANTITY
========================= */

function changeQuantity(
    productIndex,
    change
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card)return;


    const product =
        PRODUCTS[productIndex];


    let quantity =
        Number(
            card.dataset.quantity || 1
        );


    quantity += change;


    if(quantity < 1){

        quantity = 1;

    }


    if(
        product.stock !== null &&
        product.stock !== undefined
    ){

        const stock =
            Number(product.stock);


        if(
            stock > 0 &&
            quantity > stock
        ){

            quantity = stock;

        }

    }


    card.dataset.quantity =
        quantity;


    const element =
        document.getElementById(
            `quantity-${productIndex}`
        );


    if(element){

        element.textContent =
            quantity;

    }

}


/* =========================
   BUY
========================= */

function buyProduct(
    productIndex
){

    const product =
        PRODUCTS[productIndex];

    if(!product)return;


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    const variants =
        getVariants(product);


    const variant =
        variants[
            Number(
                card.dataset.variant || 0
            )
        ];


    const sizes =
        getSizes(product);


    const size =
        card.dataset.size ||
        "No especificada";


    const quantity =
        Number(
            card.dataset.quantity || 1
        );


    if(
        sizes.length &&
        !card.dataset.size
    ){

        alert(
            "Selecciona una talla antes de continuar."
        );

        return;
    }


    if(!variant){

        alert(
            "Este producto no tiene una imagen/color configurado."
        );

        return;
    }


    if(
        product.stock !== null &&
        product.stock !== undefined &&
        Number(product.stock) <= 0
    ){

        alert(
            "Este producto está agotado."
        );

        return;
    }


    if(
        product.stock !== null &&
        product.stock !== undefined &&
        quantity >
        Number(product.stock)
    ){

        alert(
            "La cantidad seleccionada supera el stock disponible."
        );

        return;
    }


    currentOrder = {

        product,

        variant,

        size,

        quantity,

        total:
            Number(
                product.price || 0
            ) *
            quantity

    };


    showOrderSummary();


    const modal =
        document.getElementById(
            "customerModal"
        );


    const error =
        document.getElementById(
            "formError"
        );


    error.classList.remove(
        "show"
    );

    error.textContent = "";


    modal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";

}

function openLightbox(
    productIndex
){

    const product =
        PRODUCTS[productIndex];

    if(!product)return;


    const variants =
        getVariants(product);


    if(!variants.length)return;


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    lightboxProductIndex =
        productIndex;


    lightboxVariantIndex =
        Number(
            card.dataset.variant || 0
        );


    updateLightbox();


    document
        .getElementById(
            "imageLightbox"
        )
        .classList.add(
            "show"
        );


    document.body.style.overflow =
        "hidden";

}


function updateLightbox(){

    const product =
        PRODUCTS[
            lightboxProductIndex
        ];


    if(!product)return;


    const variants =
        getVariants(product);


    const variant =
        variants[
            lightboxVariantIndex
        ];


    if(!variant)return;


    document.getElementById(
        "lightboxImage"
    ).src =
        variant.image;


    document.getElementById(
        "lightboxImage"
    ).alt =
        product.name ||
        "Producto";


    document.getElementById(
        "lightboxCounter"
    ).textContent =
        `${lightboxVariantIndex + 1} / ${variants.length}`;

}


function changeLightboxImage(
    direction
){

    const product =
        PRODUCTS[
            lightboxProductIndex
        ];


    if(!product)return;


    const variants =
        getVariants(product);


    if(!variants.length)return;


    lightboxVariantIndex +=
        direction;


    if(
        lightboxVariantIndex >=
        variants.length
    ){

        lightboxVariantIndex = 0;

    }


    if(lightboxVariantIndex < 0){

        lightboxVariantIndex =
            variants.length - 1;

    }


    setVariant(
        lightboxProductIndex,
        lightboxVariantIndex
    );


    updateLightbox();

}


function closeLightbox(){

    document
        .getElementById(
            "imageLightbox"
        )
        .classList.remove(
            "show"
        );


    if(
        !document
            .getElementById(
                "customerModal"
            )
            .classList.contains(
                "show"
            )
    ){

        document.body.style.overflow =
            "";

    }

}


/* =========================
   IMAGE ERROR
========================= */

function imageError(image){

    console.error(
        "No se pudo cargar la imagen:",
        image.src
    );


    image.style.display =
        "none";

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeLightbox();

            closeCustomerModal();

        }


        if(
            event.key === "ArrowRight" &&
            document
                .getElementById(
                    "imageLightbox"
                )
                .classList.contains(
                    "show"
                )
        ){

            changeLightboxImage(1);

        }


        if(
            event.key === "ArrowLeft" &&
            document
                .getElementById(
                    "imageLightbox"
                )
                .classList.contains(
                    "show"
                )
        ){

            changeLightboxImage(-1);

        }

    }
);


/* =========================
   CLOSE MODALS
========================= */

document
    .getElementById(
        "customerModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeCustomerModal();

            }

        }
    );


document
    .getElementById(
        "imageLightbox"
    )
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeLightbox();

            }

        }
    );


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
</html>
