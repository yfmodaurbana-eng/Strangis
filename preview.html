<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strangis — Tu tienda online</title>

    <meta
        name="description"
        content="Strangis — Tu tienda online"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #151515 0%,
                    #292929 40%,
                    #4d4d4d 65%,
                    #222 100%
                );

            color: #fff;
        }

        .preview {
            width: min(1280px, 100%);
            aspect-ratio: 2 / 1;
            min-height: 420px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;

            border: 1px solid rgba(255,255,255,.14);
            border-radius: 18px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,.10),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #111 0%,
                    #292929 50%,
                    #171717 100%
                );

            box-shadow:
                0 30px 80px rgba(0,0,0,.55);
        }

        .preview::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(255,255,255,.06);

            filter: blur(80px);
        }

        .content {
            position: relative;
            z-index: 2;

            text-align: center;
        }

        .brand {
            font-size: clamp(60px, 10vw, 150px);
            line-height: .8;

            font-weight: 900;
            letter-spacing: -7px;

            color: #fff;

            text-shadow:
                0 0 5px rgba(255,255,255,.95),
                0 0 15px rgba(255,255,255,.85),
                0 0 35px rgba(255,255,255,.65),
                0 0 70px rgba(255,255,255,.4),
                0 0 110px rgba(255,255,255,.25);
        }

        .subtitle {
            margin-top: 35px;

            font-size: clamp(15px, 2vw, 25px);

            font-weight: 700;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: #bdbdbd;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .preview {
                min-height: 260px;
                border-radius: 12px;
            }

            .brand {
                letter-spacing: -4px;
            }

            .subtitle {
                margin-top: 22px;
                letter-spacing: 3px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="preview">

        <div class="content">

            <div class="brand">
                STRANGIS
            </div>

            <div class="subtitle">
                Tu tienda online
            </div>

        </div>

    </main>

</body>
</html>
