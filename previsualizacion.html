<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRANGIS · Previsualización</title>
<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        linear-gradient(
            135deg,
            #151515 0%,
            #292929 38%,
            #4d4d4d 65%,
            #222 100%
        );
}

button,
input,
textarea{
    font:inherit;
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:16px 5%;

    display:flex;
    align-items:center;
    gap:28px;

    border-bottom:1px solid rgba(255,255,255,.12);

    background:rgba(20,20,20,.94);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.logo{
    flex-shrink:0;

    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

nav{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    gap:12px;

    overflow-x:auto;
    overflow-y:hidden;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior-x:contain;

    scroll-behavior:smooth;

    padding:4px 2px;

    touch-action:pan-x;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    flex:0 0 auto;

    display:flex;
    align-items:center;
    justify-content:center;

    min-height:34px;

    padding:8px 13px;

    border:1px solid transparent;
    border-radius:7px;

    color:#999;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;

    letter-spacing:1.3px;

    text-transform:uppercase;

    white-space:nowrap;

    transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
}

nav a:hover{
    color:#fff;

    border-color:rgba(255,255,255,.16);

    background:rgba(255,255,255,.05);
}

nav a.active{
    color:#111;

    border-color:#fff;

    background:#fff;

    box-shadow:
        0 4px 18px rgba(255,255,255,.10);
}


/* =========================
   HERO
========================= */

.hero{
    width:min(1400px,90%);
    margin:auto;

    padding:
        clamp(65px,9vw,110px)
        0
        clamp(45px,6vw,75px);
}

.hero small{
    display:block;

    max-width:100%;

    color:#aaa;
    font-size:11px;
    font-weight:bold;
    letter-spacing:5px;

    line-height:1.6;

    white-space:normal;
    word-break:normal;
    overflow-wrap:normal;
}

.hero h1{
    margin-top:18px;

    font-size:clamp(42px,7vw,82px);

    letter-spacing:-4px;

    line-height:.9;
}

.hero p{
    max-width:600px;

    margin-top:28px;

    color:#aaa;

    font-size:15px;
    line-height:1.7;
}


/* =========================
   PRODUCTS
========================= */

.products-section{
    width:min(1400px,90%);
    margin:auto;
    padding:10px 0 100px;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:20px;
}

.product{
    min-width:0;
    overflow:hidden;

    padding:16px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;

    background:rgba(255,255,255,.055);

    box-shadow:
        0 15px 45px rgba(0,0,0,.15);

    transition:.25s;
}

.product:hover{
    transform:translateY(-4px);

    border-color:rgba(255,255,255,.25);

    background:rgba(255,255,255,.075);
}


/* =========================
   GALERÍA
========================= */

.product-gallery{
    position:relative;

    height:390px;

    margin:-16px -16px 14px;

    overflow:hidden;

    background:#171717;

    touch-action:pan-y;
}

.product-image{
    position:relative;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:zoom-in;

    user-select:none;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.04);

    transition:.35s;
}

.product:hover .product-image img{
    transform:scale(1.08);
}


/* =========================
   ETIQUETA EN LA IMAGEN
========================= */

.product-image-label{
    position:absolute;

    left:14px;
    right:14px;
    bottom:14px;

    z-index:6;

    padding:12px 14px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:9px;

    background:rgba(10,10,10,.76);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    box-shadow:
        0 10px 30px rgba(0,0,0,.38);

    pointer-events:none;
}

.product-image-label-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:14px;
}

.product-image-label-name{
    min-width:0;

    color:#fff;

    font-size:13px;
    font-weight:800;

    line-height:1.25;

    letter-spacing:.2px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-image-label-price{
    flex-shrink:0;

    color:#fff;

    font-size:14px;
    font-weight:900;

    white-space:nowrap;
}

.product-image-label-meta{
    display:flex;
    align-items:center;

    gap:8px;

    margin-top:6px;

    color:#aaa;

    font-size:9px;
    font-weight:700;

    letter-spacing:1px;

    text-transform:uppercase;
}

.product-image-label-ref{
    color:#aaa;
}

.product-image-label-color{
    color:#fff;
}

.product-image-label-separator{
    width:3px;
    height:3px;

    flex:0 0 3px;

    border-radius:50%;

    background:#777;
}


/* =========================
   FLECHAS
========================= */

.gallery-arrow,
.lightbox-arrow{
    position:absolute;
    z-index:8;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.25);

    border-radius:50%;

    background:rgba(0,0,0,.55);

    color:#fff;

    cursor:pointer;
}

.gallery-arrow{
    top:50%;

    width:36px;
    height:36px;

    transform:translateY(-50%);
}

.gallery-arrow.prev{
    left:10px;
}

.gallery-arrow.next{
    right:10px;
}

.gallery-arrow:hover{
    background:rgba(0,0,0,.78);

    border-color:rgba(255,255,255,.5);
}


/* =========================
   CONTADOR
========================= */

.gallery-counter,
.lightbox-counter{
    position:absolute;

    left:50%;

    z-index:8;

    padding:5px 9px;

    border-radius:20px;

    background:rgba(0,0,0,.55);

    color:#fff;

    font-size:9px;
    font-weight:bold;

    transform:translateX(-50%);
}

.gallery-counter{
    bottom:72px;
}

.swipe-hint{
    position:absolute;

    left:50%;
    bottom:48px;

    z-index:7;

    padding:4px 8px;

    border-radius:15px;

    background:rgba(0,0,0,.35);

    color:#ddd;

    font-size:8px;

    transform:translateX(-50%);

    opacity:.65;

    pointer-events:none;
}


/* =========================
   INFORMACIÓN
========================= */

.product-name,
.product-code{
    display:none;
}

.product-description{
    margin-top:4px;

    color:#999;

    font-size:12px;

    line-height:1.55;
}

.product-price{
    display:none;
}

.colors{
    display:none;
}

.variant-selector{
    display:none;
}

.label{
    display:none;
}


/* =========================
   TALLAS
========================= */

.sizes{
    display:flex;
    flex-wrap:wrap;

    gap:7px;

    margin-top:12px;
}

.size{
    min-width:43px;

    padding:9px 12px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:5px;

    color:#bbb;

    background:transparent;

    cursor:pointer;

    font-size:11px;
    font-weight:bold;
}

.size:hover{
    border-color:#fff;
}

.size.active{
    background:#fff;

    color:#111;

    border-color:#fff;
}


/* =========================
   CANTIDAD
========================= */

.quantity{
    display:flex;
    align-items:center;

    gap:14px;

    margin-top:16px;
}

.quantity button{
    width:36px;
    height:36px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:5px;

    background:#181818;

    color:#fff;

    cursor:pointer;

    font-size:18px;
}

.quantity span{
    min-width:25px;

    text-align:center;

    font-size:14px;
    font-weight:bold;
}


/* =========================
   ENVÍO
========================= */

.shipping{
    margin-top:15px;

    padding:11px 12px;

    border:1px solid rgba(255,177,72,.28);

    border-left:3px solid #f0a44b;

    border-radius:7px;

    background:rgba(240,164,75,.10);

    color:#f2c58f;

    font-size:11px;
    font-weight:bold;

    line-height:1.45;
}

.shipping strong{
    color:#fff;
}

.stock{
    margin-top:8px;

    color:#777;

    font-size:10px;
}

.stock.out{
    color:#ff8d8d;

    font-weight:bold;
}


/* =========================
   COMPRAR
========================= */

.buy{
    width:100%;

    margin-top:16px;

    padding:15px;

    border:0;

    border-radius:6px;

    background:#fff;

    color:#111;

    font-size:11px;
    font-weight:900;

    letter-spacing:1.5px;

    cursor:pointer;
}

.buy:hover{
    background:#ddd;
}

.buy:disabled{
    opacity:.45;

    cursor:not-allowed;
}


/* =========================
   ESTADOS
========================= */

.empty,
.loading{
    grid-column:1/-1;

    padding:100px 20px;

    text-align:center;

    color:#aaa;
}


/* =========================
   FOOTER
========================= */

footer{
    padding:35px 5%;

    border-top:1px solid rgba(255,255,255,.1);

    text-align:center;

    color:#777;

    font-size:10px;
}


/* =========================
   LIGHTBOX
========================= */

.image-lightbox{
    position:fixed;
    inset:0;

    z-index:10000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(0,0,0,.92);

    backdrop-filter:blur(12px);
}

.image-lightbox.show{
    display:flex;
}

.lightbox-content{
    position:relative;

    width:min(1100px,100%);

    height:min(90vh,900px);

    display:flex;

    align-items:center;
    justify-content:center;
}

.lightbox-image{
    max-width:100%;
    max-height:90vh;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:8px;
}

.lightbox-close{
    position:absolute;

    top:-10px;
    right:-10px;

    z-index:10;

    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:50%;

    background:rgba(0,0,0,.7);

    color:#fff;

    cursor:pointer;

    font-size:24px;
}

.lightbox-arrow{
    top:50%;

    width:48px;
    height:48px;

    font-size:22px;

    transform:translateY(-50%);
}

.lightbox-arrow.prev{
    left:10px;
}

.lightbox-arrow.next{
    right:10px;
}

.lightbox-counter{
    bottom:15px;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);

    max-height:calc(100vh - 40px);

    overflow-y:auto;

    padding:30px;

    border:1px solid rgba(255,255,255,.16);

    border-radius:15px;

    background:linear-gradient(145deg,#222,#111);
}

.modal-header{
    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.modal-header small{
    color:#999;

    font-size:10px;
    font-weight:bold;

    letter-spacing:3px;
}

.modal-header h2{
    margin-top:8px;

    font-size:28px;
}

.close-modal{
    width:40px;
    height:40px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:6px;

    background:#222;

    color:#fff;

    cursor:pointer;

    font-size:20px;
}

.order-summary{
    margin-bottom:25px;

    padding:16px;

    border:1px solid rgba(255,255,255,.10);

    border-radius:8px;

    background:rgba(255,255,255,.045);

    color:#aaa;

    font-size:12px;

    line-height:1.7;
}

.order-summary strong{
    color:#fff;
}

.form-title{
    margin:25px 0 15px;

    font-size:13px;

    font-weight:900;

    letter-spacing:1.5px;
}

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;
}

.form-field{
    margin-bottom:14px;
}

.form-field.full{
    grid-column:1/-1;
}

.form-field label{
    display:block;

    margin-bottom:7px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    letter-spacing:1px;

    text-transform:uppercase;
}

.form-field input,
.form-field textarea{
    width:100%;

    padding:14px;

    border:1px solid rgba(255,255,255,.16);

    border-radius:6px;

    outline:none;

    background:rgba(0,0,0,.35);

    color:#fff;

    font-size:14px;
}

.form-field input{
    min-height:48px;
}

.form-field textarea{
    min-height:100px;

    resize:vertical;
}

.form-error{
    display:none;

    margin-bottom:15px;

    padding:12px;

    border:1px solid rgba(255,255,255,.20);

    border-radius:6px;

    background:rgba(255,255,255,.06);

    color:#fff;

    font-size:11px;
}

.form-error.show{
    display:block;
}

.send-order{
    width:100%;

    margin-top:12px;

    padding:17px;

    border:0;

    border-radius:7px;

    background:#fff;

    color:#111;

    cursor:pointer;

    font-size:12px;
    font-weight:900;

    letter-spacing:1.2px;
}

.cancel-order{
    width:100%;

    margin-top:10px;

    padding:13px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:6px;

    background:transparent;

    color:#aaa;

    cursor:pointer;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    .products{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .product-gallery{
        height:330px;
    }

}

@media(max-width:850px){

    .products{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .hero,
    .products-section{
        width:92%;
    }

}

@media(max-width:600px){

    header{
        padding:15px;

        flex-wrap:wrap;

        gap:12px;
    }

    .logo{
        font-size:17px;

        letter-spacing:2.5px;
    }

    nav{
        order:3;

        flex-basis:100%;

        justify-content:flex-start;

        gap:8px;

        padding:3px 0 5px;

        overflow-x:auto;

        scroll-padding-left:0;
    }

    nav a{
        min-height:36px;

        padding:8px 12px;

        font-size:10px;

        letter-spacing:1.1px;
    }

    .hero{
        width:94%;

        padding:50px 0 38px;
    }

    .hero small{
        letter-spacing:3px;
        line-height:1.7;

        white-space:normal;
        word-break:normal;
        overflow-wrap:normal;
    }

    .hero h1{
        font-size:clamp(38px,12vw,55px);

        letter-spacing:-2px;
    }

    .hero p{
        font-size:13px;
    }

    .products-section{
        width:94%;
    }

    .products{
        display:flex;

        flex-direction:column;

        gap:18px;
    }

    .product{
        width:100%;

        padding:12px;
    }

    .product-gallery{
        height:min(115vw,430px);

        margin:-12px -12px 12px;
    }

    .product-image img,
    .product:hover .product-image img{
        transform:none;
    }

    .product-image-label{
        left:10px;
        right:10px;
        bottom:10px;

        padding:10px 12px;
    }

    .product-image-label-name{
        font-size:12px;
    }

    .product-image-label-price{
        font-size:13px;
    }

    .product-image-label-meta{
        margin-top:4px;

        font-size:8px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-field.full{
        grid-column:auto;
    }

    .modal{
        padding:0;

        align-items:flex-end;
    }

    .modal-box{
        width:100%;

        max-height:96vh;

        padding:22px 17px 25px;

        border-radius:18px 18px 0 0;
    }

}



/* =========================================================
   PREVISUALIZACIÓN · SOLO FOTOGRAFÍAS
========================================================= */

.preview-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:20px;
}

.preview-card{
    position:relative;
    min-width:0;
    aspect-ratio:3 / 4;
    overflow:hidden;
    padding:0;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:#171717;
    cursor:pointer;
    box-shadow:0 15px 45px rgba(0,0,0,.15);
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}

.preview-card:hover{
    transform:translateY(-4px);
    border-color:rgba(255,255,255,.28);
    box-shadow:0 22px 55px rgba(0,0,0,.28);
}

.preview-card img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transform:scale(1.01);
    transition:transform .45s ease;
}

.preview-card:hover img{
    transform:scale(1.055);
}

.preview-empty{
    grid-column:1/-1;
    padding:80px 20px;
    text-align:center;
    color:#999;
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    background:rgba(255,255,255,.04);
}

/* Panel de producto con el mismo lenguaje visual de la web */

.preview-modal .modal-box{
    width:min(1080px,100%);
    max-height:calc(100vh - 40px);
    padding:0;
    overflow:hidden;
}

.preview-product{
    display:grid;
    grid-template-columns:minmax(0,1.12fr) minmax(320px,.88fr);
    min-height:620px;
}

.preview-gallery{
    position:relative;
    min-height:620px;
    overflow:hidden;
    background:#171717;
}

.preview-gallery img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.preview-arrow{
    position:absolute;
    top:50%;
    z-index:4;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:50%;
    background:rgba(10,10,10,.72);
    color:#fff;
    font-size:30px;
    line-height:1;
    cursor:pointer;
    backdrop-filter:blur(10px);
}

.preview-arrow:hover{
    background:rgba(255,255,255,.16);
}

.preview-arrow.prev{left:16px}
.preview-arrow.next{right:16px}

.preview-counter{
    position:absolute;
    left:50%;
    bottom:16px;
    z-index:4;
    transform:translateX(-50%);
    padding:7px 11px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:20px;
    background:rgba(10,10,10,.72);
    color:#fff;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    backdrop-filter:blur(10px);
}

.preview-details{
    padding:34px;
    background:linear-gradient(145deg,#222,#111);
    overflow-y:auto;
}

.preview-details h2{
    margin:0 0 12px;
    font-size:28px;
}

.preview-description{
    color:#aaa;
    font-size:14px;
    line-height:1.65;
}

.preview-price{
    margin-top:20px;
    color:#fff;
    font-size:20px;
    font-weight:900;
}

.preview-label{
    margin-top:25px;
    color:#999;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
}

.preview-sizes{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.preview-size{
    min-width:42px;
    padding:10px 12px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:6px;
    background:#222;
    color:#fff;
    cursor:pointer;
}

.preview-size.active{
    border-color:#fff;
    background:#fff;
    color:#111;
}

.preview-quantity{
    display:flex;
    width:max-content;
    margin-top:10px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:6px;
    overflow:hidden;
}

.preview-quantity button,
.preview-quantity span{
    width:42px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:0;
    background:#222;
    color:#fff;
}

.preview-quantity button{
    cursor:pointer;
    font-size:20px;
}

.preview-buy{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:6px;
    background:#fff;
    color:#111;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.5px;
    cursor:pointer;
}

.preview-buy:hover{
    background:#ddd;
}

.preview-ref{
    margin-top:12px;
    color:#777;
    font-size:9px;
    letter-spacing:1px;
}

@media(max-width:1000px){
    .preview-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }
}

@media(max-width:760px){
    .preview-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .preview-product{
        grid-template-columns:1fr;
    }

    .preview-gallery{
        min-height:55vh;
    }

    .preview-details{
        padding:24px 18px 28px;
    }

    .preview-modal .modal-box{
        max-height:96vh;
        border-radius:18px 18px 0 0;
    }
}

@media(max-width:420px){
    .preview-grid{
        gap:8px;
    }
}

</style>
</head>

<body>

<header>
    <div class="logo">STRANGIS</div>

    <nav aria-label="Categorías">
        <a href="previsualizacion_categorias.html?categoria=bisuteria" data-category="bisuteria">Bisutería</a>
        <a href="previsualizacion_categorias.html?categoria=camisetas" data-category="camisetas">Camisetas</a>
        <a href="previsualizacion_categorias.html?categoria=conjuntos" data-category="conjuntos">Conjuntos</a>
        <a href="previsualizacion_categorias.html?categoria=gafas" data-category="gafas">Gafas</a>
        <a href="previsualizacion_categorias.html?categoria=gorras" data-category="gorras">Gorras</a>
        <a href="previsualizacion_categorias.html?categoria=pantalones" data-category="pantalones">Pantalones</a>
        <a href="previsualizacion_categorias.html?categoria=pedreria" data-category="pedreria">Pedrería</a>
        <a href="previsualizacion_categorias.html?categoria=zapatillas" data-category="zapatillas">Zapatillas</a>
    </nav>
</header>

<main>

<section class="hero">
    <small>STRANGIS · COLECCIÓN</small>
    <h1 id="categoryTitle">CAMISETAS</h1>
    <p id="categoryDescription">
        Descubre nuestra selección.
    </p>
</section>

<section class="products-section">
    <div id="products" class="preview-grid">
        <div class="preview-empty">Cargando productos...</div>
    </div>
</section>

</main>

<!-- =====================================================
     PANEL
===================================================== -->

<div id="productModal" class="modal preview-modal" aria-hidden="true">

    <div class="modal-box">

        <div class="preview-product">

            <div id="gallery" class="preview-gallery">

                <button
                    id="prev"
                    class="preview-arrow prev"
                    type="button"
                    aria-label="Imagen anterior"
                >‹</button>

                <img id="mainImage" src="" alt="">

                <button
                    id="next"
                    class="preview-arrow next"
                    type="button"
                    aria-label="Imagen siguiente"
                >›</button>

                <div id="counter" class="preview-counter">1 / 1</div>

            </div>

            <div class="preview-details">

                <div class="modal-header">
                    <div>
                        <small>STRANGIS · PRODUCTO</small>
                        <h2 id="productName">Producto</h2>
                    </div>

                    <button
                        id="closeModal"
                        class="close-modal"
                        type="button"
                        aria-label="Cerrar"
                    >×</button>
                </div>

                <div id="productDescription" class="preview-description"></div>

                <div id="productPrice" class="preview-price"></div>

                <div id="sizeArea">
                    <div class="preview-label">TALLA</div>
                    <div id="sizes" class="preview-sizes"></div>
                </div>

                <div class="preview-label">CANTIDAD</div>

                <div class="preview-quantity">
                    <button id="minus" type="button">−</button>
                    <span id="quantity">1</span>
                    <button id="plus" type="button">+</button>
                </div>

                <button id="buy" class="preview-buy" type="button">
                    COMPRAR
                </button>

                <div id="reference" class="preview-ref"></div>

            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
'use strict';

const SUPABASE_URL =
    "https://xbbjfatmdbxbuoqdrgoj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_M7ETdIWvj4nCQZ55i24Vpw_5Yc5Islk";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const CATEGORY_NAMES = {
    bisuteria: "BISUTERÍA",
    camisetas: "CAMISETAS",
    conjuntos: "CONJUNTOS",
    gafas: "GAFAS",
    gorras: "GORRAS",
    pantalones: "PANTALONES",
    pedreria: "PEDRERÍA",
    zapatillas: "ZAPATILLAS"
};

const params =
    new URLSearchParams(window.location.search);

const category =
    (params.get('categoria') || 'camisetas').toLowerCase();

const state = {
    products: [],
    productIndex: -1,
    images: [],
    imageIndex: 0,
    quantity: 1,
    size: null
};

const $ = id => document.getElementById(id);

function parseJSON(value, fallback = null) {
    if (value === null || value === undefined || value === '') return fallback;
    if (typeof value === 'object') return value;
    if (typeof value !== 'string') return fallback;

    try {
        return JSON.parse(value);
    } catch {
        return fallback;
    }
}

function escapeHTML(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function imageURL(value) {
    if (!value) return '';

    if (typeof value === 'object') {
        value =
            value.url ||
            value.src ||
            value.image ||
            value.path ||
            value.publicUrl ||
            '';
    }

    return typeof value === 'string'
        ? value.trim()
        : '';
}

/* =====================================================
   IMÁGENES
===================================================== */

function getImages(product) {

    let raw =
        product?.images ??
        product?.gallery ??
        product?.photos ??
        product?.image ??
        [];

    raw =
        parseJSON(raw, raw);

    if (Array.isArray(raw)) {

        const result = [];

        for (const item of raw) {

            if (typeof item === 'string') {

                const nested =
                    parseJSON(item, null);

                if (Array.isArray(nested)) {
                    result.push(...nested);
                } else {
                    result.push(item);
                }

            } else if (item && typeof item === 'object') {

                /*
                   Si la fila contiene variantes reales,
                   recogemos sus imágenes.
                */

                const nested =
                    item.images ??
                    item.gallery ??
                    item.photos;

                if (nested) {
                    const parsed =
                        parseJSON(nested, nested);

                    if (Array.isArray(parsed)) {
                        result.push(...parsed);
                    } else {
                        result.push(parsed);
                    }
                } else {
                    result.push(item);
                }
            }
        }

        return [...new Set(
            result
                .map(imageURL)
                .filter(Boolean)
        )];
    }

    const one = imageURL(raw);

    return one ? [one] : [];
}

/* =====================================================
   DATOS
===================================================== */

function getName(product) {
    return (
        product?.name ||
        product?.title ||
        product?.nombre ||
        'Producto'
    );
}

function getDescription(product) {
    return (
        product?.description ||
        product?.descripcion ||
        ''
    );
}

function getPrice(product) {
    return (
        product?.price ??
        product?.precio ??
        ''
    );
}

function getReference(product) {
    return (
        product?.reference ||
        product?.ref ||
        product?.sku ||
        ''
    );
}

function getSizes(product) {

    let raw =
        product?.sizes ??
        product?.tallas ??
        [];

    raw =
        parseJSON(raw, raw);

    if (Array.isArray(raw)) {

        return raw
            .map(item => {

                if (
                    item &&
                    typeof item === 'object'
                ) {
                    return (
                        item.name ||
                        item.size ||
                        item.talla ||
                        item.value ||
                        ''
                    );
                }

                return String(item);
            })
            .filter(Boolean);
    }

    if (typeof raw === 'string') {
        return raw
            .split(',')
            .map(x => x.trim())
            .filter(Boolean);
    }

    return [];
}

/* =====================================================
   TARJETAS · SOLO FOTO
===================================================== */

function renderCards() {

    const container =
        $('products');

    if (!state.products.length) {

        container.innerHTML =
            '<div class="preview-empty">No hay productos disponibles.</div>';

        return;
    }

    container.innerHTML =
        state.products
            .map((product, index) => {

                const images =
                    getImages(product);

                const image =
                    images[0] || '';

                return `
                    <button
                        class="preview-card"
                        type="button"
                        data-index="${index}"
                        aria-label="${escapeHTML(getName(product))}"
                    >
                        ${image
                            ? `<img
                                src="${escapeHTML(image)}"
                                alt="${escapeHTML(getName(product))}"
                                loading="lazy"
                                draggable="false"
                              >`
                            : ''
                        }
                    </button>
                `;
            })
            .join('');
}

/* =====================================================
   PANEL
===================================================== */

function openProduct(index) {

    const product =
        state.products[index];

    if (!product) return;

    state.productIndex = index;
    state.images = getImages(product);
    state.imageIndex = 0;
    state.quantity = 1;
    state.size = null;

    $('productName').textContent =
        getName(product);

    $('productDescription').textContent =
        getDescription(product);

    const price =
        getPrice(product);

    $('productPrice').textContent =
        price !== ''
            ? `${price} €`
            : '';

    const reference =
        getReference(product);

    $('reference').textContent =
        reference
            ? `REF: ${reference}`
            : '';

    renderSizes();
    updateGallery();
    updateQuantity();

    $('productModal').classList.add('show');
    $('productModal').setAttribute(
        'aria-hidden',
        'false'
    );

    document.body.style.overflow =
        'hidden';
}

function closeProduct() {

    $('productModal').classList.remove('show');

    $('productModal').setAttribute(
        'aria-hidden',
        'true'
    );

    document.body.style.overflow =
        '';
}

function updateGallery() {

    const images =
        state.images;

    const image =
        $('mainImage');

    if (!images.length) {

        image.removeAttribute('src');

        $('counter').textContent =
            '0 / 0';

        $('prev').style.display =
            'none';

        $('next').style.display =
            'none';

        return;
    }

    if (state.imageIndex < 0) {
        state.imageIndex =
            images.length - 1;
    }

    if (state.imageIndex >= images.length) {
        state.imageIndex = 0;
    }

    image.src =
        images[state.imageIndex];

    image.alt =
        getName(
            state.products[
                state.productIndex
            ]
        );

    $('counter').textContent =
        `${state.imageIndex + 1} / ${images.length}`;

    const display =
        images.length > 1
            ? 'block'
            : 'none';

    $('prev').style.display =
        display;

    $('next').style.display =
        display;
}

function changeImage(direction) {

    if (state.images.length <= 1) return;

    state.imageIndex += direction;

    updateGallery();
}

/* =====================================================
   TALLAS
===================================================== */

function renderSizes() {

    const sizes =
        getSizes(
            state.products[
                state.productIndex
            ]
        );

    const area =
        $('sizeArea');

    const list =
        $('sizes');

    if (!sizes.length) {

        area.style.display =
            'none';

        list.innerHTML =
            '';

        return;
    }

    area.style.display =
        'block';

    list.innerHTML =
        sizes
            .map(size => `
                <button
                    type="button"
                    class="preview-size ${state.size === size ? 'active' : ''}"
                    data-size="${escapeHTML(size)}"
                >
                    ${escapeHTML(size)}
                </button>
            `)
            .join('');
}

function updateQuantity() {
    $('quantity').textContent =
        state.quantity;
}

/* =====================================================
   COMPRA
===================================================== */

function buyProduct() {

    const product =
        state.products[
            state.productIndex
        ];

    if (!product) return;

    const message = [
        'Hola, quiero comprar:',
        `Producto: ${getName(product)}`,
        state.size
            ? `Talla: ${state.size}`
            : '',
        `Cantidad: ${state.quantity}`,
        getPrice(product) !== ''
            ? `Precio: ${getPrice(product)} €`
            : '',
        getReference(product)
            ? `Referencia: ${getReference(product)}`
            : ''
    ]
        .filter(Boolean)
        .join('\n');

    /*
       Mantén aquí el mismo número de WhatsApp
       que tengas actualmente en tu categoría
       funcional cuando integres esta página.
    */

    const phone =
        String(state.products[state.productIndex]?.whatsapp || '')
            .replace(/\D/g, '');

    if (!phone) {
        alert('Este producto no tiene configurado el WhatsApp.');
        return;
    }

    window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
        '_blank',
        'noopener'
    );
}

/* =====================================================
   SUPABASE
===================================================== */

async function loadProducts() {

    const container =
        $('products');

    try {

        const { data, error } =
            await supabaseClient
                .from('Products')
                .select('*')
                .eq('category', category)
                .eq('active', true);

        if (error) throw error;

        state.products =
            Array.isArray(data)
                ? data
                : [];

        renderCards();

    } catch (error) {

        console.error(
            'STRANGIS · Error:',
            error
        );

        container.innerHTML =
            '<div class="preview-empty">No se han podido cargar los productos.</div>';
    }
}

/* =====================================================
   EVENTOS
===================================================== */

document.addEventListener(
    'DOMContentLoaded',
    () => {

        $('categoryTitle').textContent =
            CATEGORY_NAMES[category] ||
            category.toUpperCase();

        $('categoryDescription').textContent =
            `Descubre nuestra selección de ${category}.`;

        document
            .querySelectorAll('[data-category]')
            .forEach(link => {

                link.classList.toggle(
                    'active',
                    link.dataset.category === category
                );
            });

        $('products').addEventListener(
            'click',
            event => {

                const card =
                    event.target.closest(
                        '[data-index]'
                    );

                if (!card) return;

                openProduct(
                    Number(card.dataset.index)
                );
            }
        );

        $('closeModal').addEventListener(
            'click',
            closeProduct
        );

        $('productModal').addEventListener(
            'click',
            event => {

                if (
                    event.target ===
                    $('productModal')
                ) {
                    closeProduct();
                }
            }
        );

        $('prev').addEventListener(
            'click',
            event => {

                event.stopPropagation();

                changeImage(-1);
            }
        );

        $('next').addEventListener(
            'click',
            event => {

                event.stopPropagation();

                changeImage(1);
            }
        );

        $('sizes').addEventListener(
            'click',
            event => {

                const button =
                    event.target.closest(
                        '[data-size]'
                    );

                if (!button) return;

                state.size =
                    button.dataset.size;

                renderSizes();
            }
        );

        $('minus').addEventListener(
            'click',
            () => {

                state.quantity =
                    Math.max(
                        1,
                        state.quantity - 1
                    );

                updateQuantity();
            }
        );

        $('plus').addEventListener(
            'click',
            () => {

                state.quantity++;

                updateQuantity();
            }
        );

        $('buy').addEventListener(
            'click',
            buyProduct
        );

        document.addEventListener(
            'keydown',
            event => {

                if (
                    event.key === 'Escape'
                ) {
                    closeProduct();
                }

                if (
                    $('productModal')
                        .classList
                        .contains('show')
                ) {

                    if (
                        event.key ===
                        'ArrowLeft'
                    ) {
                        changeImage(-1);
                    }

                    if (
                        event.key ===
                        'ArrowRight'
                    ) {
                        changeImage(1);
                    }
                }
            }
        );

        let startX = 0;

        $('gallery').addEventListener(
            'touchstart',
            event => {

                startX =
                    event.changedTouches[0]
                        .clientX;
            },
            { passive:true }
        );

        $('gallery').addEventListener(
            'touchend',
            event => {

                const delta =
                    event.changedTouches[0]
                        .clientX -
                    startX;

                if (
                    Math.abs(delta) >= 45
                ) {
                    changeImage(
                        delta < 0
                            ? 1
                            : -1
                    );
                }
            },
            { passive:true }
        );

        loadProducts();
    }
);
</script>

</body>
</html>
