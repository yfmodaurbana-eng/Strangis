```html

    .products{
        grid-template-columns:repeat(2,1fr);

}

        order:3;

        flex-basis:100%;

        justify-content:flex-start;
    }

    .hero{
        padding:60px 15px 40px;

    .hero h1{
        font-size:18vw;

        letter-spacing:-4px;

        padding:20px 12px 70px;
    }

    .products{
        gap:9px;
    }

    .product{
        padding:10px;
    }

    .product-image{

        font-size:10px;

}

</style>

</head>

<body>


<header>

    MI MARCA

<nav>

<a
    class="active"

>

</nav>

</header>


<section class="hero">

<small>
    COLECCIÓN
</small>

<h1>
    CAMISETAS
</h1>

<p>
    Camisetas urbanas seleccionadas para
    crear tus looks con personalidad.
</p>

</section>


<section class="products-section">

<div
    class="products"
    id="productsContainer"
></div>

</section>


<footer>

© 2026 MI MARCA · TODOS LOS DERECHOS RESERVADOS

</footer>


<script>


/* =========================================================
   🟢🟢🟢 PRODUCTOS DE CAMISETAS 🟢🟢🟢

   PEGA AQUÍ LOS CÓDIGOS QUE TE GENERE admin.html

   EJEMPLO:

   {
       ref: "CAM-001",

       name: "Camiseta Oversize",

       category: "camisetas",

       price: 29.90,

       stock: 10,

       description: "Camiseta urbana.",

       whatsapp: "34674559614",

       variants: [
           {
               name: "Negro",
               image: "https://tu-imagen.com/camiseta.jpg"
           },
           {
               name: "Blanco",
               image: "https://tu-imagen.com/camiseta-blanca.jpg"
           }
       ],

       sizes: [
           "S",
           "M",
           "L",
           "XL"
       ],

       shipping: {
           min: 3,
           max: 9
       }
   },

   ========================================================= */


const PRODUCTS = [

    // =====================================================
    // 🟢 PEGA AQUÍ EL CÓDIGO DEL PRODUCTO
    // 🟢 PUEDES PEGAR VARIOS PRODUCTOS, UNO DESPUÉS DE OTRO
    // =====================================================



    // =====================================================
    // 🔴 NO BORRES ESTAS LLAVES
    // =====================================================

];


const WHATSAPP_NUMBER =
    "34674559614";


function money(value){

    return Number(value).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


function renderProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );


    if(!PRODUCTS.length){

        container.innerHTML = `

            <div class="empty">

                Todavía no hay productos
                disponibles en esta categoría.

            </div>

        `;

        return;

    }


    container.innerHTML =
        PRODUCTS
        .map(
            (product,index) =>
                createProductHTML(
                    product,
                    index
                )
        )
        .join("");

}


function createProductHTML(
    product,
    index
){

    const firstVariant =
        product.variants &&
        product.variants.length
        ?
        product.variants[0]
        :
        {
            name:"Único",
            image:""
        };


    const sizes =
        product.sizes || [];


    const shipping =
        product.shipping ||
        {
            min:3,
            max:9
        };


    const productCode =
        product.ref ||
        product.id ||
        "";


    const whatsapp =
        product.whatsapp ||
        WHATSAPP_NUMBER;


    return `

    <article

        class="product"

        id="product-${index}"

        data-variant="0"

        data-size=""

        data-quantity="1"

    >


        <div class="product-image">

            <img

                id="image-${index}"

                src="${firstVariant.image}"

                alt="${product.name}"

                onerror="
                    this.style.display='none';
                "

            >

        </div>


        <div class="product-name">

            ${product.name}

        </div>


        <div class="product-code">

            CÓDIGO:
            ${productCode}

        </div>


        ${
            product.description
            ?
            `

            <div class="product-description">

                ${product.description}

            </div>

            `
            :
            ""
        }


        <div class="product-price">

            ${money(product.price)}

        </div>


        <div class="label">

            Color:

            <span
                id="color-name-${index}"
            >

                ${firstVariant.name}

            </span>

        </div>


        <div class="colors">

            ${
                (product.variants || [])
                .map(
                    (
                        variant,
                        variantIndex
                    ) => `

                    <button

                        class="
                            color
                            ${
                                variantIndex === 0
                                ?
                                "active"
                                :
                                ""
                            }
                        "

                        style="
                            background-image:
                            url('${variant.image}');
                        "

                        title="${variant.name}"

                        onclick="
                            selectColor(
                                ${index},
                                ${variantIndex}
                            )
                        "

                    ></button>

                    `
                )
                .join("")
            }

        </div>


        ${
            sizes.length
            ?
            `

            <div class="label">

                Talla

            </div>


            <div class="sizes">

                ${
                    sizes
                    .map(
                        size => `

                        <button

                            class="size"

                            onclick="
                                selectSize(
                                    ${index},
                                    '${String(size)
                                        .replace(/'/g,"\\'")
                                    }'
                                )
                            "

                        >

                            ${size}

                        </button>

                        `
                    )
                    .join("")
                }

            </div>

            `
            :
            ""
        }


        <div class="quantity">


            <button

                onclick="
                    changeQuantity(
                        ${index},
                        -1
                    )
                "

            >

                −

            </button>


            <span
                id="quantity-${index}"
            >

                1

            </span>


            <button

                onclick="
                    changeQuantity(
                        ${index},
                        1
                    )
                "

            >

                +

            </button>


        </div>


        <div class="shipping">

            🚚 Envío estimado:

            ${shipping.min}
            –
            ${shipping.max}

            días laborables

        </div>


        ${
            product.stock !== undefined
            ?
            `

            <div class="stock">

                Stock disponible:
                ${product.stock}

            </div>

            `
            :
            ""
        }


        <button

            class="buy"

            onclick="
                buyProduct(
                    ${index}
                )
            "

        >

            COMPRAR

        </button>


    </article>

    `;

}


function selectColor(
    productIndex,
    variantIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    const variant =
        product.variants[
            variantIndex
        ];


    document.getElementById(
        `image-${productIndex}`
    ).src =
        variant.image;


    document.getElementById(
        `color-name-${productIndex}`
    ).textContent =
        variant.name;


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    card.dataset.variant =
        variantIndex;


    card
        .querySelectorAll(
            ".color"
        )
        .forEach(
            (
                button,
                index
            ) => {

                button.classList.toggle(
                    "active",
                    index === variantIndex
                );

            }
        );

}


function selectSize(
    productIndex,
    size
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    card.dataset.size =
        size;


    card
        .querySelectorAll(
            ".size"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button
                    .textContent
                    .trim()
                    ===
                    size
                );

            }
        );

}


function changeQuantity(
    productIndex,
    change
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    let quantity =
        Number(
            card.dataset.quantity
        );


    quantity += change;


    if(quantity < 1){

        quantity = 1;

    }


    const product =
        PRODUCTS[
            productIndex
        ];


    if(
        product.stock !== undefined &&
        quantity > Number(product.stock)
    ){

        quantity =
            Number(product.stock);

    }


    card.dataset.quantity =
        quantity;


    document.getElementById(
        `quantity-${productIndex}`
    ).textContent =
        quantity;

}


function buyProduct(
    productIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    const variant =
        product.variants[
            Number(
                card.dataset.variant || 0
            )
        ];


    const size =
        card.dataset.size
        ||
        "No especificada";


    const quantity =
        Number(
            card.dataset.quantity
            ||
            1
        );


    const total =
        product.price
        *
        quantity;


    const shipping =
        product.shipping
        ||
        {
            min:3,
            max:9
        };


    const productCode =
        product.ref ||
        product.id ||
        "";


    const whatsapp =
        String(
            product.whatsapp ||
            WHATSAPP_NUMBER
        )
        .replace(/\D/g,"");


    const message = `

🛍️ NUEVO PEDIDO

━━━━━━━━━━━━━━━━

📦 PRODUCTO

Producto: ${product.name}

Código: ${productCode}

Color: ${variant.name}

Talla: ${size}

Cantidad: ${quantity}


💰 PRECIO

Precio unidad:
${money(product.price)}

Total:
${money(total)}


🚚 ENTREGA

${shipping.min}–${shipping.max}
días laborables


━━━━━━━━━━━━━━━━

👤 DATOS DEL CLIENTE

Nombre y apellidos:

Teléfono:

Email:


📍 DIRECCIÓN DE ENVÍO

Dirección:

Número:

Piso / Puerta:

Código postal:

Ciudad:

Provincia:

País:


📝 OBSERVACIONES:


━━━━━━━━━━━━━━━━

`;


    const whatsappURL =

        "https://wa.me/"

        +

        whatsapp

        +

        "?text="

        +

        encodeURIComponent(
            message
        );


    window.open(
        whatsappURL,
        "_blank"
    );

}


renderProducts();

</script>

</body>

</html>
```
