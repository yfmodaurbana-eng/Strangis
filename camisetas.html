<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camisetas | MI MARCA</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #181818 0%,
            #303030 38%,
            #555 65%,
            #292929 100%
        );
}


/* =====================================================
   CABECERA
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:18px 4%;

    display:flex;
    align-items:center;
    gap:30px;

    border-bottom:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(25,25,25,.92);

    backdrop-filter:
        blur(15px);
}

.logo{
    flex-shrink:0;

    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

nav{
    flex:1;

    display:flex;
    justify-content:center;
    gap:24px;

    overflow-x:auto;
    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#aaa;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;
    letter-spacing:1.5px;

    text-transform:uppercase;
    white-space:nowrap;

    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    padding:90px 5% 60px;
}

.hero small{
    color:#aaa;

    font-size:11px;
    font-weight:bold;
    letter-spacing:4px;
}

.hero h1{
    margin-top:18px;

    font-size:
        clamp(
            55px,
            10vw,
            110px
        );

    letter-spacing:-6px;
    line-height:.85;
}

.hero p{
    max-width:550px;

    margin-top:25px;

    color:#aaa;

    font-size:14px;
    line-height:1.7;
}


/* =====================================================
   PRODUCTOS
===================================================== */

.products-section{
    padding:20px 5% 100px;
}

.products{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.product{
    overflow:hidden;

    padding:15px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:8px;

    background:
        rgba(255,255,255,.05);
}


/* =====================================================
   IMAGEN
===================================================== */

.product-image{

    height:360px;

    margin:
        -15px
        -15px
        18px;

    background:#222;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;
}

.product-image img{

    width:100%;
    height:100%;

    object-fit:cover;

    transform:
        scale(1.08);

    transition:
        transform .35s ease,
        opacity .2s ease;
}

.product:hover
.product-image img{

    transform:
        scale(1.13);
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.product-name{
    font-size:16px;
    font-weight:bold;
    line-height:1.35;
}

.product-code{

    margin-top:7px;

    color:#888;

    font-size:10px;
    letter-spacing:1px;
}

.product-description{

    margin-top:10px;

    color:#aaa;

    font-size:12px;
    line-height:1.5;
}

.product-price{

    margin-top:13px;

    font-size:17px;
    font-weight:bold;
}


/* =====================================================
   COLOR
===================================================== */

.label{

    margin-top:17px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:1px;
}

.colors{

    display:flex;

    flex-wrap:wrap;

    gap:11px;

    margin-top:11px;
}

.color{

    width:42px;
    height:42px;

    border:
        2px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    cursor:pointer;

    padding:0;

    background-color:#222;

    background-repeat:no-repeat;

    background-size:cover;

    background-position:center;

    transition:
        transform .2s ease,
        border-color .2s ease;
}

.color:hover{

    transform:
        scale(1.10);

    border-color:
        rgba(255,255,255,.7);
}

.color.active{

    outline:
        2px solid
        white;

    outline-offset:2px;
}


/* =====================================================
   TALLAS
===================================================== */

.sizes{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:10px;
}

.size{

    min-width:42px;

    padding:
        9px 13px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:4px;

    color:#bbb;

    background:transparent;

    cursor:pointer;

    font-size:11px;
    font-weight:bold;

    transition:.2s;
}

.size:hover{

    border-color:
        rgba(255,255,255,.6);
}

.size.active{

    background:#fff;

    color:#111;
}


/* =====================================================
   CANTIDAD
===================================================== */

.quantity{

    display:flex;

    align-items:center;

    gap:14px;

    margin-top:18px;
}

.quantity button{

    width:36px;
    height:36px;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:4px;

    background:#191919;

    color:#fff;

    cursor:pointer;

    font-size:18px;
}

.quantity span{

    min-width:25px;

    text-align:center;

    font-size:14px;
    font-weight:bold;
}


/* =====================================================
   ENVÍO / STOCK
===================================================== */

.shipping{

    margin-top:16px;

    color:#aaa;

    font-size:11px;
    line-height:1.5;
}

.stock{

    margin-top:8px;

    color:#888;

    font-size:10px;
}


/* =====================================================
   BOTÓN COMPRAR
===================================================== */

.buy{

    width:100%;

    margin-top:17px;

    padding:16px;

    border:0;

    border-radius:4px;

    background:#fff;

    color:#111;

    font-size:11px;

    font-weight:bold;

    letter-spacing:1.5px;

    cursor:pointer;

    transition:.2s;
}

.buy:hover{

    background:#ddd;

}


/* =====================================================
   SIN PRODUCTOS
===================================================== */

.empty{

    grid-column:
        1 / -1;

    padding:80px 20px;

    text-align:center;

    color:#999;

    font-size:14px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    padding:
        35px 5%;

    border-top:
        1px solid
        rgba(255,255,255,.1);

    text-align:center;

    color:#888;

    font-size:10px;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1000px){

    .products{

        grid-template-columns:
            repeat(2,1fr);

    }

}


/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:650px){

    header{

        flex-wrap:wrap;

        padding:
            15px 14px
            10px;

        gap:12px;

    }

    .logo{

        font-size:18px;

        letter-spacing:2px;

    }

    nav{

        order:3;

        flex-basis:100%;

        justify-content:flex-start;

        gap:20px;

        padding-bottom:3px;

    }

    nav a{

        font-size:11px;

    }

    .hero{

        padding:
            55px 16px
            40px;

    }

    .hero small{

        font-size:11px;

    }

    .hero h1{

        font-size:17vw;

        letter-spacing:-4px;

    }

    .hero p{

        font-size:13px;

        line-height:1.65;

    }

    .products-section{

        padding:
            15px 12px
            70px;

    }

    .products{

        gap:10px;

    }

    .product{

        padding:11px;

        border-radius:7px;

    }

    /* IMAGEN */

    .product-image{

        height:260px;

        margin:
            -11px
            -11px
            14px;

    }

    .product-image img{

        transform:
            scale(1.06);

    }

    .product:hover
    .product-image img{

        transform:
            scale(1.08);

    }

    .product-name{

        font-size:13px;

        line-height:1.3;

    }

    .product-code{

        font-size:9px;

    }

    .product-description{

        font-size:11px;

    }

    .product-price{

        font-size:14px;

    }

    .label{

        font-size:10px;

        margin-top:15px;

    }

    .colors{

        gap:9px;

    }

    .color{

        width:39px;
        height:39px;

    }

    .sizes{

        gap:6px;

    }

    .size{

        min-width:40px;

        padding:
            9px 11px;

        font-size:11px;

    }

    .quantity{

        gap:12px;

    }

    .quantity button{

        width:36px;
        height:36px;

    }

    .quantity span{

        font-size:13px;

    }

    .shipping{

        font-size:10px;

    }

    .stock{

        font-size:10px;

    }

    .buy{

        padding:15px;

        font-size:10px;

    }

}


/* =====================================================
   MÓVIL MUY PEQUEÑO
===================================================== */

@media(max-width:380px){

    .products{

        grid-template-columns:
            1fr;

        gap:14px;

    }

    .product-image{

        height:330px;

    }

    .product-name{

        font-size:15px;

    }

    .product-price{

        font-size:16px;

    }

    .color{

        width:42px;
        height:42px;

    }

    .size{

        padding:
            10px 14px;

    }

}

</style>

</head>

<script>


/* =====================================================
   PRODUCTOS
===================================================== */

const PRODUCTS = [

    whatsapp: "34674559614",

        {

        },
        {

        },
        {

        },
        {

            image: "https://i.imgur.com/b2mzD9q.jpeg"
        },
        {
            name: "Amarillo",
            image: "https://i.imgur.com/vBWs12d.jpeg"
        },
        {
            name: "Morado",
            image: "https://i.imgur.com/FIiz38t.jpeg"
        },
        {
            name: "Marrón",
            image: "https://i.imgur.com/kWzmzj8.jpeg"
        }
    ],

    sizes: [
        "S",
        "M",
        "L",
        "XL"
    ],

    shipping: {
        min: 20,
        max: 30
    }
},


/* =====================================================
   ------------------ PRÓXIMO PRODUCTO ------------------
===================================================== */



/* =====================================================
   ------------------ PRÓXIMO PRODUCTO ------------------
===================================================== */



/* =====================================================
   ------------------ PRÓXIMO PRODUCTO ------------------
===================================================== */



/* =====================================================
   ------------------ PRÓXIMO PRODUCTO ------------------
===================================================== */



/* =====================================================
   ------------------ PRÓXIMO PRODUCTO ------------------
===================================================== */



];


/* =====================================================
   FORMATO DE PRECIO
===================================================== */

function money(value){

    return Number(value).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


/* =====================================================
   MOSTRAR PRODUCTOS
===================================================== */

function renderProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );


    if(!Array.isArray(PRODUCTS)
        || !PRODUCTS.length){

        container.innerHTML = `

            <div class="empty">

                Todavía no hay productos
                disponibles en esta categoría.

            </div>

        `;

        return;

    }


    container.innerHTML =
        PRODUCTS
        .map(
            (product,index) =>
                createProductHTML(
                    product,
                    index
                )
        )
        .join("");

}


/* =====================================================
   CREAR TARJETA
===================================================== */

function createProductHTML(
    product,
    index
){

    const variants =
        Array.isArray(product.variants)
        ?
        product.variants
        :
        [];


    const firstVariant =
        variants[0];


    if(!firstVariant){

        return "";

    }


    const sizes =
        Array.isArray(product.sizes)
        ?
        product.sizes
        :
        [];


    const shipping =
        product.shipping || {

            min:3,
            max:9

        };


    return `

    <article

        class="product"

        id="product-${index}"

        data-variant="0"

        data-size=""

        data-quantity="1"

    >


        <div class="product-image">

            <img

                id="image-${index}"

                src="${escapeAttribute(firstVariant.image)}"

                alt="${escapeHTML(product.name)}"

                loading="lazy"

                onerror="imageError(this)"

            >

        </div>


        <div class="product-name">

            ${escapeHTML(product.name)}

        </div>


        <div class="product-code">

            REF:

            ${escapeHTML(
                product.ref ||
                product.id ||
                ""
            )}

        </div>


        ${
            product.description
            ?
            `

            <div class="product-description">

                ${escapeHTML(
                    product.description
                )}

            </div>

            `
            :
            ""
        }


        <div class="product-price">

            ${money(product.price)}

        </div>


        <div class="label">

            Color:

            <span
                id="color-name-${index}"
            >

                ${escapeHTML(
                    firstVariant.name
                )}

            </span>

        </div>


        <div class="colors">

            ${
                variants
                .map(
                    (
                        variant,
                        variantIndex
                    ) => `

                    <button

                        type="button"

                        class="
                            color
                            ${
                                variantIndex === 0
                                ?
                                "active"
                                :
                                ""
                            }
                        "

                        style="
                            background-image:
                            url('${escapeAttribute(
                                variant.image
                            )}');
                        "

                        title="${escapeAttribute(
                            variant.name
                        )}"

                        aria-label="${escapeAttribute(
                            variant.name
                        )}"

                        onclick="
                            selectColor(
                                ${index},
                                ${variantIndex}
                            )
                        "

                    ></button>

                    `
                )
                .join("")
            }

        </div>


        ${
            sizes.length
            ?
            `

            <div class="label">

                Talla

            </div>


            <div class="sizes">

                ${
                    sizes
                    .map(
                        (
                            size,
                            sizeIndex
                        ) => `

                        <button

                            type="button"

                            class="size"

                            onclick="
                                selectSize(
                                    ${index},
                                    ${sizeIndex}
                                )
                            "

                        >

                            ${escapeHTML(
                                size
                            )}

                        </button>

                        `
                    )
                    .join("")
                }

            </div>

            `
            :
            ""
        }


        <div class="quantity">

            <button

                type="button"

                onclick="
                    changeQuantity(
                        ${index},
                        -1
                    )
                "

            >

                −

            </button>


            <span
                id="quantity-${index}"
            >

                1

            </span>


            <button

                type="button"

                onclick="
                    changeQuantity(
                        ${index},
                        1
                    )
                "

            >

                +

            </button>

        </div>


        <div class="shipping">

            🚚 Envío estimado:

            ${shipping.min}
            –
            ${shipping.max}

            días laborables

        </div>


        ${
            product.stock !== undefined
            ?
            `

            <div class="stock">

                Stock disponible:

                ${escapeHTML(
                    product.stock
                )}

            </div>

            `
            :
            ""
        }


        <button

            type="button"

            class="buy"

            onclick="
                buyProduct(
                    ${index}
                )
            "

        >

            COMPRAR

        </button>


    </article>

    `;

}


/* =====================================================
   CAMBIAR COLOR
===================================================== */

function selectColor(
    productIndex,
    variantIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    if(
        !product ||
        !Array.isArray(
            product.variants
        )
    ){

        return;

    }


    const variant =
        product.variants[
            variantIndex
        ];


    if(!variant){

        return;

    }


    const image =
        document.getElementById(
            `image-${productIndex}`
        );


    if(image){

        image.style.display =
            "block";

        image.src =
            variant.image;

        image.alt =
            product.name +
            " - " +
            variant.name;

    }


    const colorName =
        document.getElementById(
            `color-name-${productIndex}`
        );


    if(colorName){

        colorName.textContent =
            variant.name;

    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;

    }


    card.dataset.variant =
        variantIndex;


    card
        .querySelectorAll(
            ".color"
        )
        .forEach(
            (
                button,
                buttonIndex
            ) => {

                button.classList.toggle(
                    "active",
                    buttonIndex ===
                    variantIndex
                );

            }
        );

}


/* =====================================================
   CAMBIAR TALLA
===================================================== */

function selectSize(
    productIndex,
    sizeIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    if(
        !product ||
        !Array.isArray(
            product.sizes
        )
    ){

        return;

    }


    const size =
        product.sizes[
            sizeIndex
        ];


    if(size === undefined){

        return;

    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;

    }


    card.dataset.size =
        size;


    card
        .querySelectorAll(
            ".size"
        )
        .forEach(
            (
                button,
                buttonIndex
            ) => {

                button.classList.toggle(
                    "active",
                    buttonIndex ===
                    sizeIndex
                );

            }
        );

}


/* =====================================================
   CANTIDAD
===================================================== */

function changeQuantity(
    productIndex,
    change
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;

    }


    let quantity =
        Number(
            card.dataset.quantity
        );


    quantity += change;


    if(quantity < 1){

        quantity = 1;

    }


    const product =
        PRODUCTS[
            productIndex
        ];


    if(
        Number.isFinite(
            Number(product.stock)
        )
        &&
        Number(product.stock) > 0
        &&
        quantity >
        Number(product.stock)
    ){

        quantity =
            Number(product.stock);

    }


    card.dataset.quantity =
        quantity;


    const quantityElement =
        document.getElementById(
            `quantity-${productIndex}`
        );


    if(quantityElement){

        quantityElement.textContent =
            quantity;

    }

}


/* =====================================================
   COMPRAR POR WHATSAPP
===================================================== */

function buyProduct(
    productIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!product || !card){

        return;

    }


    const variant =
        product.variants[
            Number(
                card.dataset.variant ||
                0
            )
        ];


    const size =
        card.dataset.size
        ||
        "No especificada";


    const quantity =
        Number(
            card.dataset.quantity
            ||
            1
        );


    const total =
        Number(product.price)
        *
        quantity;


    const shipping =
        product.shipping
        ||
        {
            min:3,
            max:9
        };


    const whatsapp =
        String(
            product.whatsapp
            ||
            ""
        ).replace(
            /\D/g,
            ""
        );


    if(!whatsapp){

        alert(
            "Este producto no tiene un número de WhatsApp configurado."
        );

        return;

    }


    const message = `

🛍️ NUEVO PEDIDO

━━━━━━━━━━━━━━━━

📦 PRODUCTO

Producto: ${product.name}

REF: ${product.ref || product.id || ""}

Color: ${variant.name}

Talla: ${size}

Cantidad: ${quantity}

💰 PRECIO

Precio unidad:
${money(product.price)}

Total:
${money(total)}

🚚 ENTREGA

${shipping.min}–${shipping.max}
días laborables

━━━━━━━━━━━━━━━━

👤 DATOS DEL CLIENTE

Nombre y apellidos:

Teléfono:

Email:

📍 DIRECCIÓN DE ENVÍO

Dirección:

Número:

Piso / Puerta:

Código postal:

Ciudad:

Provincia:

País:

📝 OBSERVACIONES:

━━━━━━━━━━━━━━━━

`;


    const whatsappURL =
        "https://wa.me/"
        +
        whatsapp
        +
        "?text="
        +
        encodeURIComponent(
            message
        );


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* =====================================================
   ERROR DE IMAGEN
===================================================== */

function imageError(image){

    image.style.display =
        "none";

}


/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "%3C"
    )
    .replace(
        />/g,
        "%3E"
    );

}


/* =====================================================
   INICIAR CATÁLOGO
===================================================== */

renderProducts();
