<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Camisetas | Strangis</title>

<style>

/* =====================================================
   RESET / BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #151515 0%,
            #292929 38%,
            #4d4d4d 65%,
            #222 100%
        );
}

button,
input,
textarea{
    font:inherit;
}


/* =====================================================
   CABECERA
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:18px 5%;

    display:flex;
    align-items:center;
    gap:30px;

    border-bottom:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(20,20,20,.92);

    backdrop-filter:blur(18px);
}

.logo{
    flex-shrink:0;

    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

nav{
    flex:1;

    display:flex;
    justify-content:center;
    gap:28px;

    overflow-x:auto;

    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#999;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;
    letter-spacing:1.5px;

    text-transform:uppercase;
    white-space:nowrap;

    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    width:min(1400px,90%);

    margin:auto;

    padding:
        clamp(65px,9vw,110px)
        0
        clamp(45px,6vw,75px);
}

.hero small{
    color:#aaa;

    font-size:11px;
    font-weight:bold;

    letter-spacing:5px;
}

.hero h1{
    margin-top:18px;

    font-size:
        clamp(
            58px,
            10vw,
            125px
        );

    letter-spacing:-7px;

    line-height:.85;
}

.hero p{
    max-width:600px;

    margin-top:28px;

    color:#aaa;

    font-size:15px;

    line-height:1.7;
}


/* =====================================================
   PRODUCTOS
===================================================== */

.products-section{
    width:min(1400px,90%);

    margin:auto;

    padding:
        10px 0 100px;
}

.products{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:20px;
}


/* =====================================================
   CARTA PRODUCTO
===================================================== */

.product{
    min-width:0;

    overflow:hidden;

    padding:16px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.15);

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.product:hover{
    transform:translateY(-4px);

    border-color:
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.075);
}


/* =====================================================
   GALERÍA
===================================================== */

.product-gallery{
    position:relative;

    height:390px;

    margin:
        -16px
        -16px
        20px;

    overflow:hidden;

    background:#171717;

    touch-action:pan-y;
}

.product-image{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:zoom-in;

    user-select:none;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.04);

    transition:
        transform .35s ease,
        opacity .2s ease;
}

.product:hover
.product-image img{
    transform:scale(1.08);
}


/* =====================================================
   FLECHAS
===================================================== */

.gallery-arrow{
    position:absolute;

    top:50%;

    z-index:5;

    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    background:
        rgba(0,0,0,.48);

    color:#fff;

    cursor:pointer;

    transform:
        translateY(-50%);

    opacity:.75;

    transition:
        opacity .2s,
        background .2s,
        transform .2s;
}

.gallery-arrow:hover{
    opacity:1;

    background:
        rgba(0,0,0,.75);
}

.gallery-arrow.prev{
    left:12px;
}

.gallery-arrow.next{
    right:12px;
}


/* =====================================================
   CONTADOR
===================================================== */

.gallery-counter{
    position:absolute;

    left:50%;
    bottom:12px;

    z-index:5;

    padding:
        6px 10px;

    border-radius:20px;

    background:
        rgba(0,0,0,.55);

    color:#fff;

    font-size:10px;
    font-weight:bold;

    transform:
        translateX(-50%);

    pointer-events:none;

    backdrop-filter:blur(5px);
}

.swipe-hint{
    position:absolute;

    left:50%;
    bottom:42px;

    z-index:4;

    padding:
        5px 9px;

    border-radius:15px;

    background:
        rgba(0,0,0,.42);

    color:#ddd;

    font-size:9px;

    transform:
        translateX(-50%);

    opacity:.8;

    pointer-events:none;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.product-name{
    font-size:16px;
    font-weight:800;

    line-height:1.35;
}

.product-code{
    margin-top:7px;

    color:#777;

    font-size:10px;

    letter-spacing:1.2px;
}

.product-description{
    margin-top:10px;

    color:#999;

    font-size:12px;

    line-height:1.55;
}

.product-price{
    margin-top:14px;

    font-size:17px;
    font-weight:800;
}

.label{
    margin-top:18px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:1.2px;
}

.label span{
    color:#fff;
}


/* =====================================================
   COLORES
===================================================== */

.colors{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:11px;
}

.color{
    width:42px;
    height:42px;

    flex:0 0 42px;

    border:
        2px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    cursor:pointer;

    background-color:#222;

    background-repeat:no-repeat;

    background-size:cover;

    background-position:center;

    transition:
        transform .2s ease,
        border-color .2s ease;
}

.color:hover{
    transform:scale(1.08);

    border-color:#fff;
}

.color.active{
    outline:
        2px solid
        #fff;

    outline-offset:3px;
}


/* =====================================================
   TALLAS
===================================================== */

.sizes{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:11px;
}

.size{
    min-width:43px;

    padding:
        9px 12px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:5px;

    color:#bbb;

    background:transparent;

    cursor:pointer;

    font-size:11px;
    font-weight:bold;

    transition:.2s;
}

.size:hover{
    border-color:#fff;
}

.size.active{
    background:#fff;

    color:#111;

    border-color:#fff;
}


/* =====================================================
   CANTIDAD
===================================================== */

.quantity{
    display:flex;

    align-items:center;

    gap:14px;

    margin-top:18px;
}

.quantity button{
    width:36px;
    height:36px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:5px;

    background:#181818;

    color:#fff;

    cursor:pointer;

    font-size:18px;
}

.quantity button:hover{
    background:#333;
}

.quantity span{
    min-width:25px;

    text-align:center;

    font-size:14px;
    font-weight:bold;
}


/* =====================================================
   ENVÍO
===================================================== */

.shipping{
    margin-top:17px;

    padding:
        11px 12px;

    border:
        1px solid
        rgba(255,177,72,.28);

    border-left:
        3px solid
        #f0a44b;

    border-radius:7px;

    background:
        rgba(240,164,75,.10);

    color:#f2c58f;

    font-size:11px;
    font-weight:bold;

    line-height:1.45;
}

.shipping strong{
    color:#fff;
}


/* =====================================================
   STOCK
===================================================== */

.stock{
    margin-top:8px;

    color:#777;

    font-size:10px;
}


/* =====================================================
   COMPRAR
===================================================== */

.buy{
    width:100%;

    margin-top:18px;

    padding:16px;

    border:0;

    border-radius:6px;

    background:#fff;

    color:#111;

    font-size:11px;
    font-weight:900;

    letter-spacing:1.5px;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.buy:hover{
    background:#ddd;

    transform:translateY(-1px);
}

.buy:active{
    transform:scale(.98);
}


/* =====================================================
   SIN PRODUCTOS
===================================================== */

.empty{
    grid-column:1 / -1;

    padding:100px 20px;

    text-align:center;

    color:#888;

    font-size:14px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:
        35px 5%;

    border-top:
        1px solid
        rgba(255,255,255,.1);

    text-align:center;

    color:#777;

    font-size:10px;
}


/* =====================================================
   LIGHTBOX
===================================================== */

.image-lightbox{
    position:fixed;

    inset:0;

    z-index:10000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(0,0,0,.92);

    backdrop-filter:
        blur(12px);
}

.image-lightbox.show{
    display:flex;
}

.lightbox-content{
    position:relative;

    width:min(1100px,100%);

    height:min(90vh,900px);

    display:flex;

    align-items:center;
    justify-content:center;
}

.lightbox-image{
    max-width:100%;
    max-height:90vh;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:8px;

    user-select:none;

    cursor:zoom-out;
}

.lightbox-close{
    position:absolute;

    top:-10px;
    right:-10px;

    z-index:10;

    width:44px;
    height:44px;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    background:
        rgba(0,0,0,.7);

    color:#fff;

    cursor:pointer;

    font-size:24px;
}

.lightbox-arrow{
    position:absolute;

    top:50%;

    z-index:10;

    width:48px;
    height:48px;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:50%;

    background:
        rgba(0,0,0,.65);

    color:#fff;

    cursor:pointer;

    font-size:22px;

    transform:
        translateY(-50%);
}

.lightbox-arrow.prev{
    left:10px;
}

.lightbox-arrow.next{
    right:10px;
}

.lightbox-counter{
    position:absolute;

    left:50%;
    bottom:10px;

    padding:
        7px 12px;

    border-radius:20px;

    background:
        rgba(0,0,0,.65);

    color:#fff;

    font-size:11px;

    transform:
        translateX(-50%);
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);

    max-height:
        calc(100vh - 40px);

    overflow-y:auto;

    padding:30px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #222,
            #111
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
}

.modal-header{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.modal-header small{
    color:#999;

    font-size:10px;
    font-weight:bold;

    letter-spacing:3px;
}

.modal-header h2{
    margin-top:8px;

    font-size:28px;

    letter-spacing:-1px;
}

.close-modal{
    flex:0 0 auto;

    width:40px;
    height:40px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:6px;

    background:#222;

    color:#fff;

    cursor:pointer;

    font-size:20px;
}

.close-modal:hover{
    background:#333;
}


/* =====================================================
   RESUMEN
===================================================== */

.order-summary{
    margin-bottom:25px;

    padding:16px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:8px;

    background:
        rgba(255,255,255,.045);

    color:#aaa;

    font-size:12px;

    line-height:1.7;
}

.order-summary strong{
    color:#fff;
}


/* =====================================================
   FORMULARIO
===================================================== */

.form-title{
    margin:
        25px 0 15px;

    color:#fff;

    font-size:13px;
    font-weight:900;

    letter-spacing:1.5px;
}

.form-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;
}

.form-field{
    margin-bottom:14px;
}

.form-field.full{
    grid-column:
        1 / -1;
}

.form-field label{
    display:block;

    margin-bottom:7px;

    color:#aaa;

    font-size:10px;
    font-weight:bold;

    letter-spacing:1px;

    text-transform:uppercase;
}

.form-field input,
.form-field textarea{
    width:100%;

    padding:14px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:6px;

    outline:none;

    background:
        rgba(0,0,0,.35);

    color:#fff;

    font-size:14px;

    transition:
        border-color .2s,
        background .2s;
}

.form-field input{
    min-height:48px;
}

.form-field textarea{
    min-height:100px;

    resize:vertical;
}

.form-field input:focus,
.form-field textarea:focus{
    border-color:#fff;

    background:
        rgba(0,0,0,.5);
}

.form-field input::placeholder,
.form-field textarea::placeholder{
    color:#666;
}


/* =====================================================
   BOTONES PEDIDO
===================================================== */

.send-order{
    width:100%;

    margin-top:12px;

    padding:17px;

    border:0;

    border-radius:7px;

    background:#fff;

    color:#111;

    cursor:pointer;

    font-size:12px;
    font-weight:900;

    letter-spacing:1.2px;

    transition:.2s;
}

.send-order:hover{
    background:#ddd;

    transform:translateY(-1px);
}

.cancel-order{
    width:100%;

    margin-top:10px;

    padding:13px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:6px;

    background:transparent;

    color:#aaa;

    cursor:pointer;

    font-size:10px;
    font-weight:bold;
}

.cancel-order:hover{
    color:#fff;

    border-color:#fff;
}


/* =====================================================
   ERROR
===================================================== */

.form-error{
    display:none;

    margin-bottom:15px;

    padding:12px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:6px;

    background:
        rgba(255,255,255,.06);

    color:#fff;

    font-size:11px;

    line-height:1.5;
}

.form-error.show{
    display:block;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1100px){

    .products{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .product-gallery{
        height:330px;
    }

}


/* =====================================================
   TABLET PEQUEÑA
===================================================== */

@media(max-width:850px){

    .products{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .hero{
        width:92%;
    }

    .products-section{
        width:92%;
    }

}


/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:600px){

    header{
        padding:15px;

        flex-wrap:wrap;

        gap:14px;
    }

    .logo{
        font-size:17px;

        letter-spacing:2.5px;
    }

    nav{
        order:3;

        flex-basis:100%;

        justify-content:flex-start;

        gap:22px;
    }

    nav a{
        font-size:10px;
    }

    .hero{
        width:94%;

        padding:
            50px 0 38px;
    }

    .hero small{
        font-size:9px;

        letter-spacing:3px;
    }

    .hero h1{
        margin-top:15px;

        font-size:
            clamp(
                48px,
                16vw,
                76px
            );

        letter-spacing:-5px;
    }

    .hero p{
        margin-top:22px;

        font-size:13px;
    }

    .products-section{
        width:94%;

        padding-bottom:70px;
    }

    .products{
        display:flex;

        flex-direction:column;

        gap:18px;
    }

    .product{
        width:100%;

        padding:12px;

        border-radius:10px;
    }

    .product:hover{
        transform:none;
    }

    .product-gallery{
        height:
            min(
                115vw,
                430px
            );

        margin:
            -12px
            -12px
            15px;
    }

    .product-image img{
        transform:none;
    }

    .product:hover
    .product-image img{
        transform:none;
    }

    .gallery-arrow{
        width:38px;
        height:38px;
    }

    .product-name{
        font-size:14px;
    }

    .product-code{
        font-size:8px;
    }

    .product-description{
        font-size:11px;
    }

    .product-price{
        font-size:15px;
    }

    .label{
        margin-top:15px;

        font-size:9px;
    }

    .colors{
        gap:8px;
    }

    .color{
        width:38px;
        height:38px;

        flex-basis:38px;
    }

    .sizes{
        gap:5px;
    }

    .size{
        min-width:36px;

        padding:
            8px 9px;

        font-size:10px;
    }

    .quantity{
        gap:10px;

        margin-top:14px;
    }

    .quantity button{
        width:34px;
        height:34px;

        font-size:16px;
    }

    .quantity span{
        font-size:12px;
    }

    .shipping{
        font-size:10px;

        padding:
            10px 11px;
    }

    .stock{
        font-size:9px;
    }

    .buy{
        padding:15px;

        font-size:10px;
    }

    .image-lightbox{
        padding:10px;
    }

    .lightbox-content{
        width:100%;
        height:100%;
    }

    .lightbox-image{
        max-width:100%;
        max-height:85vh;
    }

    .lightbox-close{
        top:8px;
        right:8px;
    }

    .lightbox-arrow{
        width:42px;
        height:42px;
    }

    .lightbox-arrow.prev{
        left:5px;
    }

    .lightbox-arrow.next{
        right:5px;
    }

    .modal{
        padding:0;

        align-items:flex-end;
    }

    .modal-box{
        width:100%;

        max-height:96vh;

        padding:
            22px
            17px
            25px;

        border-radius:
            18px
            18px
            0
            0;
    }

    .modal-header h2{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;

        gap:0;
    }

    .form-field.full{
        grid-column:auto;
    }

    .form-field{
        margin-bottom:13px;
    }

    .form-field label{
        font-size:9px;
    }

    .form-field input,
    .form-field textarea{
        padding:14px;

        font-size:16px;
    }

    .send-order{
        padding:17px;

        font-size:11px;
    }

}


/* =====================================================
   MÓVIL MUY PEQUEÑO
===================================================== */

@media(max-width:380px){

    .product-gallery{
        height:330px;
    }

    .hero h1{
        font-size:18vw;
    }

}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        scroll-behavior:auto !important;

        transition:none !important;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
    Strangis
</div>

<nav>

<a href="index.html">
    Inicio
</a>

<a class="active" href="camisetas.html">
    Camisetas
</a>

<a href="pantalones.html">
    Pantalones
</a>

<a href="conjuntos.html">
    Conjuntos
</a>

<a href="gorras.html">
    Gorras
</a>

<a href="gafas.html">
    Gafas
</a>

<a href="bisuteria.html">
    Bisutería
</a>

</nav>

</header>


<section class="hero">

<small>
    COLECCIÓN
</small>

<h1>
    CAMISETAS
</h1>

<p>
    Camisetas seleccionadas para crear tus looks con personalidad.
</p>

</section>


<section class="products-section">

function money(value){

    return Number(value).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPAR ATRIBUTO
===================================================== */

function escapeAttribute(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;")
        .replace(/</g,"%3C")
        .replace(/>/g,"%3E");

}


/* =====================================================
   CARGAR PRODUCTOS DESDE SUPABASE
===================================================== */

async function loadProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );


    container.innerHTML = `
        <div class="empty">
            Cargando productos...
        </div>
    `;


    const { data, error } =
        await supabaseClient
            .from("Products")
            .select("*")
            .eq("category","camisetas")
            .eq("active",true)
            .order("id",{
                ascending:true
            });


    if(error){

        console.error(
            "Error cargando Products:",
            error
        );


        container.innerHTML = `
            <div class="empty">
                Error al cargar los productos.
                <br><br>
                Revisa la consola del navegador.
            </div>
        `;

        return;
    }


    PRODUCTS =
        (data || [])
        .map(product => {

            let variants = [];

            let sizes = [];


            if(
                Array.isArray(
                    product.images
                )
            ){

                variants =
                    product.images;

            }


            if(
                Array.isArray(
                    product.sizes
                )
            ){

                sizes =
                    product.sizes;

            }


            return {

                id:
                    product.id,

                ref:
                    product.ref || "",

                name:
                    product.name || "",

                category:
                    product.category || "",

                price:
                    Number(
                        product.price || 0
                    ),

                stock:
                    Number(
                        product.stock || 0
                    ),

                description:
                    product.description || "",

                whatsapp:
                    product.whatsapp || "",

                variants:
                    variants,

                sizes:
                    sizes,

                shipping:{

                    min:
                        Number(
                            product.shipping_min || 0
                        ),

                    max:
                        Number(
                            product.shipping_max || 0
                        )

                }

            };

        });


    renderProducts();

}


/* =====================================================
   MOSTRAR PRODUCTOS
===================================================== */

function renderProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );


    if(!PRODUCTS.length){

        container.innerHTML = `

            <div class="empty">

                Todavía no hay camisetas

    }


    container.innerHTML =
        PRODUCTS
        .map(
            (product,index) =>
                createProductHTML(
                    product,
                    index
                )
        )
        .join("");

/* =====================================================
   VARIANTE
===================================================== */

function setVariant(
    productIndex,
    variantIndex,
    openZoom = false
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !Array.isArray(
            product.variants
        )
    ){

        return;
    }


    const variants =
        product.variants;


    if(
        variantIndex < 0 ||
        variantIndex >= variants.length
    ){

        return;
    }


    const variant =
        variants[variantIndex];


    const image =
        document.getElementById(
            `image-${productIndex}`
        );


    if(!image){

        return;
    }


    image.src =
        variant.image;


    image.alt =
        product.name +
        " - " +
        variant.name;


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;
    }


    card.dataset.variant =
        variantIndex;


    card.querySelectorAll(
        ".color"
    )
    .forEach(
        (
            button,
            buttonIndex
        ) => {

            button.classList.toggle(
                "active",
                buttonIndex ===
                variantIndex
            );

        }
    );


    const colorName =
        document.getElementById(
            `color-name-${productIndex}`
        );


    if(colorName){

        colorName.textContent =
            variant.name;

    }


    const counter =
        document.getElementById(
            `gallery-counter-${productIndex}`
        );


    if(counter){

        counter.textContent =
            `${variantIndex + 1} / ${variants.length}`;

    }


    if(openZoom){

        updateLightbox();

    }

}


function selectColor(
    productIndex,
    variantIndex
){

    setVariant(
        productIndex,
        variantIndex
    );

}


function selectNextVariant(
    productIndex
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !product.variants ||
        product.variants.length < 2
    ){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    let current =
        Number(
            card.dataset.variant || 0
        );


    current++;


    if(
        current >=
        product.variants.length
    ){

        current = 0;

    }


    setVariant(
        productIndex,
        current
    );

}


function selectPreviousVariant(
    productIndex
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !product.variants ||
        product.variants.length < 2
    ){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    let current =
        Number(
            card.dataset.variant || 0
        );


    current--;


    if(current < 0){

        current =
            product.variants.length - 1;

    }


    setVariant(
        productIndex,
        current
    );

}


/* =====================================================
   SWIPE GALERÍA
===================================================== */

let galleryStartX = 0;

let galleryStartY = 0;


function galleryTouchStart(event){

    if(
        !event.touches ||
        !event.touches.length
    ){

        return;
    }


    galleryStartX =
        event.touches[0].clientX;


    galleryStartY =
        event.touches[0].clientY;

}


function galleryTouchEnd(
    event,
    productIndex
){

    if(
        !event.changedTouches ||
        !event.changedTouches.length
    ){

        return;
    }


    const endX =
        event.changedTouches[0].clientX;


    const endY =
        event.changedTouches[0].clientY;


    const diffX =
        endX -
        galleryStartX;


    const diffY =
        endY -
        galleryStartY;


    if(
        Math.abs(diffX) < 45 ||
        Math.abs(diffX) < Math.abs(diffY)
    ){

        return;
    }


    if(diffX < 0){

        selectNextVariant(
            productIndex
        );

    }else{

        selectPreviousVariant(
            productIndex
        );

    }

}


/* =====================================================
   TALLA
===================================================== */

function selectSize(
    productIndex,
    sizeIndex
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !Array.isArray(
            product.sizes
        )
    ){

        return;
    }


    const size =

    if(size === undefined){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    card.dataset.size =
        size;


    card.querySelectorAll(
        ".size"
    )
    .forEach(
        (
            button,
            buttonIndex
        ) => {

            button.classList.toggle(
                "active",
                buttonIndex === sizeIndex
            );

        }
    );

}


/* =====================================================
   CANTIDAD
===================================================== */

function changeQuantity(
    productIndex,
    change
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;
    }


    let quantity =
        Number(
            card.dataset.quantity
        );


    quantity += change;


    if(quantity < 1){

        quantity = 1;

    }


    const product =
        PRODUCTS[productIndex];


    if(
        product &&
        Number(product.stock) > 0 &&
        quantity >
        Number(product.stock)
    ){

        quantity =
            Number(product.stock);

    }


    card.dataset.quantity =
        quantity;


    const quantityElement =
        document.getElementById(
            `quantity-${productIndex}`
        );


    if(quantityElement){

        quantityElement.textContent =
            quantity;

    }

}


/* =====================================================
   COMPRAR
===================================================== */

function buyProduct(
    productIndex
){

    const product =
        PRODUCTS[productIndex];


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!product || !card){

        return;
    }


    const variant =
        product.variants[
            Number(
                card.dataset.variant || 0
            )
        ];


    const size =
        card.dataset.size ||
        "No especificada";


    const quantity =
        Number(
            card.dataset.quantity || 1
        );


    const total =
        Number(product.price) *
        quantity;


    const shipping =
        product.shipping ||
        {
            min:3,
            max:9
        };


    if(!variant){

        alert(
            "Selecciona un color."
        );

        return;
    }


    if(
        product.sizes.length &&
        !card.dataset.size
    ){

        alert(
            "Selecciona una talla antes de continuar."
        );

        return;
    }


    currentOrder = {

        product,
        variant,
        size,
        quantity,
        total,
        shipping

    };


    showOrderSummary();


    document
        .getElementById(
            "customerModal"
        )
        .classList.add(
            "show"
        );


    document.body.style.overflow =
        "hidden";


    setTimeout(
        () => {

            document
                .getElementById(
                    "customerName"
                )
                ?.focus();

        },
        150
    );

}

        showFormError(
            "Introduce el código postal."
        );

        return;
    }


    if(!city){

        showFormError(
            "Introduce la ciudad."
        );

        return;
    }


    if(!province){

        showFormError(
            "Introduce la provincia."
        );

        return;
    }


    if(!country){

        showFormError(
            "Introduce el país."
        );

        return;
    }


    if(
        email &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
    ){

        showFormError(
            "El email no parece válido."
        );

        return;
    }


    const order =
        currentOrder;


    const whatsapp =
        String(
            order.product.whatsapp ||
            ""
        )
        .replace(
            /\D/g,
            ""
        );


    if(!whatsapp){

        showFormError(
            "Este producto no tiene configurado el WhatsApp de pedidos."
        );

        return;
    }


    const message =

`🛍️ NUEVO PEDIDO

━━━━━━━━━━━━━━━━

📦 PRODUCTO

Producto:
${order.product.name}

REF:
${order.product.ref || order.product.id || ""}

Color:
${order.variant.name}

Talla:
${order.size}

Cantidad:
${order.quantity}

💰 PRECIO

Precio unidad:
${money(order.product.price)}

Total:
${money(order.total)}

🚚 ENTREGA

${order.shipping.min}–${order.shipping.max}
días laborables

━━━━━━━━━━━━━━━━

👤 DATOS DEL CLIENTE

Nombre y apellidos:
${name}

Teléfono:
${phone}

Email:
${email || "No indicado"}

📍 DIRECCIÓN DE ENVÍO

Dirección:
${address}

Número:
${number}

Piso / Puerta:
${floor || "No indicado"}

Código postal:
${postal}

Ciudad:
${city}

Provincia:
${province}

País:
${country}

📝 OBSERVACIONES:

${notes || "Ninguna"}

━━━━━━━━━━━━━━━━`;


    const whatsappURL =
        "https://wa.me/" +
        whatsapp +
        "?text=" +
        encodeURIComponent(
            message
        );


    closeCustomerModal();


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* =====================================================
   ERROR
===================================================== */

function showFormError(message){

    const error =
        document.getElementById(
            "formError"
        );


    error.textContent =
        message;


    error.classList.add(
        "show"
    );


    error.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });

}


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(
    productIndex
){

    const product =
        PRODUCTS[productIndex];


    if(
        !product ||
        !product.variants ||
        !product.variants.length
    ){

        return;
    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    lightboxProductIndex =
        productIndex;


    lightboxVariantIndex =
        card
        ?
        Number(
            card.dataset.variant || 0
        )
        :
        0;


    updateLightbox();


    document
        .getElementById(
            "imageLightbox"
        )
        .classList.add(
            "show"
        );


    document.body.style.overflow =
        "hidden";

}


function updateLightbox(){

    const product =
        PRODUCTS[
            lightboxProductIndex
        ];


    if(!product){

        return;
    }


    const variants =
        product.variants || [];


    if(!variants.length){

        return;
    }


    if(
        lightboxVariantIndex < 0
    ){

        lightboxVariantIndex =
            variants.length - 1;

    }


    if(
        lightboxVariantIndex >=
        variants.length
    ){

        lightboxVariantIndex = 0;

    }


    const variant =
        variants[
            lightboxVariantIndex
        ];


    const image =
        document.getElementById(
            "lightboxImage"
        );


    image.src =
        variant.image;


    image.alt =
        product.name +
        " - " +
        variant.name;


    document
        .getElementById(
            "lightboxCounter"
        )
        .textContent =
        `${lightboxVariantIndex + 1} / ${variants.length}`;

}


function closeLightbox(){

    document
        .getElementById(
            "imageLightbox"
        )
        .classList.remove(
            "show"
        );


    if(
        !document
            .getElementById(
                "customerModal"
            )
            .classList.contains(
                "show"
            )
    ){

        document.body.style.overflow =
            "";

    }

}


function changeLightboxImage(
    direction
){

    const product =
        PRODUCTS[
            lightboxProductIndex
        ];


    if(
        !product ||
        !product.variants ||
        product.variants.length < 2
    ){

        return;
    }


    lightboxVariantIndex +=
        direction;


    if(
        lightboxVariantIndex >=
        product.variants.length
    ){

        lightboxVariantIndex = 0;

    }


    if(
        lightboxVariantIndex < 0
    ){

        lightboxVariantIndex =
            product.variants.length - 1;

    }


    setVariant(
        lightboxProductIndex,
        lightboxVariantIndex
    );


    updateLightbox();

}


/* =====================================================
   SWIPE LIGHTBOX
===================================================== */

const lightbox =
    document.getElementById(
        "imageLightbox"
    );


lightbox.addEventListener(
    "touchstart",
    function(event){

        if(
            !event.touches ||
            !event.touches.length
        ){

            return;
        }


        lightboxTouchStartX =
            event.touches[0].clientX;

    },
    {
        passive:true
    }
);


lightbox.addEventListener(
    "touchend",
    function(event){

        if(
            !event.changedTouches ||
            !event.changedTouches.length
        ){

            return;
        }


        lightboxTouchEndX =
            event.changedTouches[0].clientX;


        const difference =
            lightboxTouchEndX -
            lightboxTouchStartX;


        if(
            Math.abs(difference) < 50
        ){

            return;
        }


        if(difference < 0){

            changeLightboxImage(1);

        }else{

            changeLightboxImage(-1);

        }

    },
    {
        passive:true
    }
);


/* =====================================================
   CERRAR LIGHTBOX
===================================================== */

lightbox.addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeLightbox();

        }

    }
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        const zoomOpen =
            document
                .getElementById(
                    "imageLightbox"
                )
                .classList.contains(
                    "show"
                );


        if(zoomOpen){

            if(
                event.key ===
                "ArrowRight"
            ){

                changeLightboxImage(1);

            }


            if(
                event.key ===
                "ArrowLeft"
            ){

                changeLightboxImage(-1);

            }


            if(
                event.key ===
                "Escape"
            ){

                closeLightbox();

            }

            return;
        }


        if(
            event.key ===
            "Escape"
        ){

            closeCustomerModal();

        }

    }
);


/* =====================================================
   ERROR IMAGEN
===================================================== */

function imageError(image){

    image.style.display =
        "none";

}


/* =====================================================
   INICIAR
===================================================== */

loadProducts();

</script>
