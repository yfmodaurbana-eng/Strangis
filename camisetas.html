<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camisetas | MI MARCA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #181818 0%,
            #303030 38%,
            #555 65%,
            #292929 100%
        );
}

header{
    position:sticky;
    top:0;
    z-index:1000;

    padding:18px 4%;

    display:flex;
    align-items:center;
    gap:30px;

    border-bottom:1px solid rgba(255,255,255,.12);

    background:rgba(25,25,25,.90);

    backdrop-filter:blur(15px);
}

.logo{
    flex-shrink:0;

    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

nav{
    flex:1;

    display:flex;
    justify-content:center;
    gap:24px;

    overflow-x:auto;
    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#999;
    text-decoration:none;

    font-size:9px;
    font-weight:bold;
    letter-spacing:1.5px;

    text-transform:uppercase;
    white-space:nowrap;
}

nav a:hover,
nav a.active{
    color:#fff;
}

.hero{
    padding:90px 5% 60px;
}

.hero small{
    color:#999;

    font-size:9px;
    font-weight:bold;
    letter-spacing:4px;
}

.hero h1{
    margin-top:18px;

    font-size:clamp(55px,10vw,110px);

    letter-spacing:-6px;
    line-height:.85;
}

.hero p{
    max-width:550px;

    margin-top:25px;

    color:#aaa;

    font-size:12px;
    line-height:1.7;
}

.products-section{
    padding:20px 5% 100px;
}

.products{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;
}

.product{
    overflow:hidden;

    padding:15px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:7px;

    background:rgba(255,255,255,.05);
}

.product-image{
    height:300px;

    margin:-15px -15px 18px;

    background:#222;

    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:.35s;
}

.product:hover .product-image img{
    transform:scale(1.04);
}

.product-name{
    font-size:14px;
    font-weight:bold;
}

.product-code{
    margin-top:6px;

    color:#777;

    font-size:8px;
    letter-spacing:1px;
}

.product-description{
    margin-top:9px;

    color:#999;

    font-size:10px;
    line-height:1.5;
}

.product-price{
    margin-top:12px;

    font-size:14px;
    font-weight:bold;
}

.label{
    margin-top:15px;

    color:#999;

    font-size:8px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.colors{
    display:flex;
    gap:9px;

    margin-top:9px;
}

.color{
    width:25px;
    height:25px;

    border:2px solid rgba(255,255,255,.25);

    border-radius:50%;

    cursor:pointer;
    padding:0;

    background-size:cover;
    background-position:center;
}

.color.active{
    outline:2px solid white;
    outline-offset:2px;
}

.sizes{
    display:flex;
    flex-wrap:wrap;

    gap:6px;

    margin-top:9px;
}

.size{
    padding:7px 10px;

    border:1px solid rgba(255,255,255,.18);

    border-radius:3px;

    color:#aaa;

    background:transparent;

    cursor:pointer;

    font-size:8px;
}

.size.active{
    background:#fff;
    color:#111;
}

.quantity{
    display:flex;
    align-items:center;

    gap:12px;

    margin-top:15px;
}

.quantity button{
    width:28px;
    height:28px;

    border:1px solid rgba(255,255,255,.2);

    background:#191919;

    color:#fff;

    cursor:pointer;
}

.quantity span{
    min-width:20px;

    text-align:center;

    font-size:11px;
}

.shipping{
    margin-top:14px;

    color:#aaa;

    font-size:9px;
}

.stock{
    margin-top:7px;

    color:#777;

    font-size:8px;
}

.buy{
    width:100%;

    margin-top:15px;

    padding:14px;

    border:0;

    border-radius:3px;

    background:#fff;

    color:#111;

    font-size:8px;
    font-weight:bold;
    letter-spacing:1.5px;

    cursor:pointer;
}

.buy:hover{
    background:#ddd;
}

.empty{
    grid-column:1 / -1;

    padding:80px 20px;

    text-align:center;

    color:#888;
}

footer{
    padding:30px 5%;

    border-top:1px solid rgba(255,255,255,.1);

    text-align:center;

    color:#777;

    font-size:8px;
}

@media(max-width:1000px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    header{
        flex-wrap:wrap;

        padding:16px 15px 9px;
    }

    .logo{
        font-size:17px;
    }

    nav{
        order:3;

        flex-basis:100%;

        justify-content:flex-start;
    }

    .hero{
        padding:60px 15px 40px;
    }

    .hero h1{
        font-size:18vw;

        letter-spacing:-4px;
    }

    .products-section{
        padding:20px 12px 70px;
    }

    .products{
        gap:9px;
    }

    .product{
        padding:10px;
    }

    .product-image{
        height:210px;

        margin:-10px -10px 12px;
    }

    .product-name{
        font-size:10px;
    }

    .product-price{
        font-size:10px;
    }

}

</style>

</head>

];


const WHATSAPP_NUMBER =
    "34674559614";


function money(value){

    return Number(value).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


function renderProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );


    if(!PRODUCTS.length){

        container.innerHTML = `

            <div class="empty">

                Todavía no hay productos
                disponibles en esta categoría.

            </div>

        `;

        return;

    }


    container.innerHTML =
        PRODUCTS
        .map(
            (product,index) =>
                createProductHTML(
                    product,
                    index
                )
        )
        .join("");

}


function createProductHTML(
    product,
    index
){

    const firstVariant =
        product.variants[0];


    const sizes =
        product.sizes || [];


    const shipping =
        product.shipping ||
        {
            min:3,
            max:9
        };


    return `

    <article

        class="product"

        id="product-${index}"

        data-variant="0"

        data-size=""

        data-quantity="1"

    >

        <div class="product-image">

            <img

                id="image-${index}"

                src="${firstVariant.image}"

                alt="${product.name}"

            >

        </div>


        <div class="product-name">

            ${product.name}

        </div>


        <div class="product-code">

            CÓDIGO:
            ${product.ref || product.id}

        </div>


        ${
            product.description
            ?
            `

            <div class="product-description">

                ${product.description}

            </div>

            `
            :
            ""
        }


        <div class="product-price">

            ${money(product.price)}

        </div>


        <div class="label">

            Color:

            <span
                id="color-name-${index}"
            >

                ${firstVariant.name}

            </span>

        </div>


        <div class="colors">

            ${
                product.variants
                .map(
                    (
                        variant,
                        variantIndex
                    ) => `

                    <button

                        class="
                            color
                            ${
                                variantIndex === 0
                                ?
                                "active"
                                :
                                ""
                            }
                        "

                        style="
                            background-image:
                            url('${variant.image}');
                        "

                        title="${variant.name}"

                        onclick="
                            selectColor(
                                ${index},
                                ${variantIndex}
                            )
                        "

                    ></button>

                    `
                )
                .join("")
            }

        </div>


        ${
            sizes.length
            ?
            `

            <div class="label">
                Talla
            </div>


            <div class="sizes">

                ${
                    sizes
                    .map(
                        size => `

                        <button

                            class="size"

                            onclick="
                                selectSize(
                                    ${index},
                                    '${size}'
                                )
                            "

                        >

                            ${size}

                        </button>

                        `
                    )
                    .join("")
                }

            </div>

            `
            :
            ""
        }


        <div class="quantity">


            <button

                onclick="
                    changeQuantity(
                        ${index},
                        -1
                    )
                "

            >

                −

            </button>


            <span
                id="quantity-${index}"
            >

                1

            </span>


            <button

                onclick="
                    changeQuantity(
                        ${index},
                        1
                    )
                "

            >

                +

            </button>


        </div>


        <div class="shipping">

            🚚 Envío estimado:

            ${shipping.min}
            –
            ${shipping.max}

            días laborables

        </div>


        ${
            product.stock !== undefined
            ?
            `

            <div class="stock">

                Stock disponible:
                ${product.stock}

            </div>

            `
            :
            ""
        }


        <button

            class="buy"

            onclick="
                buyProduct(
                    ${index}
                )
            "

        >

            COMPRAR

        </button>


    </article>

    `;

}


function selectColor(
    productIndex,
    variantIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    const variant =
        product.variants[
            variantIndex
        ];


    document.getElementById(
        `image-${productIndex}`
    ).src =
        variant.image;


    document.getElementById(
        `color-name-${productIndex}`
    ).textContent =
        variant.name;


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    card.dataset.variant =
        variantIndex;


    card
        .querySelectorAll(
            ".color"
        )
        .forEach(
            (
                button,
                index
            ) => {

                button.classList.toggle(
                    "active",
                    index === variantIndex
                );

            }
        );

}


function selectSize(
    productIndex,
    size
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    card.dataset.size =
        size;


    card
        .querySelectorAll(
            ".size"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "active",

                    button
                    .textContent
                    .trim()
                    ===
                    size

                );

            }
        );

}


function changeQuantity(
    productIndex,
    change
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    let quantity =
        Number(
            card.dataset.quantity
        );


    quantity += change;


    if(quantity < 1){

        quantity = 1;

    }


    card.dataset.quantity =
        quantity;


    document.getElementById(
        `quantity-${productIndex}`
    ).textContent =
        quantity;

}


function buyProduct(
    productIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    const variant =
        product.variants[
            Number(
                card.dataset.variant || 0
            )
        ];


    const size =
        card.dataset.size
        ||
        "No especificada";


    const quantity =
        Number(
            card.dataset.quantity
            ||
            1
        );


    const total =
        product.price *
        quantity;


    const shipping =
        product.shipping ||
        {
            min:3,
            max:9
        };


    const whatsapp =
        product.whatsapp ||
        WHATSAPP_NUMBER;


    const message = `

🛍️ NUEVO PEDIDO

━━━━━━━━━━━━━━━━

📦 PRODUCTO

Producto: ${product.name}

Código: ${product.ref || product.id}

Color: ${variant.name}

Talla: ${size}

Cantidad: ${quantity}


💰 PRECIO

Precio unidad:
${money(product.price)}

Total:
${money(total)}


🚚 ENTREGA

${shipping.min}–${shipping.max}
días laborables


━━━━━━━━━━━━━━━━

👤 DATOS DEL CLIENTE

Nombre y apellidos:

Teléfono:

Email:


📍 DIRECCIÓN DE ENVÍO

Dirección:

Número:

Piso / Puerta:

Código postal:

Ciudad:

Provincia:

País:


📝 OBSERVACIONES:


━━━━━━━━━━━━━━━━

`;


    const whatsappURL =

        "https://wa.me/"

        +

        String(whatsapp)
        .replace(/\D/g,"")

        +

        "?text="

        +

        encodeURIComponent(
            message
        );


    window.open(
        whatsappURL,
        "_blank"
    );

}


renderProducts();

</script>
