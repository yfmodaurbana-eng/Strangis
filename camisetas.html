<section class="products-section">

<footer>

<script>


/* =========================================================
   🟢🟢🟢 ZONA DE PRODUCTOS
=========================================================

   AQUÍ DEBES PEGAR LOS PRODUCTOS GENERADOS
   DESDE admin.html.

   NO BORRES:

   const PRODUCTS = [

   ];

   EJEMPLO:

   const PRODUCTS = [

       // 🟢 PEGA AQUÍ EL CÓDIGO GENERADO POR ADMIN

       {
           id: "CAM-001",
           ref: "CAM-001",
           name: "Camiseta Negra",
           category: "camisetas",
           price: 29.90,
           stock: 10,
           description: "Camiseta urbana.",
           whatsapp: "34600000000",

           variants: [
               {
                   name: "Negro",
                   image: "https://ejemplo.com/negra.jpg"
               },
               {
                   name: "Blanco",
                   image: "https://ejemplo.com/blanca.jpg"
               }
           ],

           sizes: [
               "S",
               "M",
               "L",
               "XL"
           ],

           shipping: {
               min: 3,
               max: 9
           }
       },

       // 🟢 AQUÍ PUEDES AÑADIR MÁS PRODUCTOS

   ];

========================================================= */

const PRODUCTS = [

    /* =====================================================
       🟢🟢🟢 PEGAR AQUÍ LOS PRODUCTOS GENERADOS 🟢🟢🟢

       IMPORTANTE:
       Cada producto generado por admin.html
       debe quedar dentro de estos corchetes.

       Ejemplo:

       {
           id: "CAM-001",
           ...
       },

       {
           id: "CAM-002",
           ...
       },

    ===================================================== */


    /* 🟢🟢🟢 FIN DE LA ZONA DE PRODUCTOS 🟢🟢🟢 */

];


/* =========================================================
   NÚMERO DE WHATSAPP DE RESERVA
=========================================================

   El administrador guarda el WhatsApp dentro de cada
   producto.

   Si por algún motivo un producto antiguo no tiene
   whatsapp, se utilizará este número.

========================================================= */

const DEFAULT_WHATSAPP_NUMBER =
    "34674559614";


/* =========================================================
   FORMATO DE PRECIO
========================================================= */

function money(value){

    return Number(value).toLocaleString(
        "es-ES",
        {
            style:"currency",
            currency:"EUR"
        }
    );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

function renderProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );


    if(!PRODUCTS.length){

        container.innerHTML = `

            <div class="empty">

                Todavía no hay productos
                disponibles en esta categoría.

                <br><br>

                Añade un producto desde
                <strong>admin.html</strong>.

            </div>

        `;

        return;

    }


    container.innerHTML =
        PRODUCTS
        .map(
            (product,index) =>
                createProductHTML(
                    product,
                    index
                )
        )
        .join("");

}


/* =========================================================
   CREAR TARJETA DE PRODUCTO
========================================================= */

function createProductHTML(
    product,
    index
){

    const variants =
        Array.isArray(product.variants)
        &&
        product.variants.length
        ?
        product.variants
        :
        [
            {
                name:"Principal",
                image:""
            }
        ];


    const firstVariant =
        variants[0];


    const sizes =
        Array.isArray(product.sizes)
        ?
        product.sizes
        :
        [];


    const shipping =
        product.shipping
        ||
        {
            min:3,
            max:9
        };


    const stock =
        Number(product.stock || 0);


    const whatsapp =
        product.whatsapp
        ||
        DEFAULT_WHATSAPP_NUMBER;


    return `

    <article

        class="product"

        id="product-${index}"

        data-variant="0"

        data-size=""

        data-quantity="1"

    >


        <!-- IMAGEN PRINCIPAL -->

        <div class="product-image">

            <img

                id="image-${index}"

                src="${escapeHTML(firstVariant.image)}"

                alt="${escapeHTML(product.name)}"

                loading="lazy"

                onerror="
                    this.style.display='none';
                "

            >

        </div>


        <!-- NOMBRE -->

        <div class="product-name">

            ${escapeHTML(product.name)}

        </div>


        <!-- REFERENCIA -->

        <div class="product-code">

            REF:
            ${escapeHTML(product.ref || product.id || "")}

        </div>


        <!-- DESCRIPCIÓN -->

        ${
            product.description
            ?
            `

            <div class="product-description">

                ${escapeHTML(product.description)}

            </div>

            `
            :
            ""
        }


        <!-- PRECIO -->

        <div class="product-price">

            ${money(product.price)}

        </div>


        <!-- COLOR SELECCIONADO -->

        <div class="label">

            Color:

            <span
                id="color-name-${index}"
            >

                ${escapeHTML(firstVariant.name)}

            </span>

        </div>


        <!-- COLORES -->

        <div class="colors">

            ${
                variants
                .map(
                    (variant,variantIndex) => `

                    <button

                        type="button"

                        class="
                            color
                            ${
                                variantIndex === 0
                                ?
                                "active"
                                :
                                ""
                            }
                        "

                        style="
                            background-image:
                            url('${String(
                                variant.image || ""
                            )
                            .replace(/'/g,"%27")}');
                        "

                        title="${escapeHTML(
                            variant.name
                        )}"

                        aria-label="${escapeHTML(
                            variant.name
                        )}"

                        onclick="
                            selectColor(
                                ${index},
                                ${variantIndex}
                            )
                        "

                    ></button>

                    `
                )
                .join("")
            }

        </div>


        <!-- TALLAS -->

        ${
            sizes.length
            ?
            `

            <div class="label">

                Talla

            </div>


            <div class="sizes">

                ${
                    sizes
                    .map(
                        size => `

                        <button

                            type="button"

                            class="size"

                            onclick="
                                selectSize(
                                    ${index},
                                    ${JSON.stringify(size)}
                                )
                            "

                        >

                            ${escapeHTML(size)}

                        </button>

                        `
                    )
                    .join("")
                }

            </div>

            `
            :
            ""
        }


        <!-- CANTIDAD -->

        <div class="quantity">

            <button
                type="button"
                onclick="
                    changeQuantity(
                        ${index},
                        -1
                    )
                "
            >
                −
            </button>


            <span
                id="quantity-${index}"
            >
                1
            </span>


            <button
                type="button"
                onclick="
                    changeQuantity(
                        ${index},
                        1
                    )
                "
            >
                +
            </button>

        </div>


        <!-- ENVÍO -->

        <div class="shipping">

            🚚 Envío estimado:

            ${escapeHTML(shipping.min)}
            –
            ${escapeHTML(shipping.max)}

            días laborables

        </div>


        <!-- STOCK -->

        <div
            class="
                stock
                ${stock > 0 ? "available" : "out"}
            "
        >

            ${
                stock > 0
                ?
                `Stock disponible: ${stock}`
                :
                "Producto agotado"
            }

        </div>


        <!-- BOTÓN COMPRAR -->

        <button

            type="button"

            class="buy"

            ${
                stock <= 0
                ?
                "disabled"
                :
                ""
            }

            onclick="
                buyProduct(
                    ${index}
                )
            "

        >

            ${
                stock > 0
                ?
                "COMPRAR POR WHATSAPP"
                :
                "AGOTADO"
            }

        </button>


    </article>

    `;

}


/* =========================================================
   CAMBIAR COLOR / IMAGEN
========================================================= */

function selectColor(
    productIndex,
    variantIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    if(
        !product ||
        !product.variants ||
        !product.variants[
            variantIndex
        ]
    ){

        return;

    }


    const variant =
        product.variants[
            variantIndex
        ];


    const image =
        document.getElementById(
            `image-${productIndex}`
        );


    const colorName =
        document.getElementById(
            `color-name-${productIndex}`
        );


    if(image){

        image.style.display =
            "block";

        image.src =
            variant.image;

    }


    if(colorName){

        colorName.textContent =
            variant.name;

    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;

    }


    card.dataset.variant =
        variantIndex;


    card
        .querySelectorAll(
            ".color"
        )
        .forEach(
            (
                button,
                buttonIndex
            ) => {

                button.classList.toggle(
                    "active",
                    buttonIndex === variantIndex
                );

            }
        );

}


/* =========================================================
   CAMBIAR TALLA
========================================================= */

function selectSize(
    productIndex,
    size
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;

    }


    card.dataset.size =
        size;


    card
        .querySelectorAll(
            ".size"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",

                    button
                    .textContent
                    .trim()
                    ===
                    String(size)
                );

            }
        );

}


/* =========================================================
   CANTIDAD
========================================================= */

function changeQuantity(
    productIndex,
    change
){

    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;

    }


    const product =
        PRODUCTS[
            productIndex
        ];


    let quantity =
        Number(
            card.dataset.quantity
            ||
            1
        );


    quantity +=
        Number(change);


    if(quantity < 1){

        quantity = 1;

    }


    const stock =
        Number(
            product.stock
            ||
            0
        );


    if(
        stock > 0 &&
        quantity > stock
    ){

        quantity =
            stock;

    }


    card.dataset.quantity =
        quantity;


    const quantityElement =
        document.getElementById(
            `quantity-${productIndex}`
        );


    if(quantityElement){

        quantityElement.textContent =
            quantity;

    }

}


/* =========================================================
   COMPRAR
========================================================= */

function buyProduct(
    productIndex
){

    const product =
        PRODUCTS[
            productIndex
        ];


    if(!product){

        return;

    }


    const card =
        document.getElementById(
            `product-${productIndex}`
        );


    if(!card){

        return;

    }


    const stock =
        Number(
            product.stock
            ||
            0
        );


    if(stock <= 0){

        alert(
            "Este producto está agotado."
        );

        return;

    }


    const variant =
        product.variants[
            Number(
                card.dataset.variant
                ||
                0
            )
        ];


    const size =
        card.dataset.size
        ||
        "No especificada";


    const quantity =
        Number(
            card.dataset.quantity
            ||
            1
        );


    const total =
        Number(product.price)
        *
        quantity;


    const shipping =
        product.shipping
        ||
        {
            min:3,
            max:9
        };


    const whatsapp =
        String(
            product.whatsapp
            ||
            DEFAULT_WHATSAPP_NUMBER
        )
        .replace(
            /\D/g,
            ""
        );


    const message =

`🛍️ NUEVO PEDIDO

━━━━━━━━━━━━━━━━

📦 PRODUCTO

Producto: ${product.name}

REF: ${product.ref || product.id || ""}

Categoría: Camisetas

Color: ${variant ? variant.name : "No especificado"}

Talla: ${size}

Cantidad: ${quantity}

💰 PRECIO

Precio unidad:
${money(product.price)}

Total:
${money(total)}

🚚 ENTREGA

${shipping.min}–${shipping.max}
días laborables

━━━━━━━━━━━━━━━━

👤 DATOS DEL CLIENTE

Nombre y apellidos:

Teléfono:

Email:

📍 DIRECCIÓN DE ENVÍO

Dirección:

Número:

Piso / Puerta:

Código postal:

Ciudad:

Provincia:

País:

📝 OBSERVACIONES:

━━━━━━━━━━━━━━━━
`;


    const whatsappURL =

        "https://wa.me/"

        +

        whatsapp

        +

        "?text="

        +

        encodeURIComponent(
            message
        );


    window.open(
        whatsappURL,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================================
   INICIAR WEB
========================================================= */

renderProducts();

</script>

</body>
